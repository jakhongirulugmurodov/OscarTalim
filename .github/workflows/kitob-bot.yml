# Kitob do'koni — Telegram bot GitHub Actions'da ishlaydi (server kerak emas).
#
# Har ishga tushishda bot 50 daqiqa uzluksiz ishlaydi va xabarlarga darhol
# javob beradi. Jadval har 10 daqiqada navbatdagi ishga tushishni tayyorlab
# qo'yadi: oldingisi tugashi bilan keyingisi boshlanadi. Navbatda kutib turgan
# eski ishga tushishlar "cancelled" bo'lib qoladi — bu normal holat.
# Har juma soat 09:00 da (Toshkent) Juma aksiyalarini hamma mijozga yuboradi.
# "Run workflow" tugmasi orqali: bir martalik sozlash, Juma aksiyasi yoki xabar.
#
# Kerak: Settings → Secrets and variables → Actions →
#   secret   KITOB_BOT_TOKEN   — BotFather bergan token
#   variable KITOB_ADMIN_IDS   — do'kon egasi/sotuvchilar Telegram ID lari, vergul bilan
#
# Token kiritilmagan bo'lsa, workflow hech narsa qilmay tugaydi.
# Eslatma: GitHub jadval bo'yicha ishga tushirishni faqat asosiy (main)
# shoxchadagi workflow uchun qiladi.

name: Kitob do'koni bot

# O'CHIRILGAN: do'kon uchun endi «Mutolaa» boti ishlatiladi
# (mutolaa_bot/, .github/workflows/mutolaa-bot.yml). Ikki bot bitta token bilan
# birga ishlasa, Telegram ularni to'xtatadi. Jadval olib tashlandi — faqat
# qo'lda ("Run workflow") ishga tushadi.
on:
  workflow_dispatch:
    inputs:
      rejim:
        description: "Nima qilsin"
        type: choice
        options: [xabarlar, sozlash, juma, xabar]
        default: xabarlar
      matn:
        description: "Xabar matni (faqat 'xabar' rejimi uchun)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Faqat "xabarlar" rejimi holatni o'zgartiradi va navbatda turadi;
    # sozlash, juma va xabar yuborish uni kutmay darhol ishlaydi.
    concurrency:
      group: kitob-bot-${{ (github.event.inputs.rejim || (github.event.schedule == '0 4 * * 5' && 'juma') || 'xabarlar') == 'xabarlar' && 'asosiy' || github.run_id }}
      cancel-in-progress: false
    env:
      BOT_TOKEN: ${{ secrets.KITOB_BOT_TOKEN }}
      ADMIN_IDS: ${{ vars.KITOB_ADMIN_IDS }}
      STATE_FILE: ${{ github.workspace }}/kitob_state/state.json
      REJIM: ${{ github.event.inputs.rejim || (github.event.schedule == '0 4 * * 5' && 'juma') || 'xabarlar' }}
      MATN: ${{ github.event.inputs.matn }}
    steps:
      - uses: actions/checkout@v4

      - name: Holatni tiklash
        uses: actions/cache/restore@v4
        with:
          path: kitob_state
          key: kitob-state-${{ github.run_id }}
          restore-keys: kitob-state-

      - name: Bot
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "KITOB_BOT_TOKEN kiritilmagan — o'tkazib yuborildi."
            exit 0
          fi
          mkdir -p kitob_state
          case "$REJIM" in
            sozlash) python3 kitob_bot/bot.py --setup ;;
            juma)    python3 kitob_bot/bot.py --juma ;;
            xabar)   python3 kitob_bot/bot.py --broadcast "$MATN" ;;
            *)       python3 kitob_bot/bot.py --minutes 50 ;;
          esac

      - name: Holatni saqlash
        if: always() && env.BOT_TOKEN != '' && env.REJIM == 'xabarlar'
        uses: actions/cache/save@v4
        with:
          path: kitob_state
          key: kitob-state-${{ github.run_id }}
