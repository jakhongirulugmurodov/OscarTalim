# Sehrli Javon — kitob do'koni boti GitHub Actions'da ishlaydi (server kerak emas).
#
# Har 5 daqiqada ishga tushadi va ~4,5 daqiqa davomida xabarlarni jonli
# kutib turadi (long polling) — shuning uchun bot deyarli uzluksiz javob beradi.
# "Run workflow" tugmasi orqali: bir martalik sozlash (nom, tavsif, buyruqlar).
#
# Kerak: Settings → Secrets and variables → Actions →
#   secret   KITOB_BOT_TOKEN   — BotFather bergan token (kitob boti uchun alohida)
#   variable KITOB_ADMIN_IDS   — admin(lar) Telegram ID si, vergul bilan
#
# Holat (mijozlar, savat, buyurtmalar, ombor) actions/cache'da saqlanadi.
# Doimiy ishlashi uchun o'z server/VPS'da `python3 kitob-bot/bot.py` ni
# ishga tushirish yaxshiroq — kitob-bot/README.md ga qarang.

name: Kitob bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      rejim:
        description: "Nima qilsin"
        type: choice
        options: [xabarlar, sozlash]
        default: xabarlar

concurrency:
  group: kitob-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      BOT_TOKEN: ${{ secrets.KITOB_BOT_TOKEN }}
      ADMIN_IDS: ${{ vars.KITOB_ADMIN_IDS }}
      STATE_FILE: ${{ github.workspace }}/kitob-state/holat.json
      REJIM: ${{ github.event.inputs.rejim || 'xabarlar' }}
    steps:
      - uses: actions/checkout@v4

      - name: Holatni tiklash
        uses: actions/cache/restore@v4
        with:
          path: kitob-state
          key: kitob-state-${{ github.run_id }}
          restore-keys: kitob-state-

      - name: Bot
        run: |
          mkdir -p kitob-state
          if [ -z "$BOT_TOKEN" ]; then
            echo "KITOB_BOT_TOKEN secret'i qo'shilmagan — o'tkazib yuborildi."
            exit 0
          fi
          case "$REJIM" in
            sozlash) python3 kitob-bot/bot.py --setup ;;
            *)       python3 kitob-bot/bot.py --for 270 ;;
          esac

      - name: Holatni saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kitob-state
          key: kitob-state-${{ github.run_id }}
