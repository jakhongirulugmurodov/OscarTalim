const LEVELS = [
  { id: 'A1', t: "Boshlang'ich", d: "Oddiy so'zlar, salomlashish" },

/* So'zni gap ichida marker bilan ajratish */
function HighlightIn({ sentence, word }) {
  if (!sentence) return null;
  const w = String(word || '').trim();
  if (!w) return <>{sentence}</>;
  let m = sentence.match(new RegExp(`\\b${escRe(w)}\\b`, 'i'));
  if (!m) {
    const first = w.split(/\s+/)[0].toLowerCase();
    const stem = first.length > 4 ? first.slice(0, first.length - (first.endsWith('e') || first.endsWith('y') ? 1 : 2)) : first;
    m = sentence.match(new RegExp(`\\b${escRe(stem)}[a-z'-]*`, 'i'));
  }
  if (!m) return <>{sentence}</>;
  const i = m.index;

/* =====================================================================
   2. OVOZ (speechSynthesis) VA KICHIK SIGNALLAR
   ===================================================================== */
/* Brauzerdagi "o'yinchoq" ovozlar (macOS/iOS) — talaffuzni buzadi, tanlanmaydi */
const NOVELTY_VOICES = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Zarvox|Fred|Junior|Ralph|Kathy|Hysterical|Deranged|Pipe Organ|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;

  if (!/^en[-_]/i.test(v.lang)) return -1000;
  if (NOVELTY_VOICES.test(v.name)) return -500;
  let s = 0;
  const wantUS = accent !== 'uk';
  if (wantUS ? /en[-_]US/i.test(v.lang) : /en[-_]GB/i.test(v.lang)) s += 30;
  else if (/en[-_](US|GB)/i.test(v.lang)) s += 15;
  else s += 5; // en-IN, en-AU va h.k.
  if (/Natural|Neural|Online|Premium|Enhanced|Siri/i.test(v.name)) s += 20;
  if (/Google/i.test(v.name)) s += 16;
  if (/Samantha|Alex|Ava|Allison|Susan|Tom|Aria|Jenny|Guy|Zira|David|Mark|Daniel|Serena|Kate|Oliver|Libby|Sonia|Ryan|Karen|Moira/i.test(v.name)) s += 10;
  if (v.localService === false) s += 2; // bulutdagi ovozlar odatda tabiiyroq
  return s;

/* Uzun matnni gaplarga bo'lish: Chrome ~15 soniyadan uzun gapni kesib qo'yadi */

    if (sent.length <= 180) { if (sent) out.push(sent); return; }
    let cur = '';
    (sent.match(/[^,;:]+[,;:]?\s*/g) || [sent]).map((x) => x.trim()).filter(Boolean).forEach((part) => {
      if ((cur + ' ' + part).length > 180 && cur) { out.push(cur); cur = part; } else cur = cur ? cur + ' ' + part : part;

  });

}
const TTS = {
  ok: typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function',
  voices: [],        // yaxshi ingliz ovozlari, eng yaxshisi birinchi
  preferred: '',     // foydalanuvchi tanlagan ovoz (voiceURI)
  accent: 'us',
  gen: 0,            // har stop() da oshadi — eski navbatdagi gaplar davom etmaydi
  active: false,
  listeners: new Set(),
  load() {

  pick(i = 0) {

  speak(text, { rate = 1, voiceIndex = 0, pitch = 1, onend } = {}) {

    if (speechSynthesis.paused) speechSynthesis.resume();

let _samplePromise = null;

      try {
        if (window.claude && typeof window.claude.use === 'function') return await window.claude.use('sample');

}

  const t = String(txt || '').trim();
  try { return JSON.parse(t); } catch (e) { /* davom */ }
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (f) { try { return JSON.parse(f[1]); } catch (e) { /* davom */ } }
  const s = t.search(/[\[{]/), e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (s >= 0 && e > s) { try { return JSON.parse(t.slice(s, e + 1)); } catch (err) { /* davom */ } }
  throw { code: 'invalid_json', message: 'JSON topilmadi' };
}
async function askAI(prompt, { images, tier = 'default' } = {}) {
  const full = `${prompt}\n\nIMPORTANT: Reply with ONLY one valid JSON value, exactly in the requested shape. No markdown fences, no comments, no text before or after. All Uzbek text must be in Uzbek Latin script (o', g', sh, ch).`;
  if (window.claude && typeof window.claude.complete === 'function') {

    let t;
    try { t = await window.claude.complete(full); } catch (e) { throw { code: 'upstream_error', message: String(e && e.message || e) }; }

  }

  return await s.json(full, opts);
}

  const s = await getSample();

function useAI() {
  const [st, setSt] = useState({ loading: false, error: null });
  const last = useRef(null);
  const alive = useRef(true);
  useEffect(() => () => { alive.current = false; }, []);
  const run = useCallback(async (fn) => {
    last.current = fn;
    setSt({ loading: true, error: null });
    try {
      const r = await fn();
      if (alive.current) setSt({ loading: false, error: null });
      return r;
    } catch (e) {
      console.warn('AI xato', e);
      const err = e && e.code ? e : { code: 'upstream_error', message: String(e && e.message || e) };
      if (alive.current) setSt({ loading: false, error: err });
      return undefined;
    }
  }, []);
  const retry = useCallback(() => last.current && run(last.current), [run]);
  const clear = useCallback(() => setSt({ loading: false, error: null }), []);
  return { ...st, run, retry, clear };
}
const need = (cond) => { if (!cond) throw { code: 'invalid_json', message: "Javob kutilgan shaklda emas" }; };

/* So'zlarni AI bilan to'ldirish: tarjima, IPA, turkum, misol, izoh */
async function enrichWords(items, level) {
  const out = [];
  for (let i = 0; i < items.length; i += 15) {
    const chunk = items.slice(i, i + 15);
    const list = chunk.map((x) => ({ en: x.en, uz: x.uz || '' }));
    const r = await askAI(
      `You are an English teacher for Uzbek speakers (learner level ${level}). For each item fill in a vocabulary flashcard.
Input items (keep "en" exactly; if "uz" is given keep that meaning, otherwise translate): ${JSON.stringify(list)}
Return ONLY a JSON array, same order and length, each element:
{"en":"the English word/phrase","uz":"short Uzbek translation (Latin script)","ipa":"/IPA transcription/","pos":"noun|verb|adjective|adverb|phrase|preposition|pronoun|conjunction|interjection","ex":"one short natural English example sentence (6-12 words) that contains the word, suitable for level ${level}","exUz":"Uzbek translation of the example","note":"very short Uzbek explanation or usage tip, max 12 words"}`,
    );
    need(Array.isArray(r));
    chunk.forEach((x, k) => {
      const a = r[k] && typeof r[k] === 'object' ? r[k] : (r.find((z) => z && norm(z.en) === norm(x.en)) || {});
      out.push({ ...x, uz: x.uz || a.uz || '', ipa: a.ipa || x.ipa || '', pos: a.pos || x.pos || '', ex: a.ex || x.ex || '', exUz: a.exUz || x.exUz || '', note: a.note || x.note || '' });
    });
  }
  return out;
}

function schedule(w, g, now = Date.now()) {
  let ease = w.ease || 2.5, interval = w.interval || 0, reps = w.reps || 0, lapses = w.lapses || 0, due;
  if (g === 0) {
    lapses += 1; reps = 0; interval = 0; ease = Math.max(1.3, ease - 0.2);
    due = now + 10 * 60 * 1000;                           // 10 daqiqadan keyin qaytadi
  } else if (g === 1) {
    ease = Math.max(1.3, ease - 0.15);
    interval = reps === 0 ? 1 : Math.max(1, Math.round(interval * 1.2));
    reps += 1; due = now + interval * DAY;
  } else {
    ease = Math.min(3.0, ease + 0.1);
    interval = reps === 0 ? 1 : reps === 1 ? 3 : Math.round(interval * ease);
    reps += 1; due = now + interval * DAY;
  }
  return { ...w, ease, interval, reps, lapses, due, seen: true, last: now };
}
function nextLabel(w, g) {
  const s = schedule(w, g);
  if (g === 0) return '10 daq';
  return s.interval === 1 ? '1 kun' : s.interval < 30 ? `${s.interval} kun` : `${Math.round(s.interval / 30)} oy`;
}

function ensureDay(d) {
  const k = dayKey();
  d.stats.days[k] = d.stats.days[k] || { xp: 0, reviewed: 0, ids: [], correct: 0, goalHit: false };
  // eski kunlardagi id ro'yxatini tozalash, 60 kundan eskisini o'chirish
  Object.keys(d.stats.days).forEach((key) => {
    if (key !== k) delete d.stats.days[key].ids;
    if (Date.now() - new Date(key).getTime() > 60 * DAY) delete d.stats.days[key];
  });
  return d.stats.days[k];
}
function touchStreak(d) {
  const k = dayKey(), y = dayKey(Date.now() - DAY);
  if (d.stats.lastDay === k) return;
  d.stats.streak = d.stats.lastDay === y ? (d.stats.streak || 0) + 1 : 1;
  d.stats.lastDay = k;
}
function addXP(d, n) {

  d.stats.xp += n;
  ensureDay(d).xp += n;
  touchStreak(d);
}

/* Konfetti — oddiy canvas */
function Confetti({ fire }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!fire) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = ref.current; if (!c) return;
    const ctx = c.getContext('2d');
    const W = (c.width = window.innerWidth), H = (c.height = window.innerHeight);
    const cols = ['#0C766E', '#FFD648', '#16A34A', '#F97316', '#3B82F6', '#EC4899'];
    const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3 }));
    let raf, t = 0;
    const tick = () => {
      t++; ctx.clearRect(0, 0, W, H);
      ps.forEach((p) => { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (t < 170) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, [fire]);
  return <canvas ref={ref} className="fixed inset-0 pointer-events-none z-[90]" aria-hidden="true" />;
}

/* =====================================================================
   9. BOSILADIGAN MATN (Reading / Listening)
   ===================================================================== */
function sentenceAround(text, idx) {
  const before = text.slice(0, idx), after = text.slice(idx);
  const s = Math.max(before.lastIndexOf('. '), before.lastIndexOf('! '), before.lastIndexOf('? '), before.lastIndexOf('\n'));
  const eRel = after.search(/[.!?](\s|$)/);
  return text.slice(s < 0 ? 0 : s + 1, eRel < 0 ? text.length : idx + eRel + 1).trim();
}
function ClickableText({ text, known, newForms, onWord }) {
  const parts = [];
  const re = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ t: text.slice(last, m.index) });
    parts.push({ w: m[0], i: m.index });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ t: text.slice(last) });
  return (
    <>
      {parts.map((p, k) => {
        if (p.t !== undefined) return <span key={k}>{p.t}</span>;
        const low = p.w.toLowerCase();
        const isNew = newForms.has(low);
        const isKnown = !isNew && known(low);
        return (
          <span key={k} role="button" tabIndex={0}
            onClick={() => onWord(p.w, sentenceAround(text, p.i))}
            onKeyDown={(e) => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), onWord(p.w, sentenceAround(text, p.i)))}
            className={`word-btn ${isNew ? 'hl bg-marker text-onmarker px-0.5' : ''} ${isKnown ? 'word-known' : ''}`}>{p.w}</span>
        );
      })}
    </>
  );
}
function knownMatcher(words) {
  const set = new Set();
  words.forEach((w) => { const e = norm(w.en); if (e && !e.includes(' ')) set.add(e); });
  return (low) => {
    if (set.has(low)) return true;
    for (const suf of ['s', 'es', 'ed', 'd', 'ing', 'ly', 'er', 'est', "'s"]) {
      if (low.endsWith(suf)) { const b = low.slice(0, -suf.length); if (set.has(b) || set.has(b + 'e')) return true; }
    }
    if (low.endsWith('ied') || low.endsWith('ies')) return set.has(low.slice(0, -3) + 'y');
    return false;
  };
}

/* So'z haqida oyna: tarjima + lug'atga qo'shish */
function WordSheet({ req, onClose, state, onAdd, level }) {
  const ai = useAI();
  const [info, setInfo] = useState(null);
  const [added, setAdded] = useState(false);
  const cache = useRef({});
  useEffect(() => {
    if (!req) return;
    setAdded(false); setInfo(null); ai.clear();
    const low = req.word.toLowerCase();
    const inVocab = state.words.find((w) => norm(w.en) === low || knownMatcher([w])(low));
    if (inVocab) { setInfo({ ...inVocab, inVocab: true }); return; }
    const g = (req.glossary || []).find((x) => norm(x.form) === low || norm(x.en) === low);
    if (cache.current[low]) { setInfo(cache.current[low]); return; }
    if (g && g.uz) setInfo({ en: g.en, uz: g.uz, ipa: g.ipa || '', pos: g.pos || '', partial: true });
    ai.run(async () => {
      const r = await askAI(`An Uzbek learner of English (level ${level}) tapped the word "${req.word}" in this sentence: "${req.sentence}".
Return ONLY JSON: {"en":"dictionary base form","uz":"short Uzbek translation that fits this context","ipa":"/IPA/","pos":"noun|verb|adjective|adverb|phrase|...","ex":"a short natural example sentence using the word (6-12 words)","exUz":"Uzbek translation of that example","note":"very short Uzbek usage note, max 12 words"}`, { tier: 'quick' });
      need(r && r.uz);
      cache.current[low] = r;
      setInfo(r);
    });
    // eslint-disable-next-line
  }, [req]);
  if (!req) return null;
  const add = () => {
    if (!info) return;
    onAdd({ en: info.en || req.word, uz: info.uz, ipa: info.ipa, pos: info.pos, ex: info.ex || req.sentence, exUz: info.exUz || '', note: info.note || '' }, req.deckName);
    setAdded(true);
  };
  return (
    <Sheet open={!!req} onClose={onClose} title="So'z">
      <div className="flex items-start gap-3 mb-3">
        <div className="flex-1 min-w-0">
          <p className="font-display text-3xl font-extrabold break-words">{(info && info.en) || req.word}</p>
          {info && info.ipa && <p className="ipa text-muted">{info.ipa} {info.pos && <span className="italic">· {info.pos}</span>}</p>}
        </div>
        <SpeakBtn text={(info && info.en) || req.word} />
      </div>
      {info && <p className="text-xl font-bold mb-2">{info.uz}</p>}
      {info && info.note && <p className="text-sm text-muted mb-3">{info.note}</p>}
      {ai.loading && !info && <div className="py-2"><Spinner label="Tarjima qilinmoqda…" /><div className="mt-3"><Skeleton lines={2} /></div></div>}
      <AIError error={ai.error} onRetry={ai.retry} />
      <p className="text-sm bg-sunken rounded-2xl p-3 my-3"><HighlightIn sentence={req.sentence} word={req.word} /></p>
      {info && info.inVocab ? <Pill tone="good">Lug'atingizda bor · {STATUS_UZ[wordStatus(info)]}</Pill>
        : added ? <p className="text-good font-bold flex items-center gap-2 anim-pop"><Icon d={I.check} />Kartochka qo'shildi</p>
        : <Btn onClick={add} disabled={!info || !info.uz} className="w-full"><Icon d={I.plus} className="w-5 h-5" />Lug'atga qo'shish</Btn>}
    </Sheet>
  );
}

function FlashCard({ w, flipped, onFlip, onSwipe }) {
  const [dx, setDx] = useState(0);
  const start = useRef(null);
  const moved = useRef(false);
  const down = (e) => {
    if (e.target.closest && e.target.closest('button')) return; // 🔊 tugmasi kartani aylantirmaydi
    start.current = { x: e.clientX, y: e.clientY }; moved.current = false;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* */ }
  };
  const move = (e) => {
    if (!start.current) return;
    const d = e.clientX - start.current.x;
    if (Math.abs(d) > 8) moved.current = true;
    setDx(d);
  };
  const up = () => {
    if (!start.current) return;
    const d = dx; start.current = null; setDx(0);
    if (d > 90) onSwipe(2); else if (d < -90) onSwipe(0);
    else if (!moved.current) onFlip();
  };
  const tint = dx > 30 ? `rgb(var(--good) / ${Math.min(0.25, dx / 500)})` : dx < -30 ? `rgb(var(--bad) / ${Math.min(0.25, -dx / 500)})` : 'transparent';
  return (
    <div className="flip-scene select-none" style={{ touchAction: 'pan-y' }}>
      <div
        className={`flip-card h-[400px] cursor-pointer ${flipped ? 'is-flipped' : ''}`}
        style={{ transform: `translateX(${dx}px) rotate(${dx / 25}deg) ${flipped ? 'rotateY(180deg)' : ''}`, transition: start.current ? 'none' : undefined }}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={() => { start.current = null; setDx(0); }}
        role="button" tabIndex={0} aria-label="Kartani aylantirish"
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); onFlip(); } }}>
        {/* OLDI */}
        <div className="flip-face bg-surface rounded-[28px] shadow-lift p-6 flex flex-col" style={{ background: `linear-gradient(${tint}, ${tint}), rgb(var(--surface))` }}>
          <div className="flex items-center justify-between">
            <Pill tone={statusTone[wordStatus(w)]}>{STATUS_UZ[wordStatus(w)]}</Pill>
            <SpeakBtn parts={[w.en, w.ex]} label="So'z va gapni tinglash" />
          </div>
          <div className="flex-1 flex flex-col justify-center text-center">
            <p className="font-display text-[42px] leading-tight font-extrabold break-words">{w.en}</p>
            {w.ipa && <p className="ipa text-lg text-muted mt-1">{w.ipa}</p>}
            {w.ex && <p className="mt-6 text-lg leading-relaxed"><HighlightIn sentence={w.ex} word={w.en} /></p>}
          </div>
          <p className="text-center text-xs text-muted">Bosing — tarjima · Chapga: bilmadim · O'ngga: bildim</p>
        </div>
        {/* ORQASI */}
        <div className="flip-face flip-back bg-surface rounded-[28px] shadow-lift p-6 flex flex-col ruled" style={{ backgroundColor: 'rgb(var(--surface))' }}>
          <div className="flex items-center justify-between">
            {w.pos ? <Pill tone="primary">{w.pos}</Pill> : <span />}
            <SpeakBtn text={w.en} />
          </div>
          <div className="flex-1 flex flex-col justify-center text-center gap-3">
            <p className="text-sm text-muted">{w.en}</p>
            <p className="font-display text-4xl font-extrabold leading-tight break-words">{w.uz || '—'}</p>
            {w.note && <p className="text-muted">{w.note}</p>}
            {w.exUz && <p className="text-lg italic mt-2">«{w.exUz}»</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

function Study({ S, deckId, upd, onExit, reward }) {
  const build = () => {
    const now = Date.now();
    const pool = S.words.filter((w) => !deckId || w.deckId === deckId);
    const due = pool.filter((w) => isDue(w, now)).sort((a, b) => a.due - b.due);
    const today = S.stats.days[dayKey()] || { reviewed: 0 };
    const room = Math.max(S.profile.goal - today.reviewed, 5);
    const fresh = pool.filter((w) => !w.seen).slice(0, Math.max(0, room - due.length) || (due.length ? 0 : 5));
    let q = [...due, ...fresh].map((w) => w.id);
    if (!q.length) q = pick(pool, Math.min(10, pool.length)).map((w) => w.id); // erkin mashq
    return q.slice(0, 40);
  };
  const [queue, setQueue] = useState(build);
  const [free] = useState(() => { const now = Date.now(); return !S.words.some((w) => (!deckId || w.deckId === deckId) && (isDue(w, now) || !w.seen)); });
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState({ n: 0, good: 0, hard: 0, bad: 0 });
  const [anim, setAnim] = useState(0);
  const w = S.words.find((x) => x.id === queue[0]);

  const grade = useCallback((g) => {
    if (!w) return;
    TTS.stop();
    upd((d) => {
      const i = d.words.findIndex((x) => x.id === w.id);
      if (i < 0) return;
      d.words[i] = schedule(d.words[i], g);
      const day = ensureDay(d);
      if (!day.ids) day.ids = [];
      if (!day.ids.includes(w.id)) { day.ids.push(w.id); day.reviewed += 1; }
      if (g > 0) day.correct += 1;
      addXP(d, g === 2 ? 10 : g === 1 ? 5 : 1);
    });
    reward(g === 2 ? 10 : g === 1 ? 5 : 1, g > 0);
    setDone((s) => ({ ...s, n: s.n + 1, good: s.good + (g === 2), hard: s.hard + (g === 1), bad: s.bad + (g === 0) }));
    setFlipped(false);
    setAnim((a) => a + 1);
    setQueue((q) => { const rest = q.slice(1); if (g === 0) rest.splice(Math.min(3, rest.length), 0, w.id); return rest; });
  }, [w, upd, reward]);

  useEffect(() => {
    const k = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === ' ') { e.preventDefault(); setFlipped((f) => !f); }
      if (e.key === '1') grade(0); if (e.key === '2') grade(1); if (e.key === '3') grade(2);
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [grade]);

  useEffect(() => {
    if (!done.n || queue.length) return;
    upd((d) => { d.stats.results.unshift({ type: 'Kartochkalar', score: done.good + done.hard, total: done.n, at: Date.now() }); d.stats.results = d.stats.results.slice(0, 20); });
    // eslint-disable-next-line
  }, [queue.length]);

  if (!w) {
    return (
      <div className="text-center py-10 anim-up">
        <p className="text-6xl mb-3">🎉</p>
        <h2 className="font-display text-3xl font-extrabold mb-2">Seans tugadi!</h2>
        <p className="text-muted mb-6">{done.n} ta javob: <span className="text-good font-bold">{done.good} bildim</span> · <span className="text-warn font-bold">{done.hard} qiyin</span> · <span className="text-bad font-bold">{done.bad} bilmadim</span></p>
        <div className="flex flex-col gap-3 max-w-xs mx-auto">
          <Btn onClick={() => { setQueue(build()); setDone({ n: 0, good: 0, hard: 0, bad: 0 }); }}>Yana mashq qilish</Btn>
          <Btn kind="soft" onClick={onExit}>Lug'atga qaytish</Btn>
        </div>
      </div>
    );
  }
  const total = done.n + queue.length;
  return (
    <div>
      <BackBar title={free ? 'Erkin mashq' : 'Takrorlash'} onBack={onExit} right={<span className="text-sm text-muted num">{queue.length} qoldi</span>} />
      <div className="h-2 rounded-full bg-sunken overflow-hidden mb-5"><div className="h-full bg-primary transition-all" style={{ width: `${(done.n / total) * 100}%` }} /></div>
      <div key={anim} className="anim-up"><FlashCard w={w} flipped={flipped} onFlip={() => setFlipped((f) => !f)} onSwipe={grade} /></div>
      <div className="mt-5">
        {!flipped ? (
          <Btn size="lg" kind="soft" className="w-full" onClick={() => setFlipped(true)}>Tarjimani ko'rish</Btn>
        ) : (
          <div className="grid grid-cols-3 gap-2">
            <Btn kind="bad" size="lg" className="flex-col !gap-0 !py-2" onClick={() => grade(0)}><span>Bilmadim</span><span className="text-xs font-normal opacity-90">{nextLabel(w, 0)}</span></Btn>
            <Btn kind="warn" size="lg" className="flex-col !gap-0 !py-2" onClick={() => grade(1)}><span>Qiyin</span><span className="text-xs font-normal opacity-90">{nextLabel(w, 1)}</span></Btn>
            <Btn kind="good" size="lg" className="flex-col !gap-0 !py-2" onClick={() => grade(2)}><span>Bildim</span><span className="text-xs font-normal opacity-90">{nextLabel(w, 2)}</span></Btn>
          </div>
        )}
        <p className="text-center text-xs text-muted mt-3 hidden sm:block">Klaviatura: Probel — aylantirish · 1 / 2 / 3 — javob</p>
      </div>
    </div>
  );
}

function makeOptions(pool, w, field) {
  const others = shuffle(pool.filter((x) => x.id !== w.id && norm(x[field]) !== norm(w[field]))).slice(0, 3).map((x) => x[field]);
  return shuffle([w[field], ...others]);
}
function Quiz({ pool, reward, onExit, saveResult }) {
  const build = () => pick(pool, Math.min(10, pool.length)).map((w) => { const dir = Math.random() < 0.5 ? 'en' : 'uz'; return { w, dir, opts: makeOptions(pool, w, dir === 'en' ? 'uz' : 'en') }; });
  const [qs, setQs] = useState(build);

  const [picked, setPicked] = useState(null);

  const q = qs[i], answer = q.dir === 'en' ? q.w.uz : q.w.en;

    setTimeout(() => { setPicked(null); if (i + 1 >= qs.length) saveResult('Quiz', score + (ok ? 1 : 0), qs.length); setI(i + 1); }, ok ? 700 : 1300);
  };
  return (

        <p className="font-display text-4xl font-extrabold break-words">{q.dir === 'en' ? q.w.en : q.w.uz}</p>
        {q.dir === 'en' && <div className="mt-3"><SpeakBtn text={q.w.en} /></div>}
      </Card>
      <div className="grid gap-3">
        {q.opts.map((o) => {
          let cls = 'bg-surface border-line hover:border-primary';
          if (picked !== null && o === answer) cls = 'bg-good/15 border-good anim-pop';

          return <button key={o} type="button" onClick={() => choose(o)} className={`min-h-[56px] rounded-2xl border-2 px-4 py-3 font-bold text-lg transition ${cls}`}>{o}</button>;
        })}
      </div>
    </div>
  );

function Match({ pool, reward, onExit, saveResult, best }) {
  const build = () => { const ws = pick(pool, Math.min(6, pool.length)); return { ws, left: shuffle(ws), right: shuffle(ws) }; };
  const [g, setG] = useState(build);
  const [sel, setSel] = useState(null);
  const [okIds, setOk] = useState([]);
  const [wrong, setWrong] = useState(null);
  const [t0, setT0] = useState(Date.now());
  const [now, setNow] = useState(Date.now());

  const finished = okIds.length === g.ws.length;
  useEffect(() => { if (finished) return; const t = setInterval(() => setNow(Date.now()), 100); return () => clearInterval(t); }, [finished]);
  const time = ((now - t0) / 1000 + penalty).toFixed(1);
  useEffect(() => { if (finished) saveResult('Match', g.ws.length, g.ws.length, `${time} s`, { key: 'match', value: Number(time), lower: true }); /* eslint-disable-next-line */ }, [finished]);
  const again = () => { setG(build()); setOk([]); setSel(null); setT0(Date.now()); setNow(Date.now()); setPenalty(0); };
  if (finished) return <GameEnd title="Match" big={`${time} s`} sub={best ? `Eng yaxshi natija: ${best} s` : 'Birinchi natijangiz!'} onAgain={again} onExit={onExit} />;

    if (!sel || okIds.includes(w.id)) return;

    else { setWrong(w.id); setPenalty((p) => p + 2); reward(0, false); setTimeout(() => setWrong(null), 600); }

  const tile = 'min-h-[60px] rounded-2xl border-2 px-3 py-2 font-bold transition text-center break-words';
  return (

        <div className="grid gap-3">{g.right.map((w) => <button key={w.id} type="button" disabled={okIds.includes(w.id)} onClick={() => clickRight(w)} className={`${tile} ${okIds.includes(w.id) ? 'opacity-0' : wrong === w.id ? 'border-bad bg-bad/10 anim-shake' : 'border-line bg-surface'}`}>{w.uz}</button>)}</div>
      </div>
    </div>
  );
}

function Speed({ pool, reward, onExit, saveResult, best }) {

  const choose = (o) => {
    const ok = o === q.w.uz;

      </Card>
      <div className="grid grid-cols-2 gap-3">
        {q.opts.map((o) => <button key={o} type="button" onClick={() => choose(o)} className="min-h-[64px] rounded-2xl border-2 border-line bg-surface px-3 py-2 font-bold hover:border-primary active:scale-95 transition">{o}</button>)}
      </div>
    </div>
  );
}

function parseLines(text) {
  const seps = ['\t', ' — ', ' – ', ' - ', '—', '–', ' : ', ':', ' = ', '=', ',', ' -', '- ', '-'];
  return text.split(/\r?\n/).map((l) => l.replace(/^\s*(\d+[.)]|[•*·-])\s+/, '').trim()).filter(Boolean).map((l) => {
    for (const s of seps) {
      const i = l.indexOf(s);
      if (i > 0) return { en: l.slice(0, i).trim(), uz: l.slice(i + s.length).trim() };
    }
    return { en: l, uz: '' };
  }).filter((x) => x.en);
}
function ReviewSheet({ items, setItems, onSave, onClose, existing, enriching, aiError, onRetry }) {
  const [open, setOpen] = useState(null);
  const set = (i, k, v) => setItems(items.map((x, j) => (j === i ? { ...x, [k]: v } : x)));
  const del = (i) => setItems(items.filter((_, j) => j !== i));
  const exists = (x) => existing.has(norm(x.en));
  const valid = items.filter((x) => x.en.trim() && x.uz.trim() && !exists(x));
  return (
    <Sheet open onClose={onClose} title={`Tekshiring (${items.length})`} wide>
      <p className="text-sm text-muted mb-3">Saqlashdan oldin har bir kartani tahrirlang yoki o'chiring. Batafsil maydonlar uchun kartani oching.</p>
      {enriching && <div className="mb-3 rounded-2xl bg-primary/10 p-3"><Spinner label="AI transkripsiya, misol va izohlarni to'ldirmoqda…" /></div>}
      {aiError && <div className="mb-3"><AIError error={aiError} onRetry={onRetry} /><p className="text-xs text-muted mt-2">AI'siz ham saqlash mumkin — faqat tarjimani to'ldiring.</p></div>}
      <ul className="space-y-2 mb-4">
        {items.map((x, i) => (
          <li key={i} className={`rounded-2xl border-2 ${exists(x) ? 'border-warn/50' : 'border-line'} p-3`}>
            <div className="flex gap-2 items-center">
              <input id={`rv-en-${i}`} aria-label="Inglizcha" className={`${inputCls} !py-2 font-bold`} value={x.en} onChange={(e) => set(i, 'en', e.target.value)} />
              <input id={`rv-uz-${i}`} aria-label="Tarjima" className={`${inputCls} !py-2 ${!x.uz.trim() ? '!border-bad/60' : ''}`} value={x.uz} placeholder="tarjima" onChange={(e) => set(i, 'uz', e.target.value)} />
              <button type="button" onClick={() => del(i)} className="w-10 h-10 shrink-0 rounded-full hover:bg-bad/10 text-bad grid place-items-center" aria-label="O'chirish"><Icon d={I.trash} className="w-5 h-5" /></button>
            </div>
            <div className="flex items-center gap-2 mt-2 flex-wrap">
              {exists(x) && <Pill tone="warn">Lug'atda bor — saqlanmaydi</Pill>}
              {x.ipa && <span className="ipa text-sm text-muted">{x.ipa}</span>}
              {x.pos && <Pill>{x.pos}</Pill>}
              <button type="button" className="text-sm text-primary font-bold ml-auto" onClick={() => setOpen(open === i ? null : i)}>{open === i ? 'Yopish' : 'Batafsil'}</button>
            </div>
            {open === i && (
              <div className="grid gap-2 mt-3 anim-up">
                {[['ipa', 'Transkripsiya (IPA)'], ['pos', "So'z turkumi"], ['ex', 'Misol gap (EN)'], ['exUz', 'Misol tarjimasi'], ['note', 'Izoh']].map(([k, l]) => (
                  <Field key={k} label={l} id={`rv-${k}-${i}`}><input id={`rv-${k}-${i}`} className={`${inputCls} !py-2 ${k === 'ipa' ? 'ipa' : ''}`} value={x[k] || ''} onChange={(e) => set(i, k, e.target.value)} /></Field>
                ))}
              </div>
            )}
          </li>
        ))}
      </ul>
      <Btn size="lg" className="w-full" disabled={!valid.length || enriching} onClick={() => onSave(valid)}><Icon d={I.check} />{valid.length} ta kartani saqlash</Btn>
    </Sheet>
  );
}

function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s);
  });
}

function AddWords({ S, upd, onExit, reward, initialDeck }) {
  const [mode, setMode] = useState('manual');
  const [deck, setDeck] = useState(initialDeck || S.decks[0].id);
  const [newDeck, setNewDeck] = useState('');
  const [text, setText] = useState('');
  const [enList, setEnList] = useState('');
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [ocrStatus, setOcrStatus] = useState('');
  const [rawText, setRawText] = useState('');
  const [items, setItems] = useState(null);
  const [saved, setSaved] = useState(0);
  const ai = useAI();
  const existing = useMemo(() => {
    const did = deck === '__new' ? null : deck;
    return new Set(S.words.filter((w) => w.deckId === did).map((w) => norm(w.en)));
  }, [S.words, deck]);
  const level = S.profile.level;

  const enrich = (list) => {
    setItems(list);
    ai.run(async () => {
      const r = await enrichWords(list, level);
      setItems((cur) => {
        // foydalanuvchi o'zgartirgan maydonlarni saqlab qolish
        const byEn = new Map(r.map((x) => [norm(x.en), x]));
        return (cur || list).map((x) => { const a = byEn.get(norm(x.en)) || {}; return { ...a, ...Object.fromEntries(Object.entries(x).filter(([, v]) => v)) }; });
      });
    });
  };
  const fromManual = () => { const l = parseLines(text); if (l.length) enrich(l.slice(0, 120)); };
  const fromEnglish = () => {
    const l = enList.split(/[\n,;]+/).map((x) => x.replace(/^\s*(\d+[.)]|[•*·-])\s+/, '').trim()).filter(Boolean).map((en) => ({ en, uz: '' }));
    if (l.length) enrich(l.slice(0, 120));
  };
  const onFile = (f) => {
    if (!f) return;
    setFile(f); setRawText(''); setOcrStatus('');
    const r = new FileReader(); r.onload = () => setPreview(r.result); r.readAsDataURL(f);
  };
  const readImage = () => ai.run(async () => {
    setOcrStatus('');
    // 1-yo'l: AI rasmni o'zi ko'radi (Artifact imkon bersa)
    if (await aiCanSeeImages()) {
      setOcrStatus('AI rasmni o\'qimoqda…');
      const r = await askAI(`The image is a photo of a vocabulary list from a notebook or textbook (English words with Uzbek or Russian translations, possibly handwritten).
Extract every English word/phrase with its translation. Translate into Uzbek (Latin) if the translation is missing or in Russian. Ignore page numbers and headers.
Return ONLY a JSON array: [{"en":"...","uz":"...","ipa":"/IPA/","pos":"noun|verb|adjective|...","ex":"short natural example sentence for level ${level}","exUz":"Uzbek translation","note":"very short Uzbek note"}]`, { images: [file] });
      need(Array.isArray(r) && r.length);
      setItems(r.filter((x) => x && x.en).map((x) => ({ en: String(x.en), uz: String(x.uz || ''), ipa: x.ipa || '', pos: x.pos || '', ex: x.ex || '', exUz: x.exUz || '', note: x.note || '' })));
      setOcrStatus('');
      return;
    }
    // 2-yo'l: Tesseract.js (eng) -> xom matn -> AI juftlarga ajratadi
    setOcrStatus('Tesseract yuklanmoqda…');
    let raw = '';
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      const worker = await window.Tesseract.createWorker('eng', 1, { logger: (m) => { if (m.status === 'recognizing text') setOcrStatus(`Matn o'qilmoqda… ${Math.round(m.progress * 100)}%`); } });
      const { data } = await worker.recognize(file);
      await worker.terminate();
      raw = data.text || '';
    } catch (e) {
      setOcrStatus('');
      throw { code: 'ocr_failed' };
    }
    setRawText(raw);
    if (!raw.trim()) { setOcrStatus(''); throw { code: 'ocr_empty' }; }
    setOcrStatus('AI so\'z va tarjimalarni ajratmoqda…');
    const r = await askAI(`This is raw OCR text (may contain errors) from a photo of a vocabulary list with English words and translations:
"""${raw.slice(0, 6000)}"""
Fix obvious OCR mistakes and extract English word/phrase + Uzbek translation pairs (translate to Uzbek Latin if missing or in another language). Skip junk.
Return ONLY a JSON array: [{"en":"...","uz":"...","ipa":"/IPA/","pos":"...","ex":"short example sentence for level ${level}","exUz":"Uzbek translation","note":"very short Uzbek note"}]`);
    need(Array.isArray(r));
    setItems(r.filter((x) => x && x.en).map((x) => ({ en: String(x.en), uz: String(x.uz || ''), ipa: x.ipa || '', pos: x.pos || '', ex: x.ex || '', exUz: x.exUz || '', note: x.note || '' })));
    setOcrStatus('');
  });
  const save = (valid) => {
    let did = deck;
    upd((d) => {
      if (deck === '__new') { did = 'd-' + uid(); d.decks.push({ id: did, name: newDeck.trim() || "Yangi to'plam" }); }
      valid.forEach((x) => d.words.push(newWord(x, did)));
      addXP(d, valid.length * 2);
    });
    reward(valid.length * 2, true);
    setSaved(valid.length); setItems(null); setText(''); setEnList(''); setFile(null); setPreview(null); setRawText('');
    if (deck === '__new') { setDeck(did); setNewDeck(''); }
  };
  const ocrErr = ai.error && (ai.error.code === 'ocr_failed' || ai.error.code === 'ocr_empty');
  return (
    <div>
      <BackBar title="So'z qo'shish" onBack={onExit} />
      {saved > 0 && <div className="rounded-2xl bg-good/15 text-good font-bold p-3 mb-4 anim-pop flex items-center gap-2"><Icon d={I.check} />{saved} ta yangi kartochka qo'shildi</div>}
      <div className="space-y-4">
        <Field label="Qaysi to'plamga?" id="add-deck">
          <select id="add-deck" className={inputCls} value={deck} onChange={(e) => setDeck(e.target.value)}>
            {S.decks.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            <option value="__new">+ Yangi to'plam…</option>
          </select>
        </Field>
        {deck === '__new' && <Field label="Yangi to'plam nomi" id="add-newdeck"><input id="add-newdeck" className={inputCls} value={newDeck} onChange={(e) => setNewDeck(e.target.value)} placeholder="Masalan: Unit 3, Travel" /></Field>}
        <Segmented value={mode} onChange={(m) => { setMode(m); ai.clear(); }} options={[{ value: 'manual', label: 'Qo\'lda' }, { value: 'photo', label: 'Rasmdan' }, { value: 'english', label: 'Faqat inglizcha' }]} />

        {mode === 'manual' && (
          <Card className="p-4 space-y-3">
            <Field label="Har qatorda bitta: so'z - tarjima" id="add-manual" hint="Ajratgich: -  :  —  tab yoki vergul. Ro'yxatni ko'chirib qo'yish ham mumkin.">
              <textarea id="add-manual" rows={8} className={`${inputCls} font-mono text-sm`} value={text} onChange={(e) => setText(e.target.value)} placeholder={'apple - olma\nborrow: qarzga olmoq\ntravel — sayohat qilmoq'} />
            </Field>
            <p className="text-sm text-muted">Topildi: <b className="num">{parseLines(text).length}</b> ta so'z</p>
            <Btn className="w-full" disabled={!parseLines(text).length} onClick={fromManual}>Davom etish</Btn>
          </Card>
        )}

        {mode === 'english' && (
          <Card className="p-4 space-y-3">
            <Field label="Faqat inglizcha so'zlar" id="add-en" hint="Har qatorda bittadan yoki vergul bilan. Tarjima, ma'no va misol gapni AI to'ldiradi.">
              <textarea id="add-en" rows={8} className={`${inputCls} font-mono text-sm`} value={enList} onChange={(e) => setEnList(e.target.value)} placeholder={'curious\nlook forward to\nachieve'} />
            </Field>
            <Btn className="w-full" disabled={!enList.trim()} onClick={fromEnglish}><Icon d={I.sparkle} className="w-5 h-5" />AI bilan to'ldirish</Btn>
          </Card>
        )}

        {mode === 'photo' && (
          <Card className="p-4 space-y-3">
            <label htmlFor="add-photo" className="flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-line hover:border-primary p-6 cursor-pointer text-center">
              {preview ? <img src={preview} alt="Tanlangan rasm" className="max-h-60 rounded-xl" /> : <><Icon d={I.camera} className="w-10 h-10 text-primary" /><span className="font-bold">Lug'at rasmini tanlang</span><span className="text-sm text-muted">Daftar yoki kitob sahifasi, yaxshi yoritilgan</span></>}
            </label>
            <input id="add-photo" type="file" accept="image/*" className="sr-only" onChange={(e) => onFile(e.target.files && e.target.files[0])} />
            {file && <Btn className="w-full" disabled={ai.loading} onClick={readImage}><Icon d={I.sparkle} className="w-5 h-5" />Rasmdagi so'zlarni o'qish</Btn>}
            {ocrStatus && <Spinner label={ocrStatus} />}
            {ocrErr && <div className="rounded-2xl border-2 border-bad/40 bg-bad/10 p-4 text-sm">
              <p className="font-bold text-bad mb-1">Rasmni o'qib bo'lmadi</p>
              <p className="mb-3">{ai.error.code === 'ocr_empty' ? "Rasmda matn topilmadi. Aniqroq, to'g'ri burchakdan olingan rasm yuklang." : "Tesseract bu muhitda ishga tushmadi (tarmoq cheklovi bo'lishi mumkin). So'zlarni «Qo'lda» bo'limiga ko'chirib yozing."}</p>
              <Btn size="sm" kind="outline" onClick={ai.retry}>Qayta urinish</Btn>
            </div>}
            {rawText && !items && <details className="text-sm"><summary className="cursor-pointer text-muted">O'qilgan xom matn</summary><pre className="whitespace-pre-wrap bg-sunken rounded-xl p-3 mt-2">{rawText}</pre>
              <Btn size="sm" kind="soft" className="mt-2" onClick={() => { setText(rawText); setMode('manual'); }}>Qo'lda tahrirlash</Btn></details>}
          </Card>
        )}
        {!ocrErr && !items && <AIError error={ai.error} onRetry={ai.retry} />}
      </div>
      {items && (
        <ReviewSheet items={items} setItems={setItems} existing={existing} enriching={ai.loading} aiError={ai.error} onRetry={ai.retry}
          onClose={() => { setItems(null); ai.clear(); }} onSave={save} />
      )}
    </div>
  );
}

function EditWord({ w, S, upd, onClose }) {
  const [x, setX] = useState(w);
  const [confirmDel, setConfirmDel] = useState(false);
  useEffect(() => { setX(w); setConfirmDel(false); }, [w]);
  if (!w) return null;
  const save = () => { upd((d) => { const i = d.words.findIndex((z) => z.id === w.id); if (i >= 0) d.words[i] = { ...d.words[i], ...x }; }); onClose(); };
  return (
    <Sheet open={!!w} onClose={onClose} title="Kartani tahrirlash">
      <div className="grid gap-3">
        {[['en', 'Inglizcha'], ['uz', 'Tarjima'], ['ipa', 'Transkripsiya (IPA)'], ['pos', "So'z turkumi"], ['ex', 'Misol gap'], ['exUz', 'Misol tarjimasi'], ['note', 'Izoh']].map(([k, l]) => (
          <Field key={k} label={l} id={`ed-${k}`}><input id={`ed-${k}`} className={`${inputCls} !py-2`} value={x[k] || ''} onChange={(e) => setX({ ...x, [k]: e.target.value })} /></Field>
        ))}
        <Field label="To'plam" id="ed-deck">
          <select id="ed-deck" className={inputCls} value={x.deckId} onChange={(e) => setX({ ...x, deckId: e.target.value })}>{S.decks.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}</select>
        </Field>
        <p className="text-sm text-muted">Holat: {STATUS_UZ[wordStatus(w)]} · takror: {w.reps} · keyingisi: {w.seen ? new Date(w.due).toLocaleDateString('uz-UZ') : '—'}</p>
        <Btn onClick={save}>Saqlash</Btn>
        <div className="flex gap-2">
          <Btn kind="soft" size="sm" className="flex-1" onClick={() => { upd((d) => { const i = d.words.findIndex((z) => z.id === w.id); if (i >= 0) d.words[i] = { ...d.words[i], ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0, seen: false }; }); onClose(); }}>Progressni tiklash</Btn>
          {!confirmDel ? <Btn kind="soft" size="sm" className="flex-1 !text-bad" onClick={() => setConfirmDel(true)}>O'chirish</Btn>
            : <Btn kind="bad" size="sm" className="flex-1" onClick={() => { upd((d) => { d.words = d.words.filter((z) => z.id !== w.id); }); onClose(); }}>Ha, o'chirilsin</Btn>}
        </div>
      </div>
    </Sheet>
  );
}

function Vocab({ S, upd, reward, sub, setSub, study, setStudy }) {
  const [deck, setDeck] = useState(null);
  const [q, setQ] = useState('');
  const [edit, setEdit] = useState(null);
  const [deckForm, setDeckForm] = useState(false);
  const [deckName, setDeckName] = useState('');
  const [filter, setFilter] = useState('all');
  const pool = S.words.filter((w) => !deck || w.deckId === deck);
  const gamePool = pool.filter((w) => w.en && w.uz);
  const now = Date.now();
  const due = pool.filter((w) => isDue(w, now)).length;
  const fresh = pool.filter((w) => !w.seen).length;
  const saveResult = (type, score, total, detail, bestInfo) => upd((d) => {
    d.stats.results.unshift({ type, score, total, detail, at: Date.now() });
    d.stats.results = d.stats.results.slice(0, 20);
    if (bestInfo) { const b = d.stats.best[bestInfo.key]; if (b == null || (bestInfo.lower ? bestInfo.value < b : bestInfo.value > b)) d.stats.best[bestInfo.key] = bestInfo.value; }
  });
  const gameReward = (n, ok) => { if (n) upd((d) => { addXP(d, n); if (ok) ensureDay(d).correct += 1; }); reward(n, ok); };

  if (study) return <Study S={S} deckId={study.deck} upd={upd} reward={reward} onExit={() => setStudy(null)} />;
  if (sub === 'add') return <AddWords S={S} upd={upd} reward={reward} initialDeck={deck} onExit={() => setSub(null)} />;
  const gp = { pool: gamePool, reward: gameReward, onExit: () => setSub(null), saveResult };
  if (sub === 'quiz') return <Quiz {...gp} />;
  if (sub === 'match') return <Match {...gp} best={S.stats.best.match} />;
  if (sub === 'spelling') return <Spelling {...gp} />;
  if (sub === 'speed') return <Speed {...gp} best={S.stats.best.speed} />;

  const addStarter = () => upd((d) => {
    let dk = d.decks.find((x) => x.name === 'Starter');
    if (!dk) { dk = { id: 'd-starter', name: 'Starter' }; d.decks.push(dk); }
    const have = new Set(d.words.map((w) => norm(w.en)));
    starterWords(dk.id).forEach((w) => { if (!have.has(norm(w.en))) d.words.push(w); });
  });
  const list = pool.filter((w) => (filter === 'all' || wordStatus(w) === filter) && (!q || norm(w.en).includes(norm(q)) || String(w.uz).toLowerCase().includes(q.toLowerCase())));
  const games = [
    ['quiz', 'Quiz', '4 variantdan tanlang', I.quiz, 4],
    ['match', 'Match', '6 juftni vaqtga', I.grid, 2],
    ['spelling', 'Spelling', 'Eshiting va yozing', I.keyboard, 1],
    ['speed', 'Speed round', '60 soniya', I.bolt, 4],
  ];
  return (
    <div className="space-y-5">
      <div className="flex items-end justify-between gap-3">
        <h1 className="font-display text-3xl font-extrabold">Lug'at</h1>
        <Btn size="sm" onClick={() => setSub('add')}><Icon d={I.plus} className="w-5 h-5" />So'z qo'shish</Btn>
      </div>

      <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1" role="tablist" aria-label="To'plamlar">
        {[{ id: null, name: 'Hammasi' }, ...S.decks].map((d) => {
          const n = d.id ? S.words.filter((w) => w.deckId === d.id).length : S.words.length;
          return <button key={d.id || 'all'} role="tab" aria-selected={deck === d.id} onClick={() => setDeck(d.id)}
            className={`shrink-0 px-4 py-2 rounded-full font-bold text-sm border-2 transition ${deck === d.id ? 'bg-ink text-paper border-ink' : 'border-line bg-surface hover:border-primary'}`}>{d.name} <span className="opacity-60 num">{n}</span></button>;
        })}
        <button onClick={() => setDeckForm(true)} className="shrink-0 px-4 py-2 rounded-full font-bold text-sm border-2 border-dashed border-line text-muted hover:border-primary">+ To'plam</button>
      </div>

      {S.words.length === 0 ? (
        <Card className="p-6 text-center">
          <p className="text-5xl mb-3">📒</p>
          <h2 className="font-display text-2xl font-extrabold mb-2">Lug'atingiz hali bo'sh</h2>
          <p className="text-muted mb-5">20 ta foydali so'zdan iborat Starter to'plam bilan boshlang yoki o'z so'zlaringizni qo'shing.</p>
          <div className="flex flex-col gap-3 max-w-xs mx-auto">
            <Btn onClick={addStarter}>Starter to'plamni qo'shish</Btn>
            <Btn kind="soft" onClick={() => setSub('add')}>O'z so'zlarimni qo'shaman</Btn>
          </div>
        </Card>
      ) : (
        <>
          <Card className="p-5 flex items-center gap-4">
            <div className="flex-1 min-w-0">
              <p className="font-display text-xl font-extrabold">{due ? `${due} ta so'z takrorlashni kutyapti` : fresh ? `${fresh} ta yangi so'z` : 'Hammasi takrorlangan ✓'}</p>
              <p className="text-sm text-muted">{deck ? S.decks.find((d) => d.id === deck)?.name : 'Barcha to\'plamlar'} · {pool.length} ta karta</p>
            </div>
            <Btn onClick={() => setStudy({ deck })} disabled={!pool.length}><Icon d={I.cards} className="w-5 h-5" />{due || fresh ? 'Boshlash' : 'Mashq'}</Btn>
          </Card>

          <div>
            <p className="eyebrow mb-2">Mashq o'yinlari</p>
            <div className="grid grid-cols-2 gap-3">
              {games.map(([k, t, d, ic, min]) => {
                const ok = gamePool.length >= min;
                return (
                  <button key={k} disabled={!ok} onClick={() => setSub(k)} className="bg-surface rounded-2xl shadow-card p-4 text-left hover:shadow-lift transition disabled:opacity-50">
                    <span className="w-10 h-10 rounded-xl bg-marker text-onmarker grid place-items-center mb-2"><Icon d={ic} className="w-5 h-5" /></span>
                    <span className="font-bold block">{t}</span>
                    <span className="text-xs text-muted">{ok ? d : `Kamida ${min} ta so'z kerak`}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <div className="flex items-center gap-2 mb-2">
              <input id="vocab-search" className={`${inputCls} !py-2`} placeholder="Qidirish…" value={q} onChange={(e) => setQ(e.target.value)} />
              <select id="vocab-filter" aria-label="Holat bo'yicha" className={`${inputCls} !py-2 !w-auto`} value={filter} onChange={(e) => setFilter(e.target.value)}>
                <option value="all">Hammasi</option><option value="new">Yangi</option><option value="learning">O'rganilmoqda</option><option value="mastered">Yodlangan</option>
              </select>
            </div>
            <ul className="bg-surface rounded-2xl shadow-card divide-y divide-line">
              {list.slice(0, 300).map((w) => (
                <li key={w.id}>
                  <button onClick={() => setEdit(w)} className="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-sunken/60">
                    <span className="flex-1 min-w-0"><span className="font-bold block truncate">{w.en}</span><span className="text-sm text-muted block truncate">{w.uz}</span></span>
                    <Pill tone={statusTone[wordStatus(w)]}>{STATUS_UZ[wordStatus(w)]}</Pill>
                  </button>

function knownSample(S, n) {
  const learned = S.words.filter((w) => w.seen && /^[A-Za-z' -]+$/.test(w.en));
  const base = learned.length >= n ? learned : S.words.filter((w) => /^[A-Za-z' -]+$/.test(w.en));
  return pick(base, n).map((w) => w.en);
}

function diffWords(expected, typed) {
  const clean = (s) => String(s).split(/\s+/).filter(Boolean);
  const E = clean(expected), T = clean(typed);
  const n = (w) => w.toLowerCase().replace(/[^a-z0-9']/g, '').replace(/’/g, "'");
  const m = E.length, k = T.length;
  const L = Array.from({ length: m + 1 }, () => new Array(k + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = k - 1; j >= 0; j--) L[i][j] = n(E[i]) === n(T[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < m && j < k) {
    if (n(E[i]) === n(T[j])) { out.push({ w: E[i], t: 'ok' }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out.push({ w: E[i], t: 'miss' }); i++; }
    else { out.push({ w: T[j], t: 'extra' }); j++; }
  }
  while (i < m) out.push({ w: E[i++], t: 'miss' });
  while (j < k) out.push({ w: T[j++], t: 'extra' });
  const ok = out.filter((x) => x.t === 'ok').length;
  return { out, pct: Math.round((ok / Math.max(1, m)) * 100) };
}

function Dictation({ sentences, rate, upd, reward }) {
  const [i, setI] = useState(0);
  const [val, setVal] = useState('');
  const [res, setRes] = useState(null);
  const [total, setTotal] = useState(0);
  if (i >= sentences.length) return <Card className="p-6 text-center anim-pop"><p className="eyebrow mb-1">Dictation</p><p className="font-display text-5xl font-extrabold num">{Math.round(total / sentences.length)}%</p><p className="text-muted">o'rtacha aniqlik</p><Btn kind="soft" className="mt-4" onClick={() => { setI(0); setTotal(0); setRes(null); setVal(''); }}>Qaytadan</Btn></Card>;
  const s = sentences[i];
  const check = () => {
    const r = diffWords(s, val); setRes(r); setTotal((t) => t + r.pct);
    const xp = Math.round(r.pct / 10);
    upd((d) => { addXP(d, xp); if (i + 1 === sentences.length) { d.stats.results.unshift({ type: 'Dictation', score: Math.round((total + r.pct) / sentences.length), total: 100, detail: `${Math.round((total + r.pct) / sentences.length)}%`, at: Date.now() }); d.stats.results = d.stats.results.slice(0, 20); } });
    reward(xp, r.pct >= 80);
  };
  return (
    <Card className="p-5 space-y-3">
      <div className="flex items-center justify-between"><p className="eyebrow">Gap {i + 1}/{sentences.length}</p>
        <div className="flex gap-2"><Btn size="sm" kind="soft" onClick={() => TTS.say(s, rate)}><Icon d={I.speaker} className="w-4 h-4" />Tinglash</Btn><Btn size="sm" kind="soft" onClick={() => TTS.say(s, 0.6)}>Sekin</Btn></div></div>
      <textarea id="dict-input" rows={2} className={inputCls} value={val} disabled={!!res} onChange={(e) => setVal(e.target.value)} placeholder="Eshitgan gapingizni yozing…" autoCapitalize="sentences" spellCheck="false" />
      {res && (
        <div className="anim-up">
          <p className="text-lg leading-8">{res.out.map((x, k) => <span key={k} className={`mr-1 px-1 rounded ${x.t === 'ok' ? 'text-good' : x.t === 'miss' ? 'bg-bad/15 text-bad underline' : 'bg-warn/15 text-warn line-through'}`}>{x.w}</span>)}</p>
          <p className="text-xs text-muted mt-1"><span className="text-good font-bold">yashil</span> — to'g'ri · <span className="text-bad font-bold">qizil</span> — tushib qolgan/xato · <span className="text-warn font-bold">sariq</span> — ortiqcha</p>
          <p className="font-bold mt-2">Aniqlik: <span className="num">{res.pct}%</span></p>
        </div>
      )}
      {!res ? <Btn className="w-full" disabled={!val.trim()} onClick={check}>Tekshirish</Btn> : <Btn className="w-full" onClick={() => { setI(i + 1); setVal(''); setRes(null); }}>Keyingi gap</Btn>}
    </Card>
  );
}

function MicNotice({ code }) {

function Pronounce({ S, upd, reward }) {
  const build = () => { const ws = S.words.filter((w) => /^[A-Za-z' -]+$/.test(w.en)); const pri = ws.filter((w) => w.seen); return pick(pri.length >= 5 ? pri : ws, 10); };
  const [list, setList] = useState(build);
  const [i, setI] = useState(0);
  const [heard, setHeard] = useState('');
  const [result, setResult] = useState(null);
  const [err, setErr] = useState(null);
  const [okCount, setOkCount] = useState(0);
  const rec = useRecognizer();
  const w = list[i];
  if (!S.words.length) return <Card className="p-5 text-muted">Avval lug'atga so'z qo'shing.</Card>;
  if (!w) return <Card className="p-6 text-center anim-pop"><p className="text-5xl mb-2">🎤</p><p className="font-display text-3xl font-extrabold num">{okCount}/{list.length}</p><p className="text-muted mb-4">so'z to'g'ri talaffuz qilindi</p><Btn onClick={() => { setList(build()); setI(0); setOkCount(0); setResult(null); setHeard(''); }}>Yana mashq</Btn></Card>;
  const listen = () => {
    if (rec.listening) { rec.stop(); return; }
    setErr(null); setHeard(''); setResult(null);
    let alts = [];
    rec.start({
      onResult: (e) => {
        const r = e.results[e.results.length - 1];
        setHeard(r[0].transcript);
        if (r.isFinal) { alts = Array.from(r).map((a) => a.transcript); }
      },
      onError: (c) => setErr(c),
      onEnd: () => {
        if (!alts.length) return;
        const target = norm(w.en);
        const ok = alts.some((a) => { const n = norm(a); return n === target || n.split(' ').includes(target) || n.includes(target) || similarity(n, target) >= 0.8; });
        setResult(ok ? 'ok' : 'bad');
        if (ok) { setOkCount((c) => c + 1); upd((d) => addXP(d, 5)); reward(5, true); } else reward(0, false);
      },
    });
  };
  const next = () => { setI(i + 1); setHeard(''); setResult(null); setErr(null); };
  const micBlocked = !rec.supported || err === 'not-allowed' || err === 'service-not-allowed' || err === 'start-failed';
  return (
    <div className="space-y-4">
      <Card className="p-6 text-center">
        <p className="eyebrow mb-3">So'zni ayting · {i + 1}/{list.length}</p>
        <p className="font-display text-5xl font-extrabold break-words">{w.en}</p>
        {w.ipa && <p className="ipa text-lg text-muted mt-1">{w.ipa}</p>}
        <p className="text-muted mt-1">{w.uz}</p>
        <div className="flex justify-center mt-4"><SpeakBtn text={w.en} rate={0.85} label="Namuna talaffuz" /></div>

/* Matnda: ishlatilgan so'zlar yashil, xatolar qizil (raqam bilan) */
function Marked({ text, errors = [], words = [] }) {
  const ranges = [];
  const taken = (s, e) => ranges.some((r) => s < r.e && e > r.s);
  errors.forEach((er, i) => {
    if (!er || !er.wrong) return;
    const low = text.toLowerCase(), w = String(er.wrong).toLowerCase();
    let from = 0, idx;
    while ((idx = low.indexOf(w, from)) >= 0) { if (!taken(idx, idx + w.length)) { ranges.push({ s: idx, e: idx + w.length, t: 'err', n: i + 1 }); break; } from = idx + 1; }
  });
  words.forEach((wd) => {
    const stem = String(wd).split(' ')[0];
    const re = new RegExp(`\\b${escRe(stem.length > 4 ? stem.slice(0, stem.length - 2) : stem)}[a-z'-]*`, 'gi');
    let m; while ((m = re.exec(text))) if (!taken(m.index, m.index + m[0].length)) ranges.push({ s: m.index, e: m.index + m[0].length, t: 'ok' });
  });
  ranges.sort((a, b) => a.s - b.s);
  const out = []; let p = 0;
  ranges.forEach((r, k) => {
    if (r.s > p) out.push(<span key={'t' + k}>{text.slice(p, r.s)}</span>);
    out.push(r.t === 'err'
      ? <span key={'r' + k} className="bg-bad/15 text-bad underline decoration-wavy rounded px-0.5">{text.slice(r.s, r.e)}<sup className="font-bold ml-0.5 num">{r.n}</sup></span>
      : <span key={'r' + k} className="bg-good/15 text-good font-bold rounded px-0.5">{text.slice(r.s, r.e)}</span>);
    p = r.e;
  });
  if (p < text.length) out.push(<span key="end">{text.slice(p)}</span>);
  return <span className="whitespace-pre-wrap">{out}</span>;
}

function Settings({ open, onClose, S, upd, replace, cloudOn }) {
  const [p, setP] = useState(S.profile);

  useEffect(() => { if (open) { setP(S.profile); setMsg(''); setJsonOut(''); setPendingImport(null); setConfirmReset(false); } }, [open]); // eslint-disable-line
  const save = () => { upd((d) => { d.profile = { ...d.profile, ...p }; }); onClose(); };
  const exportJSON = async () => {
    const data = JSON.stringify({ app: 'vocabulary-teacher', exportedAt: new Date().toISOString(), ...S }, null, 1);
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: `vocabulary-${dayKey()}.json`, data }); setMsg('Fayl saqlandi.'); return; }
    } catch (e) { if (e && e.code === 'declined') { setMsg('Saqlash bekor qilindi.'); return; } }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = `vocabulary-${dayKey()}.json`; a.click();
    } catch (e) { /* */ }
    setJsonOut(data);
    setMsg("Agar fayl yuklanmagan bo'lsa, pastdagi matnni nusxalab saqlang.");
  };
  const copy = async () => { try { await navigator.clipboard.writeText(jsonOut); setMsg('Nusxalandi.'); } catch (e) { const t = document.getElementById('set-json'); t && t.select(); setMsg("Matn belgilandi — Ctrl+C / Nusxalash."); } };
  const onImport = (f) => {
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.words) || !d.profile) throw new Error('bad');
        setPendingImport(d); setMsg(`Faylda ${d.words.length} ta so'z bor. Qanday qo'shamiz?`);
      } catch (e) { setMsg("Bu fayl Vocabulary Teacher eksporti emas."); }
    };
    r.readAsText(f);
  };
  const applyImport = (mode) => {
    const d = pendingImport; if (!d) return;
    if (mode === 'replace') { const { app, exportedAt, ...rest } = d; replace({ ...rest, updatedAt: Date.now() }); }
    else upd((s) => {
      const have = new Set(s.words.map((w) => norm(w.en) + '|' + w.deckId));
      (d.decks || []).forEach((dk) => { if (!s.decks.some((x) => x.id === dk.id)) s.decks.push(dk); });
      d.words.forEach((w) => { if (!have.has(norm(w.en) + '|' + w.deckId)) s.words.push({ ...w, deckId: s.decks.some((x) => x.id === w.deckId) ? w.deckId : s.decks[0].id }); });
    });
    setPendingImport(null); setMsg('Import qilindi ✓');
  };
  return (
    <Sheet open={open} onClose={onClose} title="Sozlamalar">
      <div className="space-y-5">
        <Field label="Ism" id="set-name"><input id="set-name" className={inputCls} value={p.name} onChange={(e) => setP({ ...p, name: e.target.value })} /></Field>
        <div><p className="text-sm font-bold mb-1.5">Daraja</p><Segmented id="set-level" value={p.level} onChange={(v) => setP({ ...p, level: v })} options={LEVELS.map((l) => l.id)} /></div>

        <div><p className="text-sm font-bold mb-1.5">Mavzu</p><Segmented id="set-theme" value={p.theme || 'auto'} onChange={(v) => setP({ ...p, theme: v })} options={[{ value: 'auto', label: 'Avto' }, { value: 'light', label: "Yorug'" }, { value: 'dark', label: "Qorong'i" }]} /></div>
        <VoicePicker p={p} setP={setP} />
        <label className="flex items-center gap-3"><input id="set-sound" type="checkbox" className="w-5 h-5" checked={p.sound !== false} onChange={(e) => setP({ ...p, sound: e.target.checked })} />To'g'ri/xato javob ovozi</label>
        <Btn className="w-full" onClick={save}>Saqlash</Btn>
        <div className="border-t border-line pt-4 space-y-3">
          <p className="eyebrow">Ma'lumotlar</p>
          <p className="text-sm text-muted">{cloudOn ? "✓ Progress Claude hisobingizda saqlanmoqda (faqat sizga ko'rinadi) va shu brauzerda." : "Progress shu brauzerda saqlanmoqda. Boshqa qurilmaga o'tkazish uchun eksport qiling."}</p>
          <div className="grid grid-cols-2 gap-2">
            <Btn kind="outline" size="sm" onClick={exportJSON}><Icon d={I.download} className="w-4 h-4" />Eksport (JSON)</Btn>
            <label htmlFor="set-import" className="inline-flex items-center justify-center gap-2 font-bold rounded-2xl border-2 border-line hover:border-primary px-3 py-2 text-sm min-h-[40px] cursor-pointer"><Icon d={I.upload} className="w-4 h-4" />Import (JSON)</label>
            <input id="set-import" type="file" accept="application/json,.json" className="sr-only" onChange={(e) => onImport(e.target.files && e.target.files[0])} />
          </div>
          {msg && <p className="text-sm font-bold">{msg}</p>}
          {pendingImport && <div className="grid grid-cols-2 gap-2"><Btn size="sm" onClick={() => applyImport('merge')}>Qo'shib olish</Btn><Btn size="sm" kind="bad" onClick={() => applyImport('replace')}>Hammasini almashtirish</Btn></div>}
          {jsonOut && <div className="space-y-2"><textarea id="set-json" readOnly rows={5} className={`${inputCls} font-mono text-xs`} value={jsonOut} /><Btn size="sm" kind="soft" onClick={copy}>Nusxalash</Btn></div>}
          {!confirmReset ? <button className="text-sm text-bad font-bold" onClick={() => setConfirmReset(true)}>Barcha ma'lumotni o'chirish…</button>
            : <div className="rounded-2xl bg-bad/10 p-3 space-y-2"><p className="text-sm">Hamma so'z va progress o'chadi. Avval eksport qilishni tavsiya qilamiz.</p><Btn size="sm" kind="bad" onClick={() => { replace(null); onClose(); }}>Ha, hammasini o'chir</Btn></div>}
        </div>
      </div>
    </Sheet>
  );
}

/* =====================================================================
   21. ASOSIY ILOVA
   ===================================================================== */
const TABS = [
  ['vocab', "Lug'at", I.cards],
  ['reading', 'Reading', I.book],
  ['listening', 'Listening', I.ear],
  ['speaking', 'Speaking', I.mic],
  ['writing', 'Writing', I.pen],
];
function App() {
  const [S, setS] = useState(() => loadLocal());
  const [tab, setTab] = useState('home');
  const [sub, setSub] = useState(null);
  const [study, setStudy] = useState(null);
  const [settings, setSettings] = useState(false);
  const [wordReq, setWordReq] = useState(null);
  const [xpPop, setXpPop] = useState(null);
  const [confetti, setConfetti] = useState(0);
  const [cloudOn, setCloudOn] = useState(false);
  const cloud = useRef(null);
  const written = useRef({});
  const writing = useRef(false);
  const again = useRef(false);
  const latest = useRef(S);
  latest.current = S;

  // Artifact doimiy xotirasi (bo'lsa) — yangiroq ma'lumotni olish
  useEffect(() => {
    let off = false;
    openCloud().then(async (c) => {
      if (!c || off) return;
      cloud.current = c;
      try {
        const remote = await cloudLoad(c);
        const local = latest.current;
        if (remote && (!local || (remote.updatedAt || 0) > (local.updatedAt || 0))) setS(remote);
        setCloudOn(true);
      } catch (e) { console.warn('cloud load', e); setCloudOn(true); }
    });
    return () => { off = true; };
  }, []);

  const flush = useCallback(async () => {
    const c = cloud.current, s = latest.current;
    if (!c || !s) return;
    if (writing.current) { again.current = true; return; }
    writing.current = true;
    try {
      const { words, ...meta } = s;
      const chunks = Math.max(1, Math.ceil(words.length / CHUNK));
      for (let i = 0; i < chunks; i++) {
        const json = JSON.stringify(words.slice(i * CHUNK, (i + 1) * CHUNK));
        if (written.current['w' + i] !== json) { await c.chunk(i).set({ json }); written.current['w' + i] = json; }
      }
      const mj = JSON.stringify(meta);
      if (written.current.meta !== mj + chunks) { await c.meta.set({ json: mj, chunks, updatedAt: s.updatedAt || Date.now() }); written.current.meta = mj + chunks; }
    } catch (e) { console.warn('cloud save', e); }
    writing.current = false;
    if (again.current) { again.current = false; flush(); }
  }, []);

  useEffect(() => {
    if (!S) return;
    saveLocal(S);
    if (!cloudOn) return;
    const t = setTimeout(flush, 1500);
    return () => clearTimeout(t);
  }, [S, cloudOn, flush]);

  // Ovoz sozlamasi
  useEffect(() => {
    if (!S) return;
    TTS.accent = S.profile.accent || 'us';
    TTS.preferred = S.profile.voice || '';
    TTS.load();
  }, [S && S.profile.accent, S && S.profile.voice]); // eslint-disable-line

  // Mavzu (yorug'/qorong'i)
  useEffect(() => {
    const r = document.documentElement, th = S && S.profile.theme;
    r.classList.toggle('force-dark', th === 'dark');
    r.classList.toggle('force-light', th === 'light');
  }, [S && S.profile.theme]);

  const upd = useCallback((fn) => setS((s) => { if (!s) return s; const d = clone(s); fn(d); d.updatedAt = Date.now(); return d; }), []);
  const reward = useCallback((n, ok) => {
    beep(ok, !latest.current || latest.current.profile.sound !== false);
    if (n > 0) setXpPop({ n, k: Date.now() });
  }, []);

  // Kunlik maqsad bajarilganda konfetti
  useEffect(() => {
    if (!S) return;
    const day = S.stats.days[dayKey()];
    if (day && !day.goalHit && day.reviewed >= S.profile.goal) {
      upd((d) => { const dd = ensureDay(d); dd.goalHit = true; addXP(d, 20); });
      setConfetti((c) => c + 1);
      setXpPop({ n: 20, k: Date.now(), goal: true });
    }
  }, [S, upd]);

  useEffect(() => { if (!xpPop) return; const t = setTimeout(() => setXpPop(null), 1200); return () => clearTimeout(t); }, [xpPop]);

  const addFromText = useCallback((w, deckName) => {
    upd((d) => {
      let dk = d.decks.find((x) => x.name === deckName);
      if (!dk) { dk = { id: 'd-' + uid(), name: deckName }; d.decks.push(dk); }
      if (!d.words.some((x) => norm(x.en) === norm(w.en))) d.words.push(newWord(w, dk.id));
      addXP(d, 2);
    });
    reward(2, true);
  }, [upd, reward]);

  if (!S) {
    return <><AppBg /><Onboarding onDone={({ name, level, goal, starter }) => {
      const s = makeState({ name, level, goal });
      if (starter) { s.decks.push({ id: 'd-starter', name: 'Starter' }); s.words = starterWords('d-starter'); }
      setS(s); setTab('home'); window.scrollTo(0, 0);
    }} /></>;
  }

  const go = (t) => { TTS.stop(); setTab(t); setSub(null); setStudy(null); window.scrollTo(0, 0); };
  const startStudy = (deck) => { setTab('vocab'); setSub(null); setStudy({ deck }); window.scrollTo(0, 0); };
  const streak = liveStreak(S);
  return (
    <div className="min-h-full">
      <AppBg />
      <header className="sticky top-safe z-30 bg-paper/90 backdrop-blur border-b border-line/70">
        <div className="max-w-2xl mx-auto px-4 h-14 flex items-center gap-2">
          <button onClick={() => go('home')} className={`flex items-center gap-2 rounded-xl px-2 py-1 min-w-0 ${tab === 'home' ? 'text-primary' : ''}`} aria-label="Bosh sahifa">
            <span className="w-8 h-8 rounded-lg bg-marker text-onmarker grid place-items-center font-display font-extrabold">V</span>
            <span className="font-display font-extrabold text-base whitespace-nowrap hidden min-[340px]:inline">Vocabulary<span className="hidden min-[430px]:inline"> Teacher</span></span>
          </button>
          <div className="flex-1" />
          <span className="flex items-center whitespace-nowrap shrink-0 gap-1 font-bold text-sm num" title="Kunlar ketma-ketligi">🔥 {streak}</span>
          <span className="flex items-center whitespace-nowrap shrink-0 gap-1 font-bold text-sm num ml-2" title="XP">⚡ {S.stats.xp}</span>
          <button onClick={() => setSettings(true)} className="w-10 h-10 rounded-full hover:bg-sunken grid place-items-center ml-1" aria-label="Sozlamalar"><Icon d={I.gear} className="w-5 h-5" /></button>
        </div>
      </header>

      <main className="max-w-2xl mx-auto px-4 pt-5 pb-32">
        {tab === 'home' && <Home S={S} go={go} startStudy={startStudy} />}
        {tab === 'vocab' && <Vocab S={S} upd={upd} reward={reward} sub={sub} setSub={setSub} study={study} setStudy={setStudy} />}
        {tab === 'reading' && <Reading S={S} upd={upd} reward={reward} openWord={setWordReq} />}
        {tab === 'listening' && <Listening S={S} upd={upd} reward={reward} openWord={setWordReq} />}
        {tab === 'speaking' && <Speaking S={S} upd={upd} reward={reward} />}
        {tab === 'writing' && <Writing S={S} upd={upd} reward={reward} />}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-40 bg-surface/95 backdrop-blur border-t border-line nav-safe" aria-label="Bo'limlar">
        <div className="max-w-2xl mx-auto grid grid-cols-5">
          {TABS.map(([k, l, ic]) => {
            const on = tab === k;
            return (
              <button key={k} onClick={() => go(k)} aria-current={on ? 'page' : undefined}
                className={`flex flex-col items-center justify-center gap-0.5 py-2.5 min-h-[62px] text-[11px] font-bold transition ${on ? 'text-primary' : 'text-muted hover:text-ink'}`}>
                <span className={`w-12 h-8 rounded-full grid place-items-center transition ${on ? 'bg-primary/15' : ''}`}><Icon d={ic} className="w-[22px] h-[22px]" /></span>
                {l}
              </button>
            );
          })}
        </div>
      </nav>

      {xpPop && <div key={xpPop.k} className="xp-float"><span className={`px-4 py-2 rounded-full font-display font-extrabold shadow-lift ${xpPop.goal ? 'bg-marker text-onmarker' : 'bg-primary text-onprimary'}`}>{xpPop.goal ? '🎯 Maqsad bajarildi! ' : ''}+{xpPop.n} XP</span></div>}
      <StopSpeechBar />
      <Confetti fire={confetti} />
      <WordSheet req={wordReq} onClose={() => setWordReq(null)} state={S} onAdd={addFromText} level={S.profile.level} />
      <Settings open={settings} onClose={() => setSettings(false)} S={S} upd={upd} replace={(n) => {
        written.current = {};
        setS(n);
        if (!n) {
          try { localStorage.removeItem(LS_KEY); } catch (e) { /* */ }
          if (cloud.current) cloud.current.meta.delete().catch(() => {});
        }
      }} cloudOn={cloudOn} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
