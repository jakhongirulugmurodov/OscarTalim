<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Commissioner:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style>
  :root{
    --bg:#0A1119; --bg-deep:#060C12; --surface:#101C28; --surface-2:#172734;
    --line:#223849; --line-soft:#1a2c3a;
    --ink:#E9F2F6; --ink-2:#A7BECC; --ink-3:#6C8798;
    --tile:#2BC4CE; --tile-deep:#16929B;
    --gold:#E3B23C; --clay:#D2603A; --good:#4CC38A; --warn:#E08A3C;
    --r-s:10px; --r-m:16px; --r-l:24px;
    --sans:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
    --disp:"Oswald","Segoe UI Semibold",system-ui,sans-serif;
    --hand:"Caveat","Segoe Script",cursive;
    --pad:18px;
    --paper:#F3F6F4; --paper-line:#C7D7E2; --paper-ink:#1E3A5C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--tile);text-decoration:none} a:hover{color:var(--tile-deep)}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:500;letter-spacing:.01em}
  .num{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:500;line-height:1}
  .l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .topbar{display:flex;align-items:center;justify-content:space-between;
          padding:20px var(--pad) 10px;gap:10px;flex:none}
  .wordmark{display:flex;align-items:center;gap:9px}
  .wordmark b{font-family:var(--disp);font-weight:600;font-size:1.12rem;
              letter-spacing:.09em;text-transform:uppercase}
  .pill{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
        padding:4px 10px;border-radius:999px;border:1px solid var(--line);
        color:var(--ink-2);background:var(--surface);white-space:nowrap}
  .pill.tile{color:var(--tile);border-color:rgba(43,196,206,.4);background:rgba(43,196,206,.09)}
  .pill.gold{color:var(--gold);border-color:rgba(227,178,60,.4);background:rgba(227,178,60,.09)}
  .pill.clay{color:var(--clay);border-color:rgba(210,96,58,.45);background:rgba(210,96,58,.1)}
  .pill.warn{color:var(--warn);border-color:rgba(224,138,60,.42);background:rgba(224,138,60,.1)}
  .pill.good{color:var(--good);border-color:rgba(76,195,138,.4);background:rgba(76,195,138,.09)}
  .card{background:var(--surface);border:1px solid var(--line-soft);
        border-radius:var(--r-m);padding:16px}
  .btn{font-family:var(--sans);font-size:.95rem;font-weight:600;color:var(--ink);
       background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);
       padding:13px 18px;display:inline-flex;align-items:center;justify-content:center;
       gap:8px;min-height:48px;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--tile),var(--tile-deep));
       color:#04181B;border-color:transparent;font-weight:700;letter-spacing:.02em;
       box-shadow:0 6px 22px -10px rgba(43,196,206,.9)}
  .screen{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  .body{flex:1;padding:0 var(--pad) 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .paper{background:var(--paper);border-radius:12px;position:relative;overflow:hidden}
  .paper .rule{position:absolute;left:0;right:0;height:1px;background:var(--paper-line)}
  .hand{font-family:var(--hand);color:var(--paper-ink);font-weight:600}

  .view{flex:1;margin:0 var(--pad);border-radius:var(--r-l);position:relative;
        background:#0C161F;border:1px solid var(--line-soft);overflow:hidden;min-height:0}
  .corner{position:absolute;width:34px;height:34px;border:3px solid var(--tile)}
  .checks{display:flex;flex-direction:column;gap:7px;position:absolute;left:14px;bottom:14px}
  .chk{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;
       background:rgba(6,12,18,.78);padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
  .shutter{width:74px;height:74px;border-radius:50%;border:3px solid var(--tile);
        background:linear-gradient(180deg,var(--tile),var(--tile-deep));
        box-shadow:0 8px 26px -10px rgba(43,196,206,.9);display:flex;
        align-items:center;justify-content:center;cursor:pointer}
  .thumb{width:44px;height:58px;border-radius:7px;border:1px solid var(--line);
         background:var(--paper);position:relative;overflow:hidden}
  .thumb.add{background:var(--surface-2);border-style:dashed;display:flex;
             align-items:center;justify-content:center}
</style>
</helmet>
<div class="screen" style="width:390px;height:844px">

  <div class="topbar">
    <div class="wordmark"><svg class="mark" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#2BC4CE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5 L9.5 5.5 L15 20.5"/><path d="M6.2 15.6 H12.8"/><path d="M18.5 5.5 V20.5"/><circle cx="18.5" cy="2.6" r="1.6" fill="#2BC4CE" stroke="none"/></svg><b>AI Ustoz</b></div>
    <span class="pill tile">7-B · Algebra</span>
  </div>

  <div class="view">
    <div class="paper" style="position:absolute;left:26px;top:34px;right:26px;bottom:96px">
      <div class="rule" style="top:30px;left:18px;right:18px"></div><div class="rule" style="top:56px;left:18px;right:18px"></div><div class="rule" style="top:82px;left:18px;right:18px"></div><div class="rule" style="top:108px;left:18px;right:18px"></div><div class="rule" style="top:134px;left:18px;right:18px"></div><div class="rule" style="top:160px;left:18px;right:18px"></div><div class="rule" style="top:186px;left:18px;right:18px"></div><div class="rule" style="top:212px;left:18px;right:18px"></div><div class="rule" style="top:238px;left:18px;right:18px"></div><div class="rule" style="top:264px;left:18px;right:18px"></div><div class="rule" style="top:290px;left:18px;right:18px"></div><div class="rule" style="top:316px;left:18px;right:18px"></div><div class="rule" style="top:342px;left:18px;right:18px"></div><div class="rule" style="top:368px;left:18px;right:18px"></div>
      <div class="hand" style="position:absolute;left:22px;top:8px;font-size:19px">1) x² − 2x − 15 = 0</div>
      <div class="hand" style="position:absolute;left:34px;top:60px;font-size:19px">D = 4 + 60 = 64</div>
      <div class="hand" style="position:absolute;left:34px;top:112px;font-size:19px">x = (−2 ± 8) / 2</div>
      <div class="hand" style="position:absolute;left:34px;top:164px;font-size:19px">x₁ = 3,&nbsp; x₂ = −5</div>
      <div class="hand" style="position:absolute;left:22px;top:216px;font-size:19px">2) 3x + 7 = 22</div>
      <div class="hand" style="position:absolute;left:34px;top:268px;font-size:19px">3x = 15 → x = 5</div>
    </div>
    <div class="corner" style="left:14px;top:14px;border-right:0;border-bottom:0;border-radius:14px 0 0 0"></div>
    <div class="corner" style="right:14px;top:14px;border-left:0;border-bottom:0;border-radius:0 14px 0 0"></div>
    <div class="corner" style="left:14px;bottom:14px;border-right:0;border-top:0;border-radius:0 0 0 14px"></div>
    <div class="corner" style="right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 14px 0"></div>
    <div class="checks">
      <div class="chk" style="color:var(--good)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#4CC38A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4 L5.6 10.5 L11.5 3.8"/></svg> Toʻrt burchak koʻrinyapti</div>
      <div class="chk" style="color:var(--good)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#4CC38A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4 L5.6 10.5 L11.5 3.8"/></svg> Yorugʻlik yetarli</div>
      <div class="chk" style="color:var(--good)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#4CC38A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.4 L5.6 10.5 L11.5 3.8"/></svg> Xira emas</div>
    </div>
  </div>

  <div style="flex:none;padding:16px var(--pad) 22px;display:flex;flex-direction:column;gap:14px">
    <div style="text-align:center">
      <div class="l">3 sahifadan 2-si</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div style="display:flex;gap:8px">
        <div class="thumb"><div class="rule" style="top:8px;left:6px;right:6px"></div><div class="rule" style="top:19px;left:6px;right:6px"></div><div class="rule" style="top:30px;left:6px;right:6px"></div><div class="rule" style="top:41px;left:6px;right:6px"></div><div class="rule" style="top:52px;left:6px;right:6px"></div></div>
        <div class="thumb add">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#6C8798"
               stroke-width="1.8" stroke-linecap="round"><path d="M9 3.5v11M3.5 9h11"/></svg>
        </div>
      </div>
      <div class="shutter">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#04181B"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h4.6l2-3h8.8l2 3H26v14H4z"/><circle cx="15" cy="16" r="4.8"/></svg>
      </div>
      <button class="btn" style="min-width:86px;padding:13px 14px">Tayyor</button>
    </div>
    <p style="margin:0;text-align:center;font-size:.82rem;color:var(--ink-3);line-height:1.4">
      Daftarni tekis qoʻying — toʻrt burchagi ham ramka ichida boʻlsin
    </p>
  </div>

</div>
</x-dc>
</body>
</html>
