<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<meta name="description" content="AI kursi · 13 dars — sinf paneli. Ball ishdan chiqadi, o'yindan emas.">

<title>AI Kursi — Sinf</title>
<style>
:root{
  --bg:#0f2a43; --bg2:#143453; --card:#1a3f61; --line:#2a5477;
  --ink:#eef3f8; --muted:#9fb6cb;
  --accent:#e07a26; --accent2:#e9a05a; --accent-soft:rgba(224,122,38,.14);
  --ok:#3fbf78; --err:#e2574c; --gold:#f2c14e;
  --r:16px; --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  padding:0 0 90px; min-height:100vh; overscroll-behavior-y:contain;
}
.wrap{max-width:620px;margin:0 auto;padding:16px 14px}
.wrap.wide{max-width:1100px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.25}
h1{font-size:1.35rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:6px 0}
small,.small{font-size:.82rem;color:var(--muted)}
.hide{display:none!important}

/* ---- sarlavha ---- */
.brand{display:flex;align-items:center;gap:11px;padding:14px 0 6px}
.mark{width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#b85c14);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 8px 20px -8px rgba(224,122,38,.7)}
.brand .eyebrow{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2)}

/* ---- kartalar ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);animation:up .35s both}
.card.flat{box-shadow:none;background:var(--bg2)}
.card.accent{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- tugmalar ---- */
button{font:inherit}
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:13px;
  background:var(--accent);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;
  transition:transform .12s,filter .12s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.sm{padding:9px 13px;font-size:.86rem;width:auto;display:inline-block;border-radius:10px}
.btn.danger{background:transparent;border:1px solid var(--err);color:#ffb4ae}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{width:auto;flex:1 1 130px}

/* ---- inputlar ---- */
input,textarea,select{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:76px}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.field-code{text-transform:uppercase;letter-spacing:.22em;text-align:center;font-size:1.3rem;font-weight:700}

/* ---- chiplar ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);
  color:var(--muted);font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.done{border-color:var(--ok);color:var(--ok)}

/* ---- o'quvchi paneli ---- */
.hud{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:12px;position:sticky;top:8px;z-index:20;
  backdrop-filter:blur(8px)}
.hud .lvl{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--accent-soft);border:1px solid var(--accent);
  color:var(--accent2);font-weight:800;font-size:1.05rem;line-height:1}
.hud .lvl span{font-size:.5rem;letter-spacing:.1em;color:var(--muted);font-weight:600}
.hud .who{flex:1;min-width:0}
.hud .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .pts{text-align:right;font-weight:800;font-size:1.15rem;color:var(--gold)}
.bar{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---- vazifa kartasi ---- */
.task h3{display:flex;align-items:center;gap:8px}
.task .pill{margin-left:auto;font-size:.72rem;font-weight:800;color:var(--gold);
  background:rgba(242,193,78,.12);padding:3px 9px;border-radius:99px;white-space:nowrap}
.task.done{border-color:var(--ok)}
.task.done .pill{color:var(--ok);background:rgba(63,191,120,.12)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:10px;margin-bottom:6px;font-size:.9rem}
.items li b{color:var(--accent2);flex:0 0 auto}

/* ---- reyting ---- */
.rank{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  background:var(--bg2);margin-bottom:7px;animation:up .3s both}
.rank .n{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;background:var(--card);color:var(--muted);flex:0 0 auto}
.rank.me{background:var(--accent-soft);border:1px solid var(--accent)}
.rank.top1 .n{background:var(--gold);color:#3a2b00}
.rank.top2 .n{background:#c9d4de;color:#25303a}
.rank.top3 .n{background:#cd8b5a;color:#2b1a0c}
.rank .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .sc{font-weight:800;color:var(--gold)}
.rank .st{font-size:.75rem;color:var(--muted)}

/* ---- pastki menyu ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(15,42,67,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:11px 4px 13px;
  font-size:.68rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button i{font-style:normal;font-size:19px;line-height:1}
.nav button.on{color:var(--accent2)}

/* ---- jonli rejim ---- */
.live-banner{position:sticky;top:64px;z-index:19;margin-bottom:12px;border-radius:var(--r);
  padding:14px;background:linear-gradient(135deg,var(--accent),#b85c14);color:#fff;
  box-shadow:0 12px 28px -12px rgba(224,122,38,.9);cursor:pointer;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 12px 28px -12px rgba(224,122,38,.9)}50%{box-shadow:0 12px 40px -8px rgba(224,122,38,1)}}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:9px;border-radius:13px;
  border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:.97rem;cursor:pointer}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:rgba(63,191,120,.14)}
.opt.wrong{border-color:var(--err);background:rgba(226,87,76,.14)}
.timer{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:10px 0 14px}
.timer i{display:block;height:100%;background:var(--accent);transition:width 1s linear}

/* ---- proyektor ---- */
body.proj .wrap{max-width:1400px}
body.proj{font-size:22px}
body.proj h1{font-size:2.4rem}
body.proj .rank{padding:14px 18px;font-size:1.3rem}
body.proj .rank .n{width:40px;height:40px;font-size:1.1rem}
body.proj .opt{font-size:1.5rem;padding:22px}
body.proj .nav{display:none}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--ok);color:#062615;font-weight:800;padding:11px 20px;border-radius:99px;
  opacity:0;transition:.3s;z-index:99;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--err);color:#fff}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg2);border-radius:12px;padding:11px 13px}
.stat b{display:block;font-size:1.35rem;color:var(--accent2)}
.sep{height:1px;background:var(--line);margin:14px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.note{border-left:3px solid var(--accent);padding-left:11px;color:var(--muted);font-size:.86rem}
@media print{
  body{background:#fff;color:#111;padding:0}
  .nav,.hud,.noprint{display:none!important}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;color:#111;break-inside:avoid}
  .small,.rank .st{color:#555}
}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
</style>
</head>

<script>
/* =====================================================================
   AI KURSI — SINF PANELI
   Bitta fayl: HTML + CSS + JS. Backend: Firebase (yoki mahalliy rejim).

/* ---------------------------------------------------------------------
   1) FIREBASE SOZLAMASI
   Firebase konsolidan olingan config'ni shu yerga qo'ying.
   Bo'sh qolsa — dastur "mahalliy rejim"da ishlaydi (faqat shu qurilmada).
   --------------------------------------------------------------------- */
const FB_CONFIG = null;
/*  Namuna:
const FB_CONFIG = {
  apiKey: "...", authDomain: "...firebaseapp.com",
  projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..."
};
*/

/* ---------------------------------------------------------------------
   2) KURS MAZMUNI — 13 dars
   --------------------------------------------------------------------- */
const COURSE = {
  title: "AI kursi · 13 dars",
  promise: "AI'ni ishlatishni o'rganasan, lekin AI'ga o'ylashni topshirmaysan.",
  lessons: [
{ n:1, t:"AI seni kuchli qiladimi yoki dangasa?",
  learn:"AI'ni ishlatishning ikki xil yo'li borligini va ular seni ikki xil odamga aylantirishini. O'z hayotingdagi 10 ta real muammoni yozasan.",
  where:"Har safar kimdir sendan nimadir so'raganda.",
  key:["Kuchaytiruvchi yo'l: fikr sendan chiqadi, AI tekshiradi.",
       "Dangasalashtiruvchi yo'l: fikr AI'dan chiqadi, sen ko'chirasan.",
       "Ikkovi bir xil ko'rinadi — natija besh yildan keyin ko'rinadi."],
  tasks:[
    {id:"p10",type:"list",t:"10 ta real muammo",pts:10,max:10,
     d:"O'z hayotingdan haqiqiy muammolarni yoz. Xayoliy emas — bugun seni yoki yaqiningni bezovta qilgani.",
     ph:"Masalan: ertalab darsga kechikaman, chunki..."},
    {id:"ikki",type:"text",t:"Ikki yo'l",pts:15,min:60,
     d:"Bugun AI'ni KUCHAYTIRUVCHI tarzda ishlatgan bitta holatni va DANGASALASHTIRUVCHI tarzda ishlatgan bitta holatni yoz.",
     ph:"1) Kuchaytirdi: ...\n2) Dangasalashtirdi: ..."}],
  duel:[
    {q:"Insho yozish kerak. Qaysi yo'l seni kuchli qiladi?",
     a:["AI yozib beradi, ko'chirasan","O'zing yozasan, AI xatolarni ko'rsatadi","AI 3 ta tayyor variant beradi, birini tanlaysan","Do'stingdan olib, ozgina o'zgartirasan"],c:1,
     w:"Fikr sendan chiqsa — ko'nikma senda qoladi. AI tekshiruvchi bo'lsa foydali, muallif bo'lsa zararli."},
    {q:"Qaysi biri AI'ni to'g'ri ishlatishga eng yaqin?",
     a:["\"Menga referat yoz\"","\"Mana mening rejam, zaif joyini top\"","\"Javobni ayt, tushuntirma\"","\"Men o'rniga o'yla\""],c:1,
     w:"Eng foydali prompt — sening ishingni AI'ga tekshirtirish. Bo'sh joydan tayyor javob so'rash emas."},
    {q:"Do'sting AI yozgan uy vazifasini topshirdi va \"5\" oldi. Nima yo'qotdi?",
     a:["Hech narsa, baho muhim","Vaqt","O'sha mavzuni o'rganish imkonini","Faqat halollikni"],c:2,
     w:"Baho bugun, ko'nikma umrbod. Imtihon kuni AI yonida bo'lmaydi."}]},

{ n:2, t:"Har muammo yechishga arzimaydi",
  learn:"Uchta savol — bu muammo nechta odamda bor? takrorlanadimi? kimgadir zarar tegadimi? Guruhing loyihasi shu filtrdan chiqadi.",
  where:"Qaysi ishga \"ha\", qaysiga \"yo'q\" deyishni shu yerda o'rganasan — bu AI'siz ham ishlaydi.",
  key:["1-savol: bu muammo nechta odamda bor?",
       "2-savol: u takrorlanadimi yoki bir martalikmi?",
       "3-savol: yechilmasa kimgadir zarar tegadimi?",
       "Uchalasiga ham \"ha\" bo'lsa — ishlashga arziydi."],
  tasks:[
    {id:"filt",type:"filter",t:"3 savol filtri",pts:15,
     d:"1-darsdagi ro'yxatingdan bitta muammoni tanla va uchta savoldan o'tkaz."},
    {id:"tanla",type:"text",t:"Guruh muammosi",pts:15,min:50,
     d:"Guruhing qaysi muammoni tanladi va NEGA aynan uni? Filtrdan qanday o'tdi?",
     ph:"Tanladik: ... Chunki: ..."}],
  duel:[
    {q:"Qaysi muammo ishlashga ARZIYDI?",
     a:["Mening qalamim yo'qoldi","Sinfimizda navbatchilik jadvali doim chalkashadi","Bugun havo sovuq","Telefonim zaryadi tez tugadi"],c:1,
     w:"Ko'p odamda bor + har hafta takrorlanadi + chalkashlik zarar keltiradi. Uchala filtrdan ham o'tdi."},
    {q:"\"Bu muammo faqat menda bor\" — bu qaysi savolga javob?",
     a:["Nechta odamda bor?","Takrorlanadimi?","Zarar tegadimi?","Qancha turadi?"],c:0,
     w:"Birinchi filtr. Faqat senda bo'lsa — bu loyiha emas, shaxsiy odat."},
    {q:"Muammo takrorlanmasa nima bo'ladi?",
     a:["Yechim ham bir marta kerak bo'ladi — loyiha shart emas","Baribir loyiha qilish kerak","Muammo kattaroq bo'ladi","Farqi yo'q"],c:0,
     w:"Bir martalik muammoni bir marta qo'lda yechish arzonroq. Loyiha — takrorlanadigan narsa uchun."}]},

{ n:3, t:"Fil qanday yeyiladi",
  learn:"Katta va qo'rqinchli ishni kichik bosqichlarga bo'lishni.",
  where:"Imtihonga tayyorgarlikda, maktab loyihasida, referatda. \"Qayerdan boshlashni bilmayapman\" degan holat tugaydi.",
  key:["Katta ish qo'rqitadi, chunki miya uni bitta bo'lak deb ko'radi.",
       "Har bosqich 20-30 daqiqada tugaydigan bo'lsin.",
       "Birinchi bosqich shunchalik kichik bo'lsinki, boshlamaslik uyat bo'lsin."],
  tasks:[
    {id:"bosq",type:"steps",t:"Filni bo'lish",pts:20,
     d:"Guruhing loyihasini 5-7 bosqichga bo'l. Har biri bitta o'tirishda tugaydigan bo'lsin."},
    {id:"birinchi",type:"text",t:"Birinchi bosqich",pts:10,min:30,
     d:"Eng birinchi bosqichni yoz va uni bugun bajarasanmi? Qachon?",ph:"Bugun soat ...da ..."}],
  duel:[
    {q:"\"Mobil ilova qilamiz\" — bu nima?",
     a:["Yaxshi birinchi bosqich","Bosqich emas, bu butun fil","Kichik vazifa","Reja"],c:1,
     w:"Bu natija, bosqich emas. Bosqich — \"3 ta ekran eskizini qog'ozga chizish\"."},
    {q:"Qaysi bosqich TO'G'RI o'lchamda?",
     a:["Butun saytni yasash","5 ta odamdan so'rov olish","Dunyoni o'zgartirish","Hammasini o'rganish"],c:1,
     w:"Bir o'tirishda tugaydi, natijasi ko'rinadi, keyingi qadamni aniqlaydi."},
    {q:"Bosqichlarni bo'lishdan asosiy foyda nima?",
     a:["Ish tezroq tugaydi","Boshlash qo'rqinchli bo'lmay qoladi","Baho yaxshi bo'ladi","AI yaxshi tushunadi"],c:1,
     w:"Asosiy dushman — boshlamaslik. Kichik bosqich qarshilikni sindiradi."}]},

{ n:4, t:"Miyangdagini so'z bilan chiqara olasanmi?",
  learn:"Bir fikrni uch xil aniqlikda yozishni va farqini ko'rishni.",
  where:"AI seni tushunmasa, aybdor AI emas — sening jumlang. Insho, xat, ariza — hammasi shu ko'nikma.",
  key:["1-daraja: umumiy (\"yaxshi matn yoz\")",
       "2-daraja: aniq (\"5 jumlalik, 7-sinf uchun\")",
       "3-daraja: to'liq (kim uchun, qanday ohangda, qanday formatda, nima bo'lmasin)"],
  tasks:[
    {id:"uch",type:"triple",t:"Uch daraja",pts:20,
     d:"Bitta fikrni uch xil aniqlikda yoz. Keyin uchalasini AI'ga berib, javob farqini ko'r.",
     labels:["1-daraja: umumiy","2-daraja: aniqroq","3-daraja: to'liq"]},
    {id:"farq",type:"text",t:"Farq nimada?",pts:10,min:40,
     d:"Uchta javob qanday farq qildi? Qaysi biri ishga yaradi?"}],
  duel:[
    {q:"AI noto'g'ri javob berdi. Birinchi navbatda nimani tekshirasan?",
     a:["Boshqa AI'ga o'taman","Savolimni — nimani aytmay qoldirdim?","AI buzilgan deb qo'yaman","Qayta-qayta so'rayman"],c:1,
     w:"Ko'p hollarda kamchilik promptda: kim uchun, qanday formatda, qancha hajmda — aytilmagan."},
    {q:"Qaysi so'rov eng aniq?",
     a:["Xat yoz","Direktorga xat yoz","Direktorga sport zali haqida, 6 jumlalik, hurmatli ohangda ariza yoz",
        "Menga yaxshi xat kerak"],c:2,
     w:"Kim uchun + mavzu + hajm + ohang. Shu to'rttasi bo'lsa AI yanglishmaydi."},
    {q:"\"Qisqa yoz\" degani AI uchun nechta jumla?",
     a:["3 ta","10 ta","Aniq emas — shuning uchun raqam yozish kerak","1 ta"],c:2,
     w:"\"Qisqa\", \"tez\", \"chiroyli\" — o'lchovsiz so'zlar. Raqam bilan almashtir."}]},

{ n:5, t:"AI ishonch bilan yolg'on gapiradi",
  learn:"AI bergan javobni tekshirishning aniq usulini. To'qib chiqarilgan kitob, sana, raqamni qanday ushlashni.",
  where:"Har kuni. Sinfingda AI'ga aldanmagan yagona odam bo'lasan.",
  key:["AI bilmasligini tan olmaydi — o'rniga ishonarli to'qiydi.",
       "Eng xavflisi: ism, sana, raqam, manba, iqtibos.",
       "Qoida: raqam yoki manba bo'lsa — mustaqil joydan tekshir."],
  tasks:[
    {id:"ov",type:"hunt",t:"Yolg'on ovi",pts:25,
     d:"AI javobini o'qi va ichidagi to'qilgan jumlani top."},
    {id:"tekshir",type:"text",t:"O'z ovingni yoz",pts:20,min:50,
     d:"Bugun AI'dan olgan javobingda xato topdingmi? Nimani, qanday tekshirding?"}],
  duel:[
    {q:"AI kitob nomi va muallifini keltirdi. Nima qilasan?",
     a:["Ishonaman, AI bilimdon","Kutubxona yoki qidiruvda tekshiraman","AI'dan \"rostmi?\" deb so'rayman","Do'stimdan so'rayman"],c:1,
     w:"AI'dan \"rostmi?\" deb so'rash ishlamaydi — u yana ishonch bilan \"ha\" deydi. Mustaqil manba kerak."},
    {q:"Qaysi javobda YOLG'ON ehtimoli eng yuqori?",
     a:["\"Suv 100°C da qaynaydi\"","\"Bu she'r 1897-yilda «Oy» jurnalida chop etilgan\"","\"2+2=4\"","\"Toshkent O'zbekiston poytaxti\""],c:1,
     w:"Aniq sana + aniq nashr nomi — AI eng ko'p to'qiydigan joy. Umumiy faktlar xavfsizroq."},
    {q:"AI \"bilmayman\" deyishi kerak edi, lekin javob berdi. Nega?",
     a:["Yolg'onchi qilib yasalgan","U keyingi so'zni taxmin qiladi, \"bilmayman\" kamdan-kam taxmin bo'ladi",
        "Internet uzilgan","Savol noto'g'ri"],c:1,
     w:"6-darsda buni chuqurroq ko'ramiz: AI haqiqatni emas, ehtimolli davomni tanlaydi."}]},

{ n:6, t:"AI aslida qanday \"o'ylaydi\"?",
  learn:"Nega xato qilishini, nega bir savolga har safar boshqa javob berishini, nega uzun suhbatda unutib qo'yishini.",
  where:"Uni sehr deb ham, Google deb ham o'ylashni bas qilasan. Xatoni oldindan kutasan — demak sezasan.",
  key:["AI keyingi so'zni ehtimol bo'yicha tanlaydi — haqiqatni qidirmaydi.",
       "Shuning uchun har safar javob biroz boshqacha.",
       "Uning \"xotirasi\" cheklangan — uzun suhbatda boshi tushib qoladi.",
       "Google topadi, AI yasaydi. Ikkovi boshqa asbob."],

const TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined)
  ? window.Telegram.WebApp : null;
const IN_TG = !!(TG && TG.initDataUnsafe && TG.initDataUnsafe.user);

if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor("#0f2a43"); } catch(e){} }

const Bio = {
  kind: "yo'q",
  async init(){
    if (TG && TG.BiometricManager && TG.BiometricManager.init){
      await new Promise(r=>{ try{ TG.BiometricManager.init(r); }catch(e){ r(); } });
      if (TG.BiometricManager.isBiometricAvailable){
        this.kind = TG.BiometricManager.biometricType === "face" ? "Face ID" : "Barmoq izi";
        return "tg";
      }
    }
    if (window.PublicKeyCredential && location.protocol === "https:"){
      try{
        if (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()){
          this.kind = "Face ID / barmoq izi"; return "webauthn";
        }
      }catch(e){}
    }
    return null;
  },
  /* Qurilma egasini tasdiqlash. true = shu telefon egasi tasdiqladi. */
  async verify(reason){
    const t = await this.init();
    if (t === "tg"){
      const bm = TG.BiometricManager;
      if (!bm.isAccessGranted){
        const ok = await new Promise(r=>bm.requestAccess({reason}, r));
        if (!ok) return false;
      }
      return await new Promise(r=>bm.authenticate({reason}, ok=>r(!!ok)));
    }
    if (t === "webauthn") return await webauthn();
    return true; /* qurilma qo'llamasa — to'sib qo'ymaymiz */
  }
};

async function webauthn(){
  const KEY = "sinf:wa:" + (S.code||"") ;
  const saved = localStorage.getItem(KEY);
  const rnd = n => { const a=new Uint8Array(n); crypto.getRandomValues(a); return a; };
  try{
    if (!saved){
      const c = await navigator.credentials.create({publicKey:{
        challenge: rnd(32),
        rp:{name:"AI Kursi"},
        user:{id: rnd(16), name: (S.me&&S.me.name)||"o'quvchi", displayName:(S.me&&S.me.name)||"o'quvchi"},
        pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},
        timeout:60000
      }});
      if(!c) return false;
      localStorage.setItem(KEY, btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
      return true;
    }
    const id = Uint8Array.from(atob(saved), ch=>ch.charCodeAt(0));
    const a = await navigator.credentials.get({publicKey:{
      challenge: rnd(32), allowCredentials:[{type:"public-key",id}],
      userVerification:"required", timeout:60000
    }});
    return !!a;
  }catch(e){ return false; }
}

let DB = null;

const LocalDB = {
  mode:"local",
  bc: ("BroadcastChannel" in window) ? new BroadcastChannel("sinf") : null,
  subs: [],
  k(p){ return "sinf:" + p; },
  get(p,d){ try{ return JSON.parse(localStorage.getItem(this.k(p))) ?? d; }catch(e){ return d; } },
  set(p,v){ localStorage.setItem(this.k(p), JSON.stringify(v)); this.ping(p); },
  ping(p){ if(this.bc) this.bc.postMessage(p); this.subs.forEach(f=>f(p)); },
  start(){ if(this.bc) this.bc.onmessage = e => this.subs.forEach(f=>f(e.data));
           window.addEventListener("storage", e => { if(e.key&&e.key.startsWith("sinf:")) this.subs.forEach(f=>f(e.key.slice(5))); }); },
  sub(path, run){ const f = p => { if (p===path) run(); };
    this.subs.push(f); run(); return ()=>{ this.subs = this.subs.filter(x=>x!==f); }; },
  on(path, cb){ return this.sub(path, ()=>cb(this.get(path,null))); },
  onList(path, cb){ return this.sub(path, ()=>cb(Object.values(this.get(path,{})))); },

  async auth(){ let u=localStorage.getItem("sinf:uid");
    if(!u){ u = IN_TG ? ("tg"+TG.initDataUnsafe.user.id) : ("u"+Math.random().toString(36).slice(2,10));
      localStorage.setItem("sinf:uid",u);} return u; },
  async getClass(c){ return this.get(`c/${c}`,null); },
  async saveClass(c,d){ const cur=this.get(`c/${c}`,{})||{}; this.set(`c/${c}`,{...cur,...d}); },
  watchClass(c,cb){ return this.on(`c/${c}`,cb); },
  watchStudents(c,cb){ return this.onList(`c/${c}/st`,cb); },
  async setStudent(c,uid,d){ const all=this.get(`c/${c}/st`,{}); all[uid]={...(all[uid]||{}),...d,uid}; this.set(`c/${c}/st`,all); },
  async bumpPoints(c,uid,n,wk){ const all=this.get(`c/${c}/st`,{}); const s=all[uid]||{uid};
    s.pts=(s.pts||0)+n; s.wkPts=(s.wk===wk?(s.wkPts||0):0)+n; s.wk=wk; all[uid]=s; this.set(`c/${c}/st`,all); },
  watchEntries(c,uid,cb){ return this.onList(`c/${c}/e/${uid}`,cb); },
  async addEntry(c,uid,e){ const all=this.get(`c/${c}/e/${uid}`,{}); const id="e"+Date.now()+Math.random().toString(36).slice(2,6);
    all[id]={...e,id}; this.set(`c/${c}/e/${uid}`,all); },
  async setLive(c,l){ this.set(`c/${c}/live`,l); },
  watchLive(c,cb){ return this.on(`c/${c}/live`,cb); },
  async setAnswer(c,key,uid,d){ const all=this.get(`c/${c}/a/${key}`,{}); all[uid]={...d,uid}; this.set(`c/${c}/a/${key}`,all); },
  watchAnswers(c,key,cb){ return this.onList(`c/${c}/a/${key}`,cb); }
};

async function makeCloudDB(cfg){
  const A = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
  const U = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
  const app = A.initializeApp(cfg);
  const auth = U.getAuth(app);
  const fs = F.getFirestore(app);
  const {doc,setDoc,getDoc,updateDoc,onSnapshot,collection,increment,serverTimestamp} = F;
  const D = (...p)=>doc(fs,...p), C = (...p)=>collection(fs,...p);
  return {
    mode:"cloud", fs, F,
    async auth(){ if(!auth.currentUser) await U.signInAnonymously(auth); return auth.currentUser.uid; },
    async getClass(c){ const s=await getDoc(D("classes",c)); return s.exists()?s.data():null; },
    async saveClass(c,d){ await setDoc(D("classes",c), d, {merge:true}); },
    watchClass(c,cb){ return onSnapshot(D("classes",c), s=>cb(s.exists()?s.data():null)); },
    watchStudents(c,cb){ return onSnapshot(C("classes",c,"students"), q=>cb(q.docs.map(d=>({...d.data(),uid:d.id})))); },
    async setStudent(c,uid,d){ await setDoc(D("classes",c,"students",uid), {...d,uid,seen:serverTimestamp()}, {merge:true}); },
    async bumpPoints(c,uid,n,wk){
      const r=D("classes",c,"students",uid); const s=await getDoc(r);
      const cur=s.exists()?s.data():{};
      await setDoc(r,{pts:increment(n), wk, wkPts:(cur.wk===wk?(cur.wkPts||0):0)+n},{merge:true}); },
    watchEntries(c,uid,cb){ return onSnapshot(C("classes",c,"students",uid,"entries"), q=>cb(q.docs.map(d=>({...d.data(),id:d.id})))); },
    async addEntry(c,uid,e){ await setDoc(D("classes",c,"students",uid,"entries","e"+Date.now()+Math.random().toString(36).slice(2,6)),
      {...e, ts:serverTimestamp()}); },
    async setLive(c,l){ await setDoc(D("classes",c,"live","now"), l); },
    watchLive(c,cb){ return onSnapshot(D("classes",c,"live","now"), s=>cb(s.exists()?s.data():null)); },
    async setAnswer(c,key,uid,d){ await setDoc(D("classes",c,"answers",key+"__"+uid), {...d,uid,key}); },
    watchAnswers(c,key,cb){ return onSnapshot(C("classes",c,"answers"), q=>cb(q.docs.map(d=>d.data()).filter(x=>x.key===key))); }
  };
}

function fileToUrl(f){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); }); }
function shrink(url, size=220){
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{
    const c=document.createElement("canvas"); c.width=c.height=size;
    const k=Math.min(im.width,im.height);
    const g=c.getContext("2d");
    g.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,size,size);
    res(c.toDataURL("image/jpeg",0.72));
  }; im.src=url; });
}

    form = done ? myAnswer(l.n,t.id) :
      `<label>O'ZIM qilaman (3 ta)</label>${[0,1,2].map(i=>`<input id="i-${id}-${i}">`).join("")}
       <label>AI qilishi mumkin (3 ta)</label>${[3,4,5].map(i=>`<input id="i-${id}-${i}">`).join("")}
       <button class="btn sm" style="margin-top:8px" data-a="sub" data-l="${l.n}" data-t="${t.id}">Topshirish (+${t.pts})</button>`;
  } else if (t.type==="hunt"){
    form = done ? `<p class="small">Ov muvaffaqiyatli ✓</p>` + myAnswer(l.n,t.id) : huntBox(l.n,t);
  }
  return `<div class="card task ${done?"done":""}">
    <h3>${done?"✓":"○"} ${esc(t.t)}<span class="pill">+${t.pts}</span></h3>
    <p class="small">${esc(t.d)}</p>${form}</div>`;
}
function myAnswer(ln,tid){
  const e = S.entries.find(x=>x.lesson===ln && x.task===tid);
  return e ? `<div class="note">${nl2br(e.text)}</div>` : "";
}

ACT.hunt = async (n)=>{

/* --- topshirish --- */
ACT.sub = async (btn)=>{
  const ln=+btn.dataset.l, tid=btn.dataset.t, l=lessonOf(ln), t=tasksOf(l).find(x=>x.id===tid);
  const g = i => (document.getElementById(`i-${ln}_${tid}-${i}`)||{}).value?.trim()||"";
  let text="";
  if (t.type==="list" || t.type==="text") text = g(0);
  else if (t.type==="steps")  text = [0,1,2,3,4].map(i=>g(i)).filter(Boolean).map((s,i)=>`${i+1}. ${s}`).join("\n");
  else if (t.type==="triple") text = t.labels.map((lb,i)=>`${lb}: ${g(i)}`).filter(s=>s.split(": ")[1]).join("\n");
  else if (t.type==="filter") text = `Muammo: ${g(0)}\nNechta odamda: ${g(1)} · Takrorlanadi: ${g(2)} · Zarar: ${g(3)}\nXulosa: ${g(4)}`;
  else if (t.type==="prompt") text = ["ROL","SHAROIT","MISOL","FORMAT"].map((k,i)=>`${k}: ${g(i)}`).filter(s=>s.split(": ")[1]).join("\n");
  else if (t.type==="border") text = `O'zim: ${[0,1,2].map(g).filter(Boolean).join(", ")}\nAI: ${[3,4,5].map(g).filter(Boolean).join(", ")}`;

  const plain = text.replace(/^[^:]*:/gm,"").trim();
  if (t.min && plain.length < t.min) return toast(`Kamida ${t.min} belgi yozing`, true);
  if (!plain || plain.length < 6) return toast("Bo'sh qoldirmang", true);
  if (t.type==="steps" && text.split("\n").length < 3) return toast("Kamida 3 bosqich yozing", true);
  if (t.type==="prompt" && text.split("\n").length < 4) return toast("To'rt qismni ham to'ldiring", true);
  btn.disabled = true;
  await award(ln, tid, t.pts, text);
  toast(`+${t.pts} ball`);
};

async function award(lesson, task, pts, text){
  const wk = weekNo();
  await DB.addEntry(S.code, S.uid, {lesson, task, pts, text, ts:Date.now()});
  await DB.bumpPoints(S.code, S.uid, pts, wk);
  const st = {lastLesson: lesson};
  const today = new Date().toDateString();
  if (S.me && S.me.lastDay !== today){ st.lastDay = today; st.streak = (S.me.streak||0)+1; }
  await DB.setStudent(S.code, S.uid, st);
}

/* --- reyting --- */
function viewRank(){
  const ok = S.students.filter(s=>s.ok);
  const wk = weekNo();
  const wkOf = s => s.wk===wk ? (s.wkPts||0) : 0;
  const byWeek = [...ok].sort((a,b)=>wkOf(b)-wkOf(a));
  const groups = {};
  ok.forEach(s=>{ const g=s.group||"guruhsiz"; groups[g]=(groups[g]||0)+(s.pts||0); });
  const gl = Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  const row = (s,i,val)=>`<div class="rank ${s.uid===S.uid?"me":""} top${i+1}">
      <div class="n">${i+1}</div>
      <div class="nm">${esc(s.name)}<div class="st">${esc(s.group||"")}${s.streak?" · 🔥"+s.streak:""}</div></div>
      <div class="sc">${val}</div></div>`;
  return `<div class="card flat"><h2>Shu hafta</h2>
      <p class="small">Har dushanba haftalik reyting noldan boshlanadi — hamma uchun yangi imkon.</p></div>
    ${byWeek.slice(0,20).map((s,i)=>row(s,i,wkOf(s))).join("") || `<div class="card">Hali ball yo'q</div>`}
    <div class="card flat" style="margin-top:14px"><h2>Guruhlar (umumiy)</h2></div>
    ${gl.map(([g,v],i)=>`<div class="rank ${S.me&&S.me.group===g?"me":""} top${i+1}">
      <div class="n">${i+1}</div><div class="nm">${esc(g)}</div><div class="sc">${v}</div></div>`).join("")}
    <div class="card flat" style="margin-top:14px"><h2>Umumiy (butun kurs)</h2></div>
    ${[...ok].sort((a,b)=>(b.pts||0)-(a.pts||0)).slice(0,10).map((s,i)=>row(s,i,s.pts||0)).join("")}`;
}

function screenLive(){
  const L = S.live;
  if (!L || !L.mode || L.mode==="off"){
    h(`<div class="wrap">${hud()}<div class="card"><h2>Jonli o'yin tugadi</h2>
      <button class="btn ghost" data-a="tab" data-k="bugun">Darsga qaytish</button></div></div>${nav()}`);
    return;
  }
  const mine = S.answered && S.answered.key===L.key ? S.answered : null;
  const left = Math.max(0, Math.round((L.t0 + L.dur*1000 - Date.now())/1000));
  const opts = L.mode==="hunt" ? L.s : L.a;
  const title = L.mode==="duel" ? "Jonli duel" : L.mode==="hunt" ? "Yolg'on ovi" : "Ovoz berish";
  const head = L.mode==="hunt" ? `Mavzu: ${esc(L.topic)} — to'qilgan jumlani top` : esc(L.q);

  h(`<div class="wrap">${hud()}
    <div class="card accent">
      <small class="small">${title.toUpperCase()}</small>
      <h2 style="margin:6px 0 0">${head}</h2>
      ${L.reveal?"":`<div class="timer"><i style="width:${Math.round(left/L.dur*100)}%"></i></div>
        <small>${left} soniya</small>`}
    </div>
    ${opts.map((o,i)=>{
      let c="opt";
      if (L.reveal){
        if (L.mode!=="poll" && i===L.c) c+=" right";
        else if (mine && mine.c===i) c+=" wrong";
      } else if (mine && mine.c===i) c+=" picked";
      return `<button class="${c}" ${L.reveal||mine?"disabled":`data-a="pickLive" data-i="${i}"`}>${esc(o)}</button>`;
    }).join("")}
    ${L.reveal && L.w ? `<div class="card"><h3>Nega</h3><p class="small">${esc(L.w)}</p></div>` : ""}
    ${!L.reveal && mine ? `<div class="card flat"><p>Javobing qabul qilindi. Muallim ochishini kut.</p></div>`:""}
  </div>${nav()}`);
  clearTimeout(S._tick);
  if (!L.reveal) S._tick = setTimeout(()=>{ if(S.tab==="live") render(); }, 1000);
}
ACT.pickLive = async (n)=>{
  const L=S.live, i=+n.dataset.i;
  S.answered = {key:L.key, c:i, ms:Date.now()-L.t0};
  await DB.setAnswer(S.code, L.key, S.uid, {c:i, ms:S.answered.ms, name:(S.me&&S.me.name)||""});
  render();
};
async function maybeAwardLive(){
  const L = S.live; if (!L || !L.reveal || !L.key) return;
  const flag = "sinf:aw:"+S.code+":"+L.key;
  if (localStorage.getItem(flag)) return;
  const mine = S.answered && S.answered.key===L.key ? S.answered : null;
  if (!mine) return;
  localStorage.setItem(flag,"1");
  let pts=0, label="";
  if (L.mode==="poll"){ pts=5; label="Ovoz berdim"; }
  else if (mine.c===L.c){
    const bonus = Math.round(20 * Math.max(0,(L.dur*1000-mine.ms))/(L.dur*1000));
    pts = (L.mode==="hunt" ? 25 : 10) + (L.mode==="hunt" ? 0 : bonus);
    label = "To'g'ri javob";
  }
  if (pts>0){
    await DB.addEntry(S.code,S.uid,{lesson:L.lesson||0, task:"live:"+L.mode, pts,
      text:`${label} — ${L.mode==="hunt"?L.topic:L.q}`, ts:Date.now()});
    await DB.bumpPoints(S.code,S.uid,pts,weekNo());
    toast("+"+pts+" ball");
  }
}

function tLiveRunning(L){
  const total=S.students.filter(s=>s.ok).length;
  const ans=S.liveAns||[];
  const opts = L.mode==="hunt"?L.s:L.a;
  const counts = opts.map((_,i)=>ans.filter(a=>a.c===i).length);
  const head = L.mode==="hunt"?`Mavzu: ${esc(L.topic)} — to'qilgan jumlani toping`:esc(L.q);
  return `<div class="card accent"><small class="small">${L.mode==="duel"?"DUEL":L.mode==="hunt"?"YOLG'ON OVI":"OVOZ BERISH"}</small>
      <h2>${head}</h2>
      <p class="small">${ans.length} / ${total} javob berdi</p></div>
    ${opts.map((o,i)=>{
      const w = ans.length?Math.round(counts[i]/ans.length*100):0;
      const right = L.reveal && L.mode!=="poll" && i===(L.mode==="hunt"?HUNTS[L.hi].lie:lessonOf(L.lesson).duel[L.qi].c);
      return `<div class="opt ${right?"right":""}">${esc(o)}
        <div class="bar" style="margin-top:8px"><i style="width:${w}%"></i></div>
        <small>${counts[i]} ta${L.reveal?"":""}</small></div>`;
    }).join("")}
    <div class="btn-row" style="margin-top:12px">
      ${L.reveal?"":`<button class="btn" data-a="reveal">Javobni ochish</button>`}
      ${L.mode==="duel"&&L.reveal?`<button class="btn" data-a="startDuel" data-n="${L.lesson}" data-i="${L.qi+1}">Keyingi savol</button>`:""}
      <button class="btn ghost" data-a="stopLive">To'xtatish</button>
      <button class="btn ghost" data-a="proj">Proyektor</button>
    </div>`;
}
ACT.reveal = async ()=>{
  const L=S.live;
  let c=-1,w="";
  if(L.mode==="duel"){ const q=lessonOf(L.lesson).duel[L.qi]; c=q.c; w=q.w; }
  else if(L.mode==="hunt"){ c=HUNTS[L.hi].lie; w=HUNTS[L.hi].w; }
  await DB.setLive(S.code,{...L,reveal:true,c,w});
};
ACT.stopLive = async ()=>{ await DB.setLive(S.code,{mode:"off"}); };
ACT.proj = ()=>{ document.body.classList.toggle("proj");
  if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };

function tReyting(){
  const ok=S.students.filter(s=>s.ok), wk=weekNo();
  const wkOf=s=>s.wk===wk?(s.wkPts||0):0;
  return `<div class="card flat"><h2>Haftalik reyting</h2>
      <button class="btn sm ghost" data-a="proj">Proyektor rejimi</button></div>` +
    [...ok].sort((a,b)=>wkOf(b)-wkOf(a)).map((s,i)=>`<div class="rank top${i+1}">
      <div class="n">${i+1}</div><div class="nm">${esc(s.name)}<div class="st">${esc(s.group||"")}</div></div>
      <div class="sc">${wkOf(s)}</div></div>`).join("") +
    `<div class="card flat" style="margin-top:14px"><h2>Umumiy</h2></div>` +
    [...ok].sort((a,b)=>(b.pts||0)-(a.pts||0)).map((s,i)=>`<div class="rank top${i+1}">
      <div class="n">${i+1}</div><div class="nm">${esc(s.name)}</div><div class="sc">${s.pts||0}</div></div>`).join("") +
    `<div class="card noprint" style="margin-top:14px"><button class="btn ghost" data-a="newWeek">Haftani yakunlash (reyting noldan)</button></div>`;
}
ACT.newWeek = async ()=>{
  if(!confirm("Haftalik ballar nolga tushsinmi? Umumiy ball saqlanadi.")) return;
  for(const s of S.students) await DB.setStudent(S.code,s.uid,{wkPts:0,wk:weekNo()});
  toast("Yangi hafta boshlandi");
};
function tRuyxat(){
  const ok=S.students.filter(s=>s.ok).sort((a,b)=>(b.pts||0)-(a.pts||0));
  if(S.viewStudent){
    const s=S.students.find(x=>x.uid===S.viewStudent);
    return `<div class="card"><button class="btn sm ghost" data-a="closeStudent">← Orqaga</button>
      <h2 style="margin-top:8px">${esc(s?s.name:"")}</h2>
      <p class="small">${esc((s&&s.group)||"")} · ${s?s.pts||0:0} ball</p></div>` +
      (S.viewEntries||[]).sort((a,b)=>a.lesson-b.lesson).map(e=>`<div class="card">
        <small>${e.lesson}-dars · ${esc(e.task)} · +${e.pts}</small>
        <div class="note" style="margin-top:6px">${nl2br(e.text)}</div></div>`).join("") ||
      `<div class="card"><p class="small">Hali ish topshirmagan.</p></div>`;
  }
  return `<div class="card flat"><h2>O'quvchilar (${ok.length})</h2>
      <p class="small">Ism ustiga bosing — nima yozganini ko'rasiz. Ball bor, ish yo'q bo'lsa — savol bering.</p></div>` +
    ok.map(s=>`<div class="rank" data-a="openStudent" data-u="${s.uid}" style="cursor:pointer">
      ${s.photo?`<img src="${s.photo}" style="width:34px;height:34px;border-radius:11px;object-fit:cover">`:`<div class="n">·</div>`}
      <div class="nm">${esc(s.name)}<div class="st">${esc(s.group||"guruhsiz")} · 🔥${s.streak||0}</div></div>
      <div class="sc">${s.pts||0}</div></div>`).join("");
}
ACT.openStudent = n=>{ S.viewStudent=n.dataset.u; S.viewEntries=[];
  if(S._unsubStud) S._unsubStud();
  S._unsubStud = DB.watchEntries(S.code,n.dataset.u,e=>{ S.viewEntries=e; if(S.tab==="ruyxat") render(); });
  render(); };
ACT.closeStudent = ()=>{ S.viewStudent=null; if(S._unsubStud){S._unsubStud();S._unsubStud=null;} render(); };

/* ---------------------------------------------------------------------
   10) ULANISH, RENDER, ISHGA TUSHIRISH
   --------------------------------------------------------------------- */
function detach(){ S.unsub.forEach(f=>{try{f();}catch(e){}}); S.unsub=[];
  if(S._unsubAns){try{S._unsubAns();}catch(e){} S._unsubAns=null;} }

async function attach(code){
  detach();
  S.loaded=false;
  S.unsub.push(DB.watchClass(code, c=>{ S.cls=c; render(); }));
  S.unsub.push(DB.watchStudents(code, list=>{
    S.students = list.filter(s=>s && s.name);
    const was = S.me && S.me.ok;
    S.me = S.students.find(s=>s.uid===S.uid) || null;
    S.loaded = true;
    if (S.me && S.me.ok && !was && S.role==="student") toast("Tasdiqlandi — darslar ochiq");
    render();
  }));
  S.unsub.push(DB.watchLive(code, l=>{
    const prev = S.live && S.live.key;
    S.live = l;
    if (l && l.mode && l.mode!=="off"){
      if (S.role==="teacher"){
        if (S._unsubAns) S._unsubAns();
        S.liveAns=[];
        S._unsubAns = DB.watchAnswers(code, l.key, a=>{ S.liveAns=a; if(S.role==="teacher") render(); });
      } else {
        if (l.key!==prev && S.tab!=="live") S.tab="live";
        if (l.reveal) maybeAwardLive();
      }
    } else if (S.tab==="live") S.tab="bugun";
    render();
  }));
  S.unsub.push(DB.watchEntries(code, S.uid, e=>{ S.entries=e; render(); }));
}

let _raf=null;
function render(){
  if (_raf) return; _raf = requestAnimationFrame(()=>{ _raf=null; draw(); });
}
function draw(){
  switch(S.screen){
    case "boot":   h(`<div class="wrap">${brand("Yuklanmoqda...")}</div>`); break;
    case "gate":   screenGate(); break;
    case "reg":    screenReg(); break;
    case "tgate":  screenTeacherGate(); break;
    case "teacher":
      if (!S.cls) { h(`<div class="wrap">${brand("Yuklanmoqda...")}</div>`); break; }
      screenTeacher(); break;
    case "app":
      if (!S.loaded) { h(`<div class="wrap">${brand("Yuklanmoqda...")}</div>`); break; }
      if (!S.me) { S.screen="reg"; S.reg.code=S.code; screenReg(); break; }
      if (!S.me.ok) { screenPending(); break; }
      screenStudent(); break;
    default: screenGate();
  }
}

(async function boot(){
  LocalDB.start();
  try { DB = FB_CONFIG ? await makeCloudDB(FB_CONFIG) : LocalDB; }
  catch(e){ console.warn("Bulutga ulanmadi, mahalliy rejim:", e); DB = LocalDB; }
  S.uid = await DB.auth();
  await Bio.init();

  let code = localStorage.getItem("sinf:code") || "";
  const qc = new URLSearchParams(location.search).get("code");
  if (qc) code = qc.toUpperCase();
  if (IN_TG && TG.initDataUnsafe.start_param) code = String(TG.initDataUnsafe.start_param).toUpperCase();
  S.role = localStorage.getItem("sinf:role") || "";

  if (code && S.role){
    S.code = code;
    S.screen = S.role==="teacher" ? "teacher" : "app";
    S.tab    = S.role==="teacher" ? "dars" : "darslar";
    await attach(code);
  } else if (code){
    S.code = code; S.reg.code = code;
    S.screen = (await DB.getClass(code)) ? "reg" : "gate";
  } else S.screen = "gate";
  render();

  if ("serviceWorker" in navigator && location.protocol==="https:")
    navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
