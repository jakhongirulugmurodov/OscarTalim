<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A1119">
<meta name="description" content="Anjuman (otjimaniya) mashg'ulotlari uchun ovozli murabbiy: avtomatik sanoq, dam olish taymeri va sizga moslashadigan reja.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Anjuman Murabbiy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Commissioner:wght@300;400;500;600;700&display=swap">
<style>
/* ============================================================
   ANJUMAN MURABBIY — Registon koshini: chuqur indigo, feruza, oltin
   ============================================================ */
:root{
  --bg:        #0A1119;
  --bg-deep:   #060C12;
  --surface:   #101C28;
  --surface-2: #172734;
  --line:      #223849;
  --line-soft: #1a2c3a;

  --ink:       #E9F2F6;
  --ink-2:     #A7BECC;
  --ink-3:     #6C8798;

  --tile:      #2BC4CE;   /* feruza — asosiy harakat */
  --tile-deep: #16929B;
  --tile-glow: rgba(43,196,206,.18);
  --gold:      #E3B23C;   /* rekord, yutuq */
  --clay:      #D2603A;   /* maksimal / charchaguncha */
  --good:      #4CC38A;
  --warn:      #E08A3C;

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 24px;

  --sans: "Commissioner", "Segoe UI", system-ui, -apple-system, sans-serif;
  --disp: "Oswald", "Segoe UI Semibold", system-ui, sans-serif;

  --pad: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}

/* Fon: koshin naqshiga ishora — juda past kontrastli romb to'r */
body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1100px 700px at 50% -15%, rgba(43,196,206,.10), transparent 62%),
    repeating-linear-gradient(45deg, rgba(43,196,206,.030) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(-45deg, rgba(227,178,60,.022) 0 1px, transparent 1px 26px);
}

#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- Umumiy tipografiya ---------- */
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:500;letter-spacing:.01em;text-wrap:balance}
h1{font-size:1.5rem}
h2{font-size:1.18rem}
h3{font-size:1rem}
p{margin:0}
.eyebrow{
  font-family:var(--sans);font-size:.68rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:500;line-height:1}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}

/* ---------- Ekranlar ---------- */
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.scroller{flex:1;overflow-y:auto;padding:calc(var(--safe-t) + 14px) var(--pad) 96px;-webkit-overflow-scrolling:touch}

/* ---------- Kartalar ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r-m);
  padding:16px;
}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- Tugmalar ---------- */
.btn{
  font-family:var(--sans);font-size:.95rem;font-weight:600;
  color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-s);
  padding:13px 18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:active{transform:scale(.975)}
.btn:focus-visible{outline:2px solid var(--tile);outline-offset:2px}
.btn.primary{
  background:linear-gradient(180deg,var(--tile),var(--tile-deep));
  color:#04181B;border-color:transparent;font-weight:700;
  letter-spacing:.02em;
  box-shadow:0 6px 22px -10px rgba(43,196,206,.9);
}
.btn.gold{background:linear-gradient(180deg,var(--gold),#B98A22);color:#1B1305;border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.lg{padding:17px 22px;font-size:1.05rem}
.btn:disabled{opacity:.42;cursor:default}

.icon-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  cursor:pointer;font-size:1.05rem;line-height:1;padding:0;
}
.icon-btn:active{transform:scale(.94)}

/* ---------- Sarlavha paneli ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) var(--pad) 6px;
}
.wordmark{display:flex;align-items:center;gap:9px}
.wordmark .mark{width:26px;height:26px;flex:none}
.wordmark b{font-family:var(--disp);font-weight:600;font-size:1.12rem;letter-spacing:.09em;text-transform:uppercase}
.pill{
  font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);
  background:var(--surface);
}
.pill.tile{color:var(--tile);border-color:rgba(43,196,206,.4);background:rgba(43,196,206,.09)}
.pill.gold{color:var(--gold);border-color:rgba(227,178,60,.4);background:rgba(227,178,60,.09)}
.pill.clay{color:var(--clay);border-color:rgba(210,96,58,.45);background:rgba(210,96,58,.1)}

/* ---------- Bugungi mashg'ulot ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,#12222F 0%,#0D1721 100%);
  border:1px solid var(--line);border-radius:var(--r-l);
  padding:20px 18px 18px;
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;
  background:radial-gradient(circle,var(--tile-glow),transparent 68%);pointer-events:none;
}
.hero h2{font-size:1.6rem;margin-top:2px}
.plan-list{display:flex;flex-direction:column;gap:2px;margin:16px 0 18px}
.plan-line{
  display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line-soft);
}
.plan-line:last-child{border-bottom:0}
.plan-line .idx{
  font-family:var(--disp);font-size:.8rem;color:var(--ink-3);
  border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center;
}
.plan-line .nm{font-weight:600;font-size:.95rem}
.plan-line .sub{font-size:.74rem;color:var(--ink-3)}
.plan-line .tgt{font-family:var(--disp);font-size:1.15rem;color:var(--tile);white-space:nowrap}
.plan-line .tgt small{font-size:.62rem;color:var(--ink-3);letter-spacing:.08em;display:block;text-align:right;font-family:var(--sans)}

/* ---------- Hafta chizig'i ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{
  text-align:center;padding:9px 0 8px;border-radius:var(--r-s);
  background:var(--surface-2);border:1px solid transparent;
}
.day .d{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.day .n{font-family:var(--disp);font-size:1.05rem;margin-top:2px;color:var(--ink-2)}
.day.done{background:rgba(43,196,206,.13);border-color:rgba(43,196,206,.38)}
.day.done .n{color:var(--tile)}
.day.today{border-color:var(--gold)}
.day.today .d{color:var(--gold)}

/* ---------- Statistika plitkalari ---------- */
.tile{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);
  padding:14px 14px 13px;
}
.tile .v{font-family:var(--disp);font-size:1.85rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.tile.gold .v{color:var(--gold)}
.tile.tile-t .v{color:var(--tile)}
.tile.clay .v{color:var(--clay)}

/* ---------- Pastki navigatsiya ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,17,25,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);
  padding:8px 6px calc(8px + var(--safe-b));
}
.tab{
  background:none;border:0;cursor:pointer;color:var(--ink-3);
  font-family:var(--sans);font-size:.66rem;font-weight:600;letter-spacing:.06em;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--tile)}

/* ============================================================
   MASHG'ULOT EKRANI
   ============================================================ */
#screen-run{background:var(--bg-deep)}
.run-wrap{flex:1;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) var(--pad) calc(16px + var(--safe-b))}
.run-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.segs{flex:1;display:flex;gap:3px}
.seg{flex:1;height:4px;border-radius:2px;background:var(--line-soft)}
.seg.fill{background:var(--tile)}
.seg.now{background:var(--gold)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}

/* Sanoq maydoni: butun ekran tugma (burun bilan bosish uchun) */
#tapzone{position:absolute;inset:-24px;z-index:2;background:transparent;border:0;cursor:pointer;user-select:none}
#tapzone:focus-visible{outline:2px solid var(--tile);outline-offset:-6px;border-radius:var(--r-l)}

.dial{position:relative;width:min(78vw,320px);aspect-ratio:1;display:grid;place-items:center;margin:6px 0 4px}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .trk{fill:none;stroke:var(--line-soft);stroke-width:5}
.dial .bar{fill:none;stroke:var(--tile);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .25s ease}
.dial.amrap .bar{stroke:var(--clay)}
.dial.pull .bar{stroke:var(--good)}
.dial.pull .breath{background:radial-gradient(circle, rgba(76,195,138,.34) 0%, transparent 70%)}
.seg.pull{background:rgba(76,195,138,.35)}
.seg.pull.fill{background:var(--good)}
.dial .count{
  font-family:var(--disp);font-weight:500;font-variant-numeric:tabular-nums;
  font-size:min(30vw,8.4rem);line-height:.86;letter-spacing:-.02em;
  transition:transform .12s ease;
}
.dial .count.bump{transform:scale(1.08)}
.dial .of{font-family:var(--disp);font-size:1.05rem;color:var(--ink-3);letter-spacing:.05em;margin-top:6px}

.ex-name{font-family:var(--disp);font-size:1.7rem;margin-top:2px}
.ex-focus{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.hint{
  font-size:.85rem;color:var(--ink-2);margin-top:12px;max-width:31ch;
  min-height:2.6em;display:flex;align-items:center;justify-content:center;
}
.run-actions{display:flex;flex-direction:column;gap:9px;margin-top:14px;position:relative;z-index:3}
.run-actions .side{display:flex;gap:9px}
.run-actions .side .btn{flex:1}

/* Nafas ritmi — ekran tempga qarab "nafas oladi" */
.breath{
  position:absolute;inset:-16%;z-index:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle, rgba(43,196,206,.42) 0%, rgba(43,196,206,.14) 45%, transparent 72%);
  transform:scale(var(--breath,1));opacity:var(--breath-o,0);
}
.phase-tag{
  font-family:var(--disp);font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tile);height:1.4em;
}
.phase-tag.down{color:var(--gold)}

/* Kamera o'lchagich */
.cam-meter{width:min(78vw,320px);margin-top:14px}
.cam-bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cam-bar i{position:absolute;inset:0 auto 0 0;width:var(--v,0%);background:var(--tile);border-radius:4px}
.cam-marks{position:relative;height:12px;margin-top:3px}
.cam-marks span{position:absolute;top:0;width:1px;height:7px;background:var(--ink-3)}
.cam-marks span::after{content:attr(data-l);position:absolute;top:7px;left:-9px;font-size:.55rem;color:var(--ink-3)}
#cam-video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px}

/* Dam olish */
.rest-num{font-family:var(--disp);font-size:min(34vw,9rem);line-height:.9;font-variant-numeric:tabular-nums;color:var(--gold)}
.next-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;margin-top:18px;width:min(92vw,420px);text-align:left;
}

/* Fikr-mulohaza */
.fb-grid{display:flex;flex-direction:column;gap:10px;width:min(92vw,420px);margin-top:20px}
.fb{
  text-align:left;padding:15px 17px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--ink);
  font-family:var(--sans);
}
.fb:active{transform:scale(.985)}
.fb b{display:block;font-size:1.02rem;font-weight:700}
.fb span{font-size:.78rem;color:var(--ink-3)}
.fb.easy{border-color:rgba(76,195,138,.45)} .fb.easy b{color:var(--good)}
.fb.norm{border-color:rgba(43,196,206,.45)} .fb.norm b{color:var(--tile)}
.fb.hard{border-color:rgba(224,138,60,.45)} .fb.hard b{color:var(--warn)}

/* Yakun */
.sum-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:.92rem}
.sum-line:last-child{border-bottom:0}
.sum-line b{font-family:var(--disp);font-size:1.1rem;font-weight:500}

/* ---------- Mashqlar qo'llanmasi ---------- */
.ex-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden}
.ex-card + .ex-card{margin-top:12px}
.ex-head{display:flex;gap:14px;padding:14px 16px;align-items:center}
.ex-head .dia{width:74px;height:74px;flex:none;background:var(--bg-deep);border-radius:var(--r-s);border:1px solid var(--line-soft)}
.ex-body{padding:0 16px 15px;font-size:.88rem;color:var(--ink-2);display:flex;flex-direction:column;gap:9px}
.cue{display:flex;gap:9px;align-items:flex-start}
.cue i{width:5px;height:5px;border-radius:50%;background:var(--tile);flex:none;margin-top:8px}
.cue.no i{background:var(--clay)}

/* ---------- Statistika ---------- */
.chart{margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:132px;position:relative;padding-bottom:1px;border-bottom:1px solid var(--line)}
.bars .gl{position:absolute;left:0;right:0;height:1px;background:var(--line-soft)}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bcol i{display:block;background:var(--tile);border-radius:4px 4px 0 0;transition:filter .15s ease}
.bcol.zero i{background:transparent;border-top:1px dashed var(--line);height:0}
.bcol .bval{
  font-family:var(--disp);font-size:.78rem;color:var(--ink-2);
  text-align:center;line-height:1;padding-bottom:4px;font-variant-numeric:tabular-nums;
}
.bcol.last .bval{color:var(--gold)}
.bcol.last i{background:var(--gold)}
.bcol:hover i{filter:brightness(1.25)}
.blabels{display:flex;gap:6px;margin-top:7px}
.blabels span{flex:1;text-align:center;font-size:.62rem;color:var(--ink-3);letter-spacing:.04em}
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-118%);
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font-size:.76rem;white-space:nowrap;transition:opacity .12s ease;
  box-shadow:0 10px 30px -12px #000;
}
#tip.on{opacity:1}
.bal{position:relative;height:10px;border-radius:5px;background:var(--bg-deep);margin-top:12px;overflow:hidden}
.bal-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .3s ease}
.bal-goal{position:absolute;left:83.3%;top:-3px;bottom:-3px;width:2px;background:var(--good);opacity:.85}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:12px;background:var(--bg-deep)}
.split i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.76rem;color:var(--ink-2)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:.87rem}
.hrow:last-child{border-bottom:0}
.hrow .dt{color:var(--ink-2)}
.hrow .rp{font-family:var(--disp);font-size:1.05rem}

/* ---------- Sozlamalar ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{flex:1;min-width:0}
.set-row .lbl b{display:block;font-size:.94rem;font-weight:600}
.set-row .lbl span{font-size:.76rem;color:var(--ink-3)}
.choice{display:flex;gap:5px;background:var(--bg-deep);padding:4px;border-radius:var(--r-s);border:1px solid var(--line-soft)}
.choice button{
  border:0;background:transparent;color:var(--ink-3);font-family:var(--sans);
  font-size:.79rem;font-weight:600;padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;
}
.choice button.on{background:var(--tile);color:#04181B}
.sw{width:50px;height:29px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:var(--ink-3);transition:.18s ease}
.sw.on{background:rgba(43,196,206,.25);border-color:var(--tile)}
.sw.on i{left:23px;background:var(--tile)}
input[type=range]{width:150px;accent-color:var(--tile)}

/* ---------- Toast / Modal ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(14px);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);
  padding:11px 16px;font-size:.86rem;z-index:70;opacity:0;transition:.22s ease;pointer-events:none;
  max-width:88vw;text-align:center;box-shadow:0 14px 40px -16px #000;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(4,8,12,.8);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;max-width:400px;width:100%}

.note{
  background:rgba(227,178,60,.08);border:1px solid rgba(227,178,60,.28);
  border-radius:var(--r-s);padding:12px 14px;font-size:.83rem;color:var(--ink-2);
}
.note b{color:var(--gold)}
.ta{
  width:100%;height:170px;resize:vertical;
  background:var(--bg-deep);color:var(--ink-2);
  border:1px solid var(--line);border-radius:10px;padding:10px;
  font-size:.72rem;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.4;
}
.ta:focus{outline:2px solid var(--tile);outline-offset:1px}

/* Qiyinlik zinapoyasi */
.ladder{margin-top:4px;border-top:1px solid var(--line-soft);padding-top:10px}
.ladder summary{
  cursor:pointer;font-size:.8rem;font-weight:600;color:var(--ink-3);
  letter-spacing:.04em;list-style:none;
}
.ladder summary::-webkit-details-marker{display:none}
.ladder summary::before{content:"▸ ";color:var(--tile)}
.ladder[open] summary::before{content:"▾ "}

const REP_CAP   = 25;  // shu takrordan oshsa — qiyinroq variantga

/* ============================================================
   2. HOLAT (localStorage)
   ============================================================ */
const KEY = "oscar_anjuman_v1";
const SCHEMA = 4;
/* Tortish mashqi rejaning bir qismi emas — u dam olish vaqtiga qo'shiladi,
   shuning uchun o'zining "virtual" yozuvi bor. */
const ROW_ITEM = {ex:"row", sets:3, reps:10};
const baseRungs = ()=> Object.fromEntries(Object.entries(LADDER).map(([k,v])=>[k, v.base]));
const DEF = {
  v:SCHEMA,
  maxTest:null,      // oxirgi test (moslik uchun saqlanadi)
  maxTests:[],       // {reps, d, ts} — butun tarix, ustiga yozilmaydi
  phase:1,
  k:{standard:1, wide:1, diamond:1, incline:1, row:1},
  rung:baseRungs(),  // qiyinlik zinapoyasidagi joriy pog'ona
  sessions:[],
  weights:[],        // {d, kg} — ixtiyoriy tana vazni
  lastDecayFor:null, // tanaffusdan keyingi yengillashtirish qaysi sana uchun qo'llangan
  pullIntroDone:false,
  settings:{ mode:"tap", tempo:3, rest:75, sound:true, voice:true, warmup:true, camSens:.5,
             deload:true, pull:true, pullSets:3 }
};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEF);
    const p = JSON.parse(raw);
    return migrate({ ...structuredClone(DEF), ...p,
      k:{...DEF.k, ...(p.k||{})},
      rung:{...baseRungs(), ...(p.rung||{})},
      settings:{...DEF.settings, ...(p.settings||{})} });
  }catch(e){ return structuredClone(DEF); }
}

/* Eski ma'lumotni yangi sxemaga o'tkazish — hech narsa yo'qolmaydi */
function migrate(s){
  if(!Array.isArray(s.maxTests)) s.maxTests=[];
  if(!Array.isArray(s.weights))  s.weights=[];
  if(!Array.isArray(s.sessions)) s.sessions=[];
  // v1 da faqat oxirgi test saqlangan edi — uni tarixning boshiga qo'yamiz
  if((s.v||1) < 2){
    if(s.maxTest && s.maxTest.reps!=null && !s.maxTests.length)
      s.maxTests.push({reps:s.maxTest.reps, d:s.maxTest.date, ts:null});
  }
  // v3: qiyinlik zinapoyasi. Eski foydalanuvchilar rejadagi variantda turadi.
  if((s.v||1) < 3){
    s.rung = {...baseRungs(), ...(s.rung||{})};
    if(s.lastDecayFor===undefined) s.lastDecayFor=null;
  }
  // v4: tortish mashqlari
  if((s.v||1) < 4){
    if(s.k.row==null) s.k.row=1;
    if(s.rung.row==null) s.rung.row=LADDER.row.base;
    if(s.pullIntroDone===undefined) s.pullIntroDone=false;
  }
  s.v = SCHEMA;
  return s;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){
    // Xotira to'lgan yoki yozishga ruxsat yo'q (masalan yashirin rejim)
    try{ toast("Saqlanmadi! Sozlama → Zaxira nusxa orqali ma'lumotni saqlab qo'ying", 5000); }catch(e2){}
  }
}

function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function mondayOf(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-w); return x; }

function toast(msg, ms){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"), ms||2200);
}

function rungLabel(slot){

function itemFor(slot){
  if(slot==="row") return ROW_ITEM;
  // Faqat JORIY faza. Boshqa fazadan olsak, 1-fazada AMRAP bo'lgan diamond
  // uchun 2-fazaning raqami qaytadi va faza o'tishida yana sakrash paydo bo'ladi.
  return planItems().find(x=>x.ex===slot && x.reps) || null;
}
function setRung(slot, idx, wantReps){
  S.rung[slot]=clamp(idx,0,LADDER[slot].rungs.length-1);
  const it = itemFor(slot);
  const base = it ? it.reps : 12;
  S.k[slot]=clamp(wantReps/(base*scale()), .3, 3);
}
// Eng yuqori pog'onada takror cheksiz o'smasin (zinapoya tugagan holat)
function capAtTopRung(slot, k){
  if(rungIdx(slot) < LADDER[slot].rungs.length-1) return k;
  const it=itemFor(slot);
  if(!it) return k;
  return Math.min(k, 35/(it.reps*scale()));
}
function allItems(){ return [...PLANS[1].items, ...PLANS[2].items]; }

/* --- Fazani silliq almashtirish ---
   Rejadagi bazaviy raqam sakraydi (keng ushlab: 9 -> 18). Koeffitsientni
   teskari nisbatda qayta hisoblab, MAQSADNI uzluksiz qoldiramiz.
   Aks holda 13 takror bir kechada 27 ga chiqib ketardi. */
function switchPhase(to){
  const from=S.phase;
  if(from===to) return;
  const oldT={};
  PLANS[from].items.forEach(it=>{ oldT[it.ex]=targetRawFor(it.ex); });
  // AMRAP mashqlar uchun maqsad yo'q — oxirgi haqiqiy natijadan olamiz
  const lastAmrap={};
  S.sessions.slice(-4).forEach(s=>(s.items||[]).forEach(it=>{
    if(it.target==null && it.sets && it.sets.length)
      lastAmrap[it.ex]=Math.round(it.sets.reduce((a,b)=>a+b,0)/it.sets.length);
  }));

  S.phase=to;
  PLANS[to].items.forEach(it=>{
    if(!it.reps) return;                       // burnout — maqsadsiz
    let want = oldT[it.ex] ?? lastAmrap[it.ex] ?? null;
    if(want==null){
      // Bu mashq avval umuman bo'lmagan (masalan "oyoq balandda").
      // Oddiy anjuman maqsadidan kelib chiqib taxminlaymiz: ~1.3 barobar og'irroq.
      const ref=oldT.standard ?? oldT.wide ?? null;
      want = ref ? Math.max(5, Math.round(ref/1.3)) : Math.round(it.reps*scale());
    }
    S.k[it.ex]=clamp(want/(it.reps*scale()), .3, 3);
  });
  save();
}

/* --- Maqsadli takrorlar: kalibrovka + avto-moslashuv --- */
function scale(){
  const m = S.maxTest ? S.maxTest.reps : BASE_MAX;
  return clamp(m/BASE_MAX, .3, 3);
}
function targetFor(item){
  if(item.amrap || item.burnout) return null;
  const k = S.k[item.ex] || 1;
  const t = Math.round(item.reps * scale() * k * (isDeload() ? 0.6 : 1));
  return Math.max(3, t);
}

/* --- Yengil hafta (deload): har 4-haftada tiklanish --- */
function programWeek(){
  if(!S.sessions.length) return 1;
  const first=S.sessions.reduce((a,s)=> s.d<a ? s.d : a, S.sessions[0].d);
  const days=Math.floor((new Date(todayKey()+"T00:00:00") - new Date(first+"T00:00:00"))/86400000);
  return Math.floor(days/7)+1;
}
function isDeload(){
  if(!S.settings.deload) return false;
  if(S.sessions.length < 8) return false;      // birinchi 2 haftada kerak emas
  return programWeek() % 4 === 0;
}

/* --- Tanaffusdan keyin yumshoq qaytish --- */
function layoffCheck(){
  if(!S.sessions.length) return null;
  const last=S.sessions.reduce((a,s)=> s.d>a ? s.d : a, S.sessions[0].d);
  const days=Math.floor((new Date(todayKey()+"T00:00:00") - new Date(last+"T00:00:00"))/86400000);
  if(days < 11) return null;
  if(S.lastDecayFor===last) return {days, applied:false};   // allaqachon qo'llangan
  const weeks=Math.floor(days/7);
  const f=clamp(1 - 0.06*weeks, .7, 1);
  Object.keys(S.k).forEach(x=> S.k[x]=clamp(S.k[x]*f, .3, 3));
  S.lastDecayFor=last; save();
  return {days, applied:true, pct:Math.round((1-f)*100)};
}
function planItems(){ return PLANS[S.phase].items; }
function sessionVolume(){
  return planItems().reduce((a,it)=>{
    const t = targetFor(it);
    return a + (t ? t*it.sets : 0);
  },0);
}

/* --- Yig'ilgan ma'lumotdan chiqadigan xulosalar --- */
function currentWeight(){
  const w=S.weights;
  return (w && w.length) ? w[w.length-1].kg : null;
}
// Oxirgi n mashg'ulotdagi javoblar: {easy, norm, hard, jami}
function rpeTally(n){
  const out={easy:0, norm:0, hard:0, total:0};
  S.sessions.slice(-(n||8)).forEach(s=>{
    Object.values(s.rpe||{}).forEach(v=>{ if(out[v]!=null){ out[v]++; out.total++; } });
  });
  return out;
}
// Ketma-ket nechta mashg'ulotda javoblarning yarmidan ko'pi "qiyin" bo'ldi
function hardStreak(){
  let n=0;
  for(let i=S.sessions.length-1;i>=0;i--){
    const v=Object.values(S.sessions[i].rpe||{});
    if(!v.length) break;
    if(v.filter(x=>x==="hard").length > v.length/2) n++; else break;
  }
  return n;
}
// Kun qaysi qismida mashq qilinganini guruhlash
function timeOfDayStats(){
  const slot=h => h<11 ? "Ertalab" : h<17 ? "Kunduzi" : "Kechqurun";
  const g={};
  S.sessions.forEach(s=>{
    if(!s.ts) return;
    const key=slot(new Date(s.ts).getHours());
    (g[key]=g[key]||{n:0,total:0}).n++;
    g[key].total+=s.total;
  });
  return Object.entries(g).map(([k,v])=>({slot:k, n:v.n, avg:Math.round(v.total/v.n)}))
    .sort((a,b)=>b.avg-a.avg);
}

let AC=null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function beep(freq, dur, vol, type){
  if(!S.settings.sound) return;
  const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||.18, ac.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+(dur||.09));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+(dur||.09)+.02);
}
const SFX={
  tick:()=>beep(520,.05,.10),
  down:()=>beep(392,.12,.13),
  up:()=>beep(587,.10,.13),
  rep:()=>beep(880,.07,.16),
  last:()=>beep(1046,.12,.2),
  setEnd:()=>{ beep(660,.12,.18); setTimeout(()=>beep(880,.18,.18),120); },
  restEnd:()=>{ beep(700,.1,.2); setTimeout(()=>beep(900,.1,.2),160); setTimeout(()=>beep(1200,.26,.22),320); },
  done:()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,.2,"triangle"), i*130)); },
  pr:()=>{ [784,988,1318].forEach((f,i)=>setTimeout(()=>beep(f,.3,.22,"triangle"), i*150)); }
};

let VOICES=[], VOICE=null;
function pickVoice(){
  VOICES = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const by = p => VOICES.find(v => (v.lang||"").toLowerCase().startsWith(p));
  // O'zbekcha bo'lmasa turkcha ovoz lotin o'zbekchani eng yaxshi o'qiydi
  VOICE = by("uz") || by("tr") || by("az") || by("ru") || VOICES[0] || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!S.settings.voice || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(VOICE){ u.voice=VOICE; u.lang=VOICE.lang; }
    u.rate=1.02; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}

/* ============================================================
   9. STATISTIKA
   ============================================================ */
function renderStats(){
  const box=$("#stats-body");
  const total=S.sessions.reduce((a,x)=>a+x.total,0);
  $("#stats-total").textContent = total+" takror";

  if(!S.sessions.length){
    box.innerHTML='<div class="card" style="text-align:center;padding:34px 18px">'+
      '<h3>Hali ma\'lumot yo\'q</h3><p class="muted" style="margin-top:8px;font-size:.9rem">'+
      'Birinchi mashg\'ulotdan keyin bu yerda haftalik hajm, rekordlar va mushak taqsimoti paydo bo\'ladi.</p></div>';
    return;
  }

  // --- Haftalik hajm (8 hafta) ---
  const weeks=[];
  const mon=mondayOf(new Date());
  for(let i=7;i>=0;i--){
    const st=new Date(mon); st.setDate(mon.getDate()-i*7);
    const en=new Date(st); en.setDate(st.getDate()+7);
    const tot=S.sessions.filter(s=>{const d=new Date(s.d+"T00:00:00");return d>=st&&d<en;}).reduce((a,s)=>a+s.total,0);
    weeks.push({label:(st.getDate())+"/"+(st.getMonth()+1), v:tot, last:i===0});
  }
  const mx=Math.max(1,...weeks.map(w=>w.v));
  const bars = weeks.map(w=>
    '<div class="bcol'+(w.last?" last":"")+(w.v?"":" zero")+'" data-v="'+w.v+'" data-l="'+w.label+'">'+
    (w.v ? '<i style="height:'+Math.max(3,w.v/mx*100)+'%"></i>' : '<i style="height:0"></i>')+'</div>').join("");
  const labels = weeks.map(w=>'<span>'+w.label+'</span>').join("");

  // --- Mushak taqsimoti ---
  // Tartib ataylab shunday: avval itarish mushaklari, keyin tortish.
  const MU=[["chest","Ko'krak","var(--tile)"],["sh","Yelka","var(--clay)"],
            ["tri","Tricep","var(--gold)"],["back","Orqa","var(--good)"],["bi","Bicep","#8F7BE8"]];
  const mus={};
  S.sessions.forEach(s=> s.items.forEach(it=>{
    const m=EX[it.ex]; if(!m) return;
    const reps=it.sets.reduce((a,b)=>a+b,0);
    Object.entries(m.muscles).forEach(([g,w])=> mus[g]=(mus[g]||0)+reps*w);
  }));
  const msum=Math.max(1, Object.values(mus).reduce((a,b)=>a+b,0));
  const shown=MU.filter(([g])=>mus[g]>0);
  const split=shown.map(([g,,c])=>'<i style="flex:'+(mus[g]/msum)+';background:'+c+'"></i>').join("");
  const legend=shown.map(([g,n,c])=>'<span><b style="background:'+c+'"></b>'+n+' '+Math.round(mus[g]/msum*100)+'%</span>').join("");

  // --- Rekordlar ---
  const bestBurn=S.sessions.reduce((a,x)=>Math.max(a,x.burnout||0),0);
  const bestSet=S.sessions.reduce((a,x)=>Math.max(a, ...x.items.flatMap(i=>i.sets)),0);
  const streak=weekStreak();

  // --- Tarix ---
  const hist=S.sessions.slice().sort((a,b)=>(a.d<b.d?-1:a.d>b.d?1:0)).slice(-12).reverse().map(s=>{
    const d=new Date(s.d+"T00:00:00");
    return '<div class="hrow"><span class="dt">'+d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0")+
      ' · '+PLANS[s.phase].title+'</span>'+
      '<span class="rp">'+s.total+(s.burnout?' <span class="dim" style="font-size:.7rem">burnout '+s.burnout+'</span>':'')+'</span></div>';
  }).join("");

  box.innerHTML =
    '<div class="grid-3">'+
      tileHTML(bestSet,"Eng katta set","gold")+
      tileHTML(bestBurn||"—","Burnout rekord","clay")+
      tileHTML(streak,"Hafta seriyasi","tile-t")+
    '</div>'+
    maxTestCard()+
    balanceCard()+
    rpeCard()+
    '<div class="card"><span class="eyebrow">Haftalik hajm — jami takrorlar</span>'+
      '<div class="chart"><div class="bars" id="bars">'+
        '<div class="gl" style="bottom:33%"></div><div class="gl" style="bottom:66%"></div><div class="gl" style="bottom:99%"></div>'+
        bars+'</div><div class="blabels">'+labels+'</div></div>'+
      '<div class="dim" style="font-size:.74rem;margin-top:8px">Eng baland ustun: '+mx+' takror · oltin ustun — joriy hafta</div>'+
    '</div>'+
    '<div class="card"><span class="eyebrow">Mushak guruhlari bo\'yicha hajm</span>'+
      '<div class="split">'+split+'</div><div class="legend">'+legend+'</div></div>'+
    '<div class="card"><span class="eyebrow">Tarix</span><div class="hist" style="margin-top:8px">'+hist+'</div></div>';

  // hover/tap tooltip
  const tip=$("#tip");
  $$("#bars .bcol").forEach(c=>{
    const showTip=e=>{
      const r=c.getBoundingClientRect();
      tip.textContent=c.dataset.l+" — "+c.dataset.v+" takror";
      tip.style.left=(r.left+r.width/2)+"px"; tip.style.top=r.top+"px";
      tip.classList.add("on");
    };
    c.addEventListener("mouseenter",showTip);
    c.addEventListener("click",e=>{ showTip(e); setTimeout(()=>tip.classList.remove("on"),1600); });
    c.addEventListener("mouseleave",()=>tip.classList.remove("on"));
  });

  const rt=$("#btn-retest");
  if(rt) rt.addEventListener("click",()=>startSession("calib"));
}

/* --- Maksimal test tarixi: mustaqil o'sish o'lchovi ---
   Haftalik hajm dastur maqsadlarni oshirgani uchun o'sadi — bu aylanma o'lchov.
   Bir xil sharoitdagi takrorlanuvchi test esa haqiqiy dalil. */
function maxTestCard(){
  const t=S.maxTests||[];
  const last=t.length? t[t.length-1] : null;
  const daysSince = last && last.d
    ? Math.floor((new Date(todayKey()+"T00:00:00") - new Date(last.d+"T00:00:00"))/86400000)
    : null;
  const due = daysSince!=null && daysSince>=28;

  if(t.length<2){
    return '<div class="card"><span class="eyebrow">Haqiqiy o\'sish — maksimal test</span>'+
      '<p class="muted" style="font-size:.87rem;margin-top:8px">'+
      (last
        ? 'Birinchi test: <b>'+last.reps+' takror</b> ('+daysSince+' kun oldin). '+
          'O\'sish chizig\'i ikkinchi testdan keyin paydo bo\'ladi — 4 haftada bir marta takrorlang.'
        : 'Hali test topshirilmagan.')+'</p>'+
      (due||!last ? '<button class="btn gold block" style="margin-top:12px" id="btn-retest">Testni topshirish</button>' : '')+
      '</div>';
  }

  const mx=Math.max(...t.map(x=>x.reps),1);
  const first=t[0].reps, growth=last.reps-first;
  const pct=first>0 ? Math.round(growth/first*100) : null;
  const cols=t.slice(-8).map((x,i,arr)=>{
    const isLast=i===arr.length-1;
    const dd=x.d? x.d.slice(8)+"/"+x.d.slice(5,7) : "—";
    return '<div class="bcol'+(isLast?" last":"")+'" data-v="'+x.reps+'" data-l="'+dd+'">'+
      '<span class="bval">'+x.reps+'</span>'+
      '<i style="height:'+Math.max(6,x.reps/mx*100)+'%"></i></div>';
  }).join("");
  const labs=t.slice(-8).map(x=>'<span>'+(x.d? x.d.slice(8)+"/"+x.d.slice(5,7) : "—")+'</span>').join("");

  return '<div class="card"><span class="eyebrow">Haqiqiy o\'sish — maksimal test</span>'+
    '<div class="row between" style="margin-top:8px;align-items:flex-end">'+
      '<div><span class="num" style="font-size:2.1rem;color:var(--gold)">'+last.reps+'</span>'+
      '<span class="dim" style="font-size:.8rem"> takror</span></div>'+
      '<span class="pill '+(growth>0?"tile":growth<0?"clay":"")+'">'+
        (growth>0?"+":"")+growth+' takror'+(pct!=null?" · "+(pct>0?"+":"")+pct+"%":"")+'</span></div>'+
    '<div class="chart"><div class="bars" style="height:104px">'+cols+'</div>'+
    '<div class="blabels">'+labs+'</div></div>'+
    '<div class="dim" style="font-size:.74rem;margin-top:8px">'+
      'Birinchi test '+first+' → hozir '+last.reps+'. Oxirgi test '+daysSince+' kun oldin.</div>'+
    (due? '<button class="btn gold block" style="margin-top:12px" id="btn-retest">Yangi test vaqti keldi</button>':'')+
    '</div>';
}

/* --- Itarish / tortish muvozanati ---
   Bu kartochka tortish mashqlari qo'shilishining sababini ko'rsatadi:
   faqat itarish qilinsa yelka oldinga tortiladi. Sog'lom nisbat ~1:1. */
function balanceCard(){
  const last=S.sessions.slice(-12);
  if(!last.length) return "";
  let push=0, pull=0;
  last.forEach(s=>(s.items||[]).forEach(it=>{
    const r=it.sets.reduce((a,b)=>a+b,0);
    if(it.ex==="row") pull+=r; else push+=r;
  }));
  if(push+pull===0) return "";
  const ratio = push>0 ? pull/push : 0;
  const pct=Math.round(ratio*100);
  // Ko'rsatkich: 100% = to'liq muvozanat. Shkala 0-120% oralig'ida ko'rsatiladi.
  const pos=clamp(pct/120*100, 0, 100);
  const state = ratio>=0.8 ? {t:"Muvozanatda", c:"var(--good)", cls:"tile"}
              : ratio>=0.4 ? {t:"Yetarli emas", c:"var(--gold)", cls:"gold"}
              : {t:"Muvozanatsiz", c:"var(--clay)", cls:"clay"};
  const note = ratio>=0.8
    ? "Orqa va old mushaklar teng ishlayapti — qomat uchun aynan shu kerak."
    : ratio>=0.4
    ? "Tortish hajmini biroz oshirsangiz yaxshi bo'lardi. Sozlamadan set sonini ko'paytirish mumkin."
    : pull===0
    ? "Tortish mashqlari umuman bajarilmayapti. Uzoq muddatda bu yelkani oldinga tortadi — bukchaygan qomat va yelka og'rig'i."
    : "Tortish hajmi juda kam. Har mashg'ulotda 3 setni o'tkazib yubormaslikka harakat qiling.";

  return '<div class="card"><span class="eyebrow">Itarish / tortish muvozanati</span>'+
    '<div class="row between" style="margin-top:10px;align-items:baseline">'+
      '<div><span class="num" style="font-size:1.9rem;color:'+state.c+'">'+pct+'%</span>'+
      '<span class="dim" style="font-size:.8rem"> tortish / itarish</span></div>'+
      '<span class="pill '+state.cls+'">'+state.t+'</span></div>'+
    '<div class="bal"><div class="bal-fill" style="width:'+pos+'%;background:'+state.c+'"></div>'+
      '<div class="bal-goal" title="Maqsad: 100%"></div></div>'+
    '<div class="row between dim" style="font-size:.68rem;margin-top:4px">'+
      '<span>0%</span><span style="color:var(--good)">maqsad 100%</span><span>120%</span></div>'+
    '<div class="dim" style="font-size:.78rem;margin-top:10px">'+note+'</div>'+
    '<div class="dim" style="font-size:.72rem;margin-top:6px">'+
      'Oxirgi '+last.length+' mashg\'ulot: itarish '+push+' takror · tortish '+pull+' takror</div>'+
    '</div>';
}

/* --- RPE: mashg'ulotlar qanchalik og'ir kechayotgani --- */
function rpeCard(){
  const r=rpeTally(8);
  if(!r.total) return "";
  const hs=hardStreak();
  const seg=(v,c)=> v? '<i style="flex:'+v+';background:'+c+'"></i>' : '';
  const pc=v=>Math.round(v/r.total*100);
  const tod=timeOfDayStats();

  const warn = t => '<div class="note" style="margin-top:12px;border-color:rgba(210,96,58,.4);'+
    'background:rgba(210,96,58,.08)">'+t+'</div>';
  let note="";
  if(hs>=3) note=warn('<b style="color:var(--clay)">'+hs+' ta mashg\'ulot ketma-ket og\'ir keldi.</b> '+
    'Bu charchoq to\'planayotganining belgisi — bir hafta yengilroq bajaring yoki bir kun ko\'proq dam oling.');
  else if(pc(r.hard)>=60) note=warn('<b style="color:var(--clay)">Javoblarning '+pc(r.hard)+
    '% i "qiyin".</b> Yuklama sizdan oldinda ketayapti — dam olishni uzaytiring yoki '+
    'bir necha mashg\'ulot yengilroq bajaring.');
  else if(pc(r.easy)>=50) note='<div class="note" style="margin-top:12px">'+
    'Mashg\'ulotlarning yarmidan ko\'pi <b>oson</b> kelayapti — raqamlarni tezroq oshirsa bo\'ladi.</div>';

  return '<div class="card"><span class="eyebrow">Qanday kechdi — oxirgi '+
    Math.min(8,S.sessions.length)+' mashg\'ulot</span>'+
    '<div class="split" style="margin-top:12px">'+
      seg(r.easy,"var(--good)")+seg(r.norm,"var(--tile)")+seg(r.hard,"var(--warn)")+'</div>'+
    '<div class="legend">'+
      '<span><b style="background:var(--good)"></b>Oson '+pc(r.easy)+'%</span>'+
      '<span><b style="background:var(--tile)"></b>Normal '+pc(r.norm)+'%</span>'+
      '<span><b style="background:var(--warn)"></b>Qiyin '+pc(r.hard)+'%</span></div>'+
    note+
    (tod.length>1 ? '<div class="dim" style="font-size:.74rem;margin-top:10px">'+
      'Kun qismi bo\'yicha o\'rtacha hajm: '+
      tod.map(x=>x.slot+" "+x.avg+" ("+x.n+" marta)").join(" · ")+
      '</div>' : '')+
    '</div>';
}
function weekStreak(){
  if(!S.sessions.length) return 0;
  const need=PLANS[S.phase].days-1;
  let n=0, mon=mondayOf(new Date());
  for(let i=0;i<52;i++){
    const st=new Date(mon); st.setDate(mon.getDate()-i*7);
    const en=new Date(st); en.setDate(st.getDate()+7);
    const c=new Set(S.sessions.filter(s=>{const d=new Date(s.d+"T00:00:00");return d>=st&&d<en;}).map(s=>s.d)).size;
    if(c>=Math.max(1,need)) n++;
    else if(i>0) break;
  }
  return n;
}

const isStandalone = ()=>
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
  navigator.standalone === true;
const isIOS = ()=> /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

async function requestPersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  }catch(e){}
  return false;
}
async function renderStorageState(){
  const el=$("#storage-state"), pill=$("#storage-pill");
  if(!el) return;
  let persisted=false, known=false;
  try{
    if(navigator.storage && navigator.storage.persisted){
      persisted = await navigator.storage.persisted(); known=true;
      if(!persisted) persisted = await requestPersist();
    }
  }catch(e){}
  if(!$("#storage-state")) return;                 // ekran almashgan bo'lsa
  if(persisted){
    el.textContent="Himoyalangan — brauzer o'chirib yubormaydi";
    pill.textContent="Himoyada"; pill.className="pill tile";
  } else if(isIOS() && !isStandalone()){
    el.innerHTML="Safari 7 kun ishlatilmasa o'chirishi mumkin. <b>Bosh ekranga qo'shing.</b>";
    pill.textContent="Xavf"; pill.className="pill clay";
  } else {
    el.textContent = known
      ? "Oddiy saqlash — brauzer tozalansa yo'qoladi"
      : "Oddiy saqlash (bu brauzer holatni bildirmaydi)";
    pill.textContent="Oddiy"; pill.className="pill gold";
  }
}

/* ============================================================
   11. MASHG'ULOT DVIGATELI
   ============================================================ */
let run=null;

function buildSteps(kind){
  const steps=[];
  if(kind==="calib"){
    steps.push({t:"prep", ex:"standard", title:"Maksimal test", sub:"Charchaguncha — to'xtay olmagunicha", amrap:true});
    steps.push({t:"set", ex:"standard", setNo:1, setTotal:1, target:null, amrap:true, calib:true});
    steps.push({t:"done"});
    return steps;
  }
  const P=PLANS[S.phase];
  if(S.settings.warmup) steps.push({t:"warmup", sec:40});
  P.items.forEach((it,ii)=>{
    const tgt=targetFor(it);
    steps.push({t:"prep", ex:it.ex, itemIdx:ii, title:exName(it.ex),
      sub:(tgt? it.sets+" set × "+tgt+" takror" : it.sets+" set × maksimal"), amrap:!tgt});
    for(let s=1;s<=it.sets;s++){
      steps.push({t:"set", ex:it.ex, itemIdx:ii, setNo:s, setTotal:it.sets,
        target:tgt, amrap:!tgt, burnout:!!it.burnout});
      const lastSet = s===it.sets;
      const lastItem = ii===P.items.length-1;
      if(lastSet) steps.push({t:"feedback", ex:it.ex, itemIdx:ii});
      if(!(lastSet && lastItem)) steps.push({t:"rest", sec: it.burnout?0:(S.settings.rest + (it.ex==="diamond"?15:0))});
    }
  });
  steps.push({t:"done"});
  return insertPullSets(steps);
}

/* ------------------------------------------------------------
   TORTISH SETLARINI DAM OLISH VAQTIGA JOYLASH

   Alohida bo'lim qilinmadi — mashg'ulot ichida, dam olish
   paytida bajariladi. Ko'krak dam olayotganda orqa ishlaydi,
   shuning uchun na dam qisqaradi, na mashg'ulot cho'ziladi.
   Dam 75s bo'lsa: 25s dam -> tortish seti -> 40s dam.
   ------------------------------------------------------------ */
function insertPullSets(steps){
  if(!S.settings.pull) return steps;
  const n=clamp(S.settings.pullSets||3, 1, 5);
  const tgt=targetFor(ROW_ITEM);

  // Ichki dam oraliqlari (birinchisidan tashqari — avval isib olamiz)
  const rests=[];
  steps.forEach((s,i)=>{ if(s.t==="rest" && s.sec>0) rests.push(i); });
  if(rests.length<2) return steps;
  const pool=rests.slice(1);
  if(!pool.length) return steps;

  // Teng oraliqda tanlaymiz
  const pick=[];
  for(let j=0;j<n;j++){
    const idx=pool[Math.round(j*(pool.length-1)/Math.max(1,n-1))];
    if(!pick.includes(idx)) pick.push(idx);
  }

  const out=[];
  let setNo=0;
  steps.forEach((s,i)=>{
    if(s.t==="rest" && pick.includes(i)){
      setNo++;
      const pre=25, post=Math.max(30, s.sec-30);
      out.push({t:"rest", sec:pre, forPull:true});
      out.push({t:"set", ex:"row", pull:true, setNo, setTotal:pick.length,
                target:tgt, amrap:false});
      if(setNo===pick.length) out.push({t:"feedback", ex:"row", pull:true});
      out.push({t:"rest", sec:post});
    } else out.push(s);
  });
  return out;
}

function startSession(kind){
  audio();
  run={
    kind, steps:buildSteps(kind), i:-1, t0:Date.now(),
    results:{}, count:0, burnout:null, newPR:false,
    // 1-etap: mashg'ulot davomida yig'iladigan ma'lumot
    rpe:{},                          // har mashq uchun oson/normal/qiyin
    kBefore:structuredClone(S.k),    // boshlanishidagi koeffitsientlar
    mode:S.settings.mode,            // qaysi sanash usuli ishlatildi
    restSet:S.settings.rest,         // sozlamadagi dam vaqti
    restReal:[],                     // haqiqatda qancha dam olindi
    warmup:!!S.settings.warmup,
    _restStart:null
  };
  keepAwake(true);
  show("run");
  startClock();
  next();
}

function renderSegs(){
  const setIdxs=run.steps.map((s,j)=>s.t==="set"?j:-1).filter(j=>j>=0);
  const cur=run.steps[run.i];
  const html=setIdxs.map(j=>{
    let cls="seg";
    if(run.steps[j].pull) cls+=" pull";
    if(j<run.i) cls+=" fill";
    else if(j===run.i && cur && cur.t==="set") cls+=" now";
    return '<div class="'+cls+'"></div>';
  }).join("");
  $("#segs").innerHTML=html || '<div class="seg"></div>';
}

let clockT=null;
function startClock(){
  clearInterval(clockT);
  clockT=setInterval(()=>{
    if(!run) return clearInterval(clockT);
    $("#run-clock").textContent=mmss((Date.now()-run.t0)/1000);
  },1000);
}

function next(){ run.i++; render(); }

function render(){
  stopEngines();
  renderSegs();
  const st=run.steps[run.i];
  if(!st) return finish();
  // "Bugun imkonim yo'q" bosilgan bo'lsa qolgan tortish qadamlari o'tkaziladi
  if(run.skipPull && (st.pull || st.forPull)) return next();
  if(st.t==="set" && st.pull && !S.pullIntroDone) return renderPullIntro(st);
  if(st.t==="warmup")  return renderWarmup(st);
  if(st.t==="prep")    return renderPrep(st);
  if(st.t==="set")     return renderSet(st);
  if(st.t==="rest")    return st.sec>0 ? renderRest(st) : next();
  if(st.t==="feedback")return renderFeedback(st);
  if(st.t==="done")    return finish();
}

    e2.stopPropagation();
    run.skipPull=true;
    toast("Tortish setlari bugun o'tkazib yuborildi", 2600);
    next();
  });
  $("#tapzone").addEventListener("click", ()=>{ if(S.settings.mode==="tap"||st.pull) addRep(st); });
  $("#set-plus").addEventListener("click", e2=>{ e2.stopPropagation(); addRep(st); });
  $("#set-minus").addEventListener("click", e2=>{ e2.stopPropagation(); run.count=Math.max(0,run.count-1); paintCount(st); });
  $("#set-end").addEventListener("click", e2=>{ e2.stopPropagation(); endSet(st); });

  paintCount(st);
  // Tortishda telefon ko'krak ostida turmaydi va tempo boshqacha — faqat teginib sanaladi
  if(!st.pull && S.settings.mode==="metro") startMetronome(st);
  if(!st.pull && S.settings.mode==="camera") startCamera(st);
}

function camMeterHTML(){
  return '<div class="cam-meter"><div class="cam-bar"><i id="cam-fill"></i></div>'+
    '<div class="cam-marks"><span id="mk-d" data-l="past" style="left:35%"></span>'+
    '<span id="mk-u" data-l="tepa" style="left:65%"></span></div>'+
    '<p class="hint" id="cam-hint" style="min-height:1.6em;margin-top:6px">Kamera sozlanmoqda...</p></div>';
}

function addRep(st){
  if(run.ending) return;
  run.count++;
  paintCount(st);
  if(st.target && run.count>=st.target){
    run.ending=true; SFX.last(); setTimeout(()=>endSet(st),650);
  } else {
    SFX.rep();
    if(S.settings.voice && run.count%5===0) speak(String(run.count));
  }
}
function paintCount(st){
  const c=$("#cnt"); if(!c) return;
  c.textContent=run.count;
  c.classList.add("bump"); setTimeout(()=>c.classList.remove("bump"),130);
  const ring=$("#ring");
  if(ring){
    const p = st.target ? clamp(run.count/st.target,0,1) : clamp(run.count/25,0,1);
    ring.setAttribute("stroke-dashoffset", (282.7*(1-p)).toFixed(1));
  }
}

function endSet(st){
  stopEngines();
  const reps=run.count;
  if(st.calib){
    const r=Math.max(0,reps);
    S.maxTest={reps:r, date:todayKey()};
    S.maxTests.push({reps:r, d:todayKey(), ts:Date.now()});   // tarix — ustiga yozilmaydi
    S.k=structuredClone(DEF.k);
    startingRungs(r);                                          // darajaga mos variantdan boshlaymiz
    save();
    return renderCalibResult(reps);
  }
  if(!run.results[st.ex]) run.results[st.ex]={ex:st.ex, sets:[], target:st.target};
  run.results[st.ex].sets.push(reps);
  if(st.burnout){
    run.burnout=reps;
    const best=S.sessions.reduce((a,x)=>Math.max(a,x.burnout||0),0);
    if(reps>best && reps>0){ run.newPR=true; SFX.pr(); }
  } else SFX.setEnd();
  next();
}

/* --- Dam olish --- */
function renderRest(st){
  let left=st.sec;
  const nx=nextSetInfo();
  $("#stage").innerHTML=
    '<span class="eyebrow">Dam oling</span>'+
    '<div class="rest-num num" id="rest">'+mmss(left)+'</div>'+
    (nx?'<div class="next-card"><span class="eyebrow">Keyingisi</span>'+
        '<div class="row between" style="margin-top:6px"><b style="font-size:1.02rem">'+nx.name+'</b>'+
        '<span class="pill tile">'+nx.info+'</span></div></div>':'')+
    '<div class="run-actions" style="width:min(92vw,420px)">'+
      '<div class="side"><button class="btn" id="rest-add">+20 soniya</button>'+
      '<button class="btn primary" id="rest-skip">Tayyorman</button></div></div>';
  speak("Dam. "+st.sec+" soniya.");
  run._restStart=Date.now();
  const logRest=()=>{
    if(run._restStart){
      run.restReal.push(Math.round((Date.now()-run._restStart)/1000));
      run._restStart=null;
    }
  };
  const tick=()=>{
    left--;
    const el=$("#rest"); if(el) el.textContent=mmss(left);
    if(left===10) speak("O'n soniya");
    if(left<=3&&left>0) SFX.tick();
    if(left<=0){ clearInterval(run.timer); logRest(); SFX.restEnd(); next(); }
  };
  run.timer=setInterval(tick,1000);
  $("#rest-add").addEventListener("click",()=>{ left+=20; $("#rest").textContent=mmss(left); });
  $("#rest-skip").addEventListener("click",()=>{ clearInterval(run.timer); logRest(); next(); });
}
function nextSetInfo(){
  for(let j=run.i+1;j<run.steps.length;j++){
    const s=run.steps[j];
    if(s.t==="set") return {name:exName(s.ex), info: s.amrap?"maksimal":(s.setNo+"/"+s.setTotal+" · "+s.target+" ta")};
    if(s.t==="prep") return {name:exName(s.ex), info:s.sub};
  }
  return null;
}

/* --- Fikr-mulohaza: keyingi safargi raqamlar shu yerda tug'iladi --- */
function renderFeedback(st){
  const e=EX[st.ex], r=run.results[st.ex];
  const got=r?r.sets.reduce((a,b)=>a+b,0):0;
  const want=r&&r.target?r.target*r.sets.length:got;
  $("#stage").innerHTML=
    '<span class="eyebrow">'+exName(st.ex)+' tugadi</span>'+
    '<div class="rest-num num" style="color:var(--tile);font-size:min(24vw,6rem)">'+got+'</div>'+
    '<p class="hint">'+(r&&r.target? "Maqsad "+want+" ta edi. Qanday o\'tdi?" : "Qanday o\'tdi?")+'</p>'+
    '<div class="fb-grid">'+
      '<button class="fb easy" data-f="easy"><b>Oson edi</b><span>Yana 3-4 ta qila olardim → keyingi safar ko\'proq</span></button>'+
      '<button class="fb norm" data-f="norm"><b>Normal</b><span>Qiyin, lekin uddaladim → asta oshadi</span></button>'+
      '<button class="fb hard" data-f="hard"><b>Juda qiyin</b><span>Zo\'rg\'a tugatdim → keyingi safar yengillashadi</span></button>'+
    '</div>';
  $$(".fb").forEach(b=>b.addEventListener("click",()=>{
    applyFeedback(st.ex, b.dataset.f, got, want);
    SFX.tick(); next();
  }));
}
/* Mashg'ulot oxirida: kimdir zinapoyada yuqoriga yoki pastga o'tadimi? */
function targetRawFor(slot){
  const it=itemFor(slot);
  if(!it || !it.reps) return null;
  return Math.max(3, Math.round(it.reps*scale()*(S.k[slot]||1)));
}
/* Kalibrovka natijasiga qarab boshlang'ich pog'ona.
   Avval 3 marta anjuman qila oladigan odam ham to'liq anjumanga majbur edi —
   endi u stolga suyanib boshlaydi va to'g'ri texnika bilan o'sadi. */
function startingRungs(max){
  const shift = max<5 ? -2 : max<10 ? -1 : 0;
  if(!shift){ S.rung=baseRungs(); return; }
  Object.keys(LADDER).forEach(slot=>{
    S.rung[slot]=clamp(LADDER[slot].base+shift, 0, LADDER[slot].rungs.length-1);
  });
}

function checkLadder(){
  if(isDeload()) return [];            // yengil haftada pog'ona o'zgarmaydi
  const moves=[];
  Object.values(run.results).forEach(r=>{
    const slot=r.ex, L=LADDER[slot]; if(!L) return;
    const idx=rungIdx(slot), f=run.rpe[slot];
    const got=r.sets.reduce((a,b)=>a+b,0);
    const best=Math.max(0,...r.sets);
    const want=r.target ? r.target*r.sets.length : got;
    const reached = r.target ? (targetRawFor(slot)>=REP_CAP) : (best>=REP_CAP);

    if(reached && (f==="easy"||f==="norm") && idx < L.rungs.length-1){
      const from=exName(slot);
      setRung(slot, idx+1, REP_AFTER);
      moves.push({slot, dir:"up", from, to:exName(slot)});
    } else if(f==="hard" && want>0 && got < want*0.7 && idx > 0){
      const from=exName(slot);
      setRung(slot, idx-1, REP_BACK);
      moves.push({slot, dir:"down", from, to:exName(slot)});
    }
  });
  if(moves.length) save();
  return moves;
}

function applyFeedback(ex, f, got, want){
  run.rpe[ex]=f;                       // javobni saqlaymiz — avval tashlab yuborilardi
  if(isDeload()) return;               // yengil haftada koeffitsient o'zgarmaydi
  let k=S.k[ex]||1;
  if(f==="easy") k*=1.06;
  else if(f==="norm") k*=1.025;
  else k*=0.98;
  if(want>0 && got < want*0.85) k*=0.92;   // maqsadning 85% dan kam bajarildi
  S.k[ex]=clamp(capAtTopRung(ex,k),.5,3);
  save();
}

/* --- Kalibrovka natijasi --- */
function renderCalibResult(reps){
  const lvl = reps<8?"Boshlang'ich":reps<20?"O'rta":reps<35?"Kuchli":"Ilg'or";
  const rows=PLANS[1].items.map(it=>{
    const t=targetFor(it);
    return '<div class="sum-line"><span>'+exName(it.ex)+'</span><b>'+(t? it.sets+"×"+t : it.sets+"× maks")+'</b></div>';
  }).join("");
  $("#stage").innerHTML=
    '<span class="eyebrow">Natija</span>'+
    '<div class="rest-num num" style="color:var(--gold)">'+reps+'</div>'+
    '<h2 class="ex-name">'+lvl+' daraja</h2>'+
    '<div class="next-card"><span class="eyebrow">Reja siz uchun shunday bo\'ldi</span>'+
      '<div style="margin-top:8px">'+rows+'</div></div>'+
    '<p class="hint">Har mashg\'ulotdan keyin "oson/qiyin" javobingizga qarab bu raqamlar o\'zi o\'zgarib boradi.</p>'+
    '<div class="run-actions" style="width:min(92vw,420px)">'+
      '<button class="btn primary lg block" id="calib-ok">Ajoyib</button></div>';
  SFX.pr(); speak("Natija "+reps+". Reja tayyor.");
  $("#calib-ok").addEventListener("click",exitRun);
}

/* --- Yakun --- */
function finish(){
  stopEngines(); clearInterval(clockT);
  const items=Object.values(run.results);
  const total=items.reduce((a,i)=>a+i.sets.reduce((x,y)=>x+y,0),0);
  const dur=Math.round((Date.now()-run.t0)/1000);

  if(run.kind==="workout" && total>0){
    S.sessions.push({
      d:todayKey(), phase:S.phase, total, items, burnout:run.burnout, dur,
      ts:run.t0,                        // aniq vaqt — kun qaysi payti mashq qilinganini bilish uchun
      rpe:run.rpe,                      // oson/normal/qiyin javoblari
      kBefore:run.kBefore,              // mashg'ulot boshidagi koeffitsientlar
      kAfter:structuredClone(S.k),      // oxiridagi
      mode:run.mode,                    // sanash usuli
      restSet:run.restSet,              // sozlamadagi dam
      restReal:run.restReal,            // haqiqiy dam
      warmup:run.warmup,
      bw:currentWeight()                // o'sha kundagi tana vazni (bo'lsa)
    });
    save();
  }
  const rows=items.map(i=>'<div class="sum-line"><span>'+exName(i.ex)+' <span class="dim">'+i.sets.join(" · ")+'</span></span>'+
    '<b>'+i.sets.reduce((a,b)=>a+b,0)+'</b></div>').join("");

  // Zinapoya: kimdir qiyinroq yoki yengilroq variantga o'tdimi?
  const moves = (run.kind==="workout" && total>0) ? checkLadder() : [];
  const moveHTML = moves.map(m=>
    '<div class="next-card" style="border-color:'+(m.dir==="up"?"rgba(227,178,60,.45)":"rgba(43,196,206,.4)")+'">'+
      '<span class="eyebrow" style="color:'+(m.dir==="up"?"var(--gold)":"var(--tile)")+'">'+
        (m.dir==="up"?"★ Yangi daraja":"Yengilroq variantga")+'</span>'+
      '<div style="margin-top:6px;font-size:.95rem">'+m.from+' <span class="dim">→</span> <b>'+m.to+'</b></div>'+
      '<div class="dim" style="font-size:.78rem;margin-top:4px">'+
        (m.dir==="up"
          ? "Takrorlar "+REP_CAP+" ga yetdi. Endi mashqning o'zi qiyinlashadi, takror "+REP_AFTER+" dan boshlanadi."
          : "Bu variant hozircha og'irlik qildi. Bir pog'ona pastda mustahkamlanib olamiz.")+
      '</div></div>').join("");

  $("#stage").innerHTML=
    '<span class="eyebrow">Mashg\'ulot tugadi</span>'+
    '<div class="rest-num num" style="color:var(--tile)">'+total+'</div>'+
    '<div class="ex-focus">takror · '+mmss(dur)+(isDeload()?' · yengil hafta':'')+'</div>'+
    (run.newPR?'<div class="pill gold" style="margin-top:14px">★ Yangi burnout rekordi: '+run.burnout+'</div>':'')+
    moveHTML+
    '<div class="next-card"><span class="eyebrow">Setlar</span><div style="margin-top:6px">'+(rows||'<span class="dim">—</span>')+'</div></div>'+
    '<p class="hint">'+finishNote(total)+'</p>'+
    '<div class="run-actions" style="width:min(92vw,420px)">'+
      '<button class="btn primary lg block" id="fin-ok">Tugatish</button></div>';
  const up=moves.find(m=>m.dir==="up");
  if(up){ SFX.pr(); speak("Tugadi. Yangi daraja: "+up.to); }
  else { SFX.done(); speak("Tugadi. Jami "+total+" takror. Barakalla!"); }
  $("#fin-ok").addEventListener("click",exitRun);
}
function finishNote(total){
  const P=PLANS[S.phase];
  const mon=mondayOf(new Date());
  const cnt=new Set(S.sessions.filter(s=>new Date(s.d+"T00:00:00")>=mon).map(s=>s.d)).size;
  if(cnt>=P.days) return "Bu haftalik norma bajarildi — "+cnt+"/"+P.days+". Dam ham mashqning bir qismi.";
  return "Bu hafta "+cnt+"/"+P.days+". Keyingi mashg'ulot 1-2 kundan keyin.";
}

function exitRun(){
  stopEngines(); clearInterval(clockT); clearInterval(run&&run.timer);
  keepAwake(false);
  run=null;
  show("home");
}
$("#run-exit").addEventListener("click",()=>{
  if(!run) return show("home");
  modal('<h2>Mashg\'ulotni to\'xtatamizmi?</h2>'+
    '<p class="muted" style="font-size:.88rem;margin:10px 0 16px">Bajarilgan setlar saqlanmaydi.</p>'+
    '<div class="grid-2"><button class="btn" onclick="closeModal()">Davom etish</button>'+
    '<button class="btn" style="background:var(--clay);color:#fff;border-color:transparent" id="exit-yes">To\'xtatish</button></div>');
  $("#exit-yes").addEventListener("click",()=>{ closeModal(); exitRun(); });
});

/* ============================================================
   12. SANASH DVIGATELLARI: metronom va kamera
   ============================================================ */
let metroRAF=null, camRAF=null, camStream=null;

function stopEngines(){
  if(run&&run.timer){ clearInterval(run.timer); run.timer=null; }
  if(metroRAF){ cancelAnimationFrame(metroRAF); metroRAF=null; }
  if(camRAF){ cancelAnimationFrame(camRAF); camRAF=null; }
  stopCamera();
  if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){}
}

/* --- Metronom: ekran nafas oladi --- */
function startMetronome(st){
  const T=S.settings.tempo*1000;
  const downT=T*(2/3);
  let t0=performance.now(), phase="down", lastPhase="";
  const breath=$(".breath"), tag=$("#ptag");
  const loop=(now)=>{
    if(!run) return;
    const el=(now-t0)%T;
    phase = el<downT ? "down" : "up";
    const p = phase==="down" ? el/downT : (el-downT)/(T-downT);
    const sc = phase==="down" ? 1-0.35*p : 0.65+0.35*p;
    if(breath){ breath.style.setProperty("--breath",(0.7+sc*0.55).toFixed(3));
                breath.style.setProperty("--breath-o",(0.18+sc*0.3).toFixed(3)); }
    if(phase!==lastPhase){
      if(tag){ tag.textContent = phase==="down"?"PASTGA":"YUQORIGA"; tag.classList.toggle("down",phase==="down"); }
      if(phase==="down"){ SFX.down(); }
      else{ SFX.up(); addRep(st); }
      lastPhase=phase;
    }
    metroRAF=requestAnimationFrame(loop);
  };
  if(tag) tag.textContent="PASTGA";
  SFX.down(); lastPhase="down";
  metroRAF=requestAnimationFrame(loop);
}

/* --- Kamera: ko'krak ostidagi telefon yorug'lik o'zgarishini o'qiydi --- */
async function startCamera(st){
  const hint=$("#cam-hint");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(hint) hint.textContent="Bu brauzerda kamera ishlamaydi — ekranga tegib sanang.";
    $("#tapzone").addEventListener("click",()=>addRep(st));
    return;
  }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user", width:{ideal:320}, height:{ideal:240}}, audio:false });
  }catch(err){
    if(hint) hint.innerHTML="Kameraga ruxsat berilmadi. Hozircha <b>ekranga tegib</b> sanang.";
    $("#tapzone").addEventListener("click",()=>addRep(st));
    return;
  }
  const v=$("#cam-video");
  v.srcObject=camStream;
  try{ await v.play(); }catch(e){}

  const cv=document.createElement("canvas"); cv.width=32; cv.height=24;
  const cx=cv.getContext("2d",{willReadFrequently:true});
  let lo=255, hi=0, state="up", lastRep=0, warm=performance.now(), frames=0;
  const sens=S.settings.camSens;

  const loop=()=>{
    if(!run||!camStream) return;
    camRAF=requestAnimationFrame(loop);
    frames++; if(frames%2) return;             // ~30fps -> ~15 o'lchov/s
    try{ cx.drawImage(v,0,0,32,24); }catch(e){ return; }
    let d;
    try{ d=cx.getImageData(8,6,16,12).data; }catch(e){ return; }
    let sum=0;
    for(let i=0;i<d.length;i+=4) sum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const val=sum/(d.length/4);

    lo = val<lo ? val : lo + (val-lo)*0.0015;
    hi = val>hi ? val : hi + (val-hi)*0.0015;
    const range=hi-lo;

    const fill=$("#cam-fill");
    if(fill) fill.style.setProperty("--v", clamp((val-lo)/Math.max(range,1)*100,0,100).toFixed(0)+"%");

    const now=performance.now();
    const ready = range>12 && now-warm>1500;
    const hint2=$("#cam-hint");
    if(hint2){
      hint2.textContent = ready ? "Sanamoqda — pastga to'liq tushing"
        : "Sozlanmoqda... 2 marta sekin qilib ko'ring";
    }
    if(!ready) return;

    const dT = lo + range*(0.45 - 0.2*sens);
    const uT = lo + range*(0.72 - 0.2*sens);
    if(state==="up" && val<dT){ state="down"; SFX.down(); }
    else if(state==="down" && val>uT){
      state="up";
      if(now-lastRep>450){ lastRep=now; addRep(st); }
    }
  };
  camRAF=requestAnimationFrame(loop);
}
function stopCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const v=$("#cam-video"); if(v) v.srcObject=null;
}

/* ============================================================
   13. ISHGA TUSHIRISH
   ============================================================ */
window.closeModal=closeModal;
renderHome();
show("home");
requestPersist();   // brauzerdan ma'lumotni o'chirmaslikni so'raymiz

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
