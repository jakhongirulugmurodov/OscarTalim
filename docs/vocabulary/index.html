<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<meta name="description" content="Vocabulary — ingliz tilidagi so‘zlarni flashcard va spaced repetition orqali tez yodlash.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<title>Vocabulary</title>
<style>
:root{
  --bg:#f6f4ff; --bg2:#ece8ff; --card:#ffffff; --card2:#f8f7fd; --line:#e4e0f5;
  --ink:#1e1b3a; --muted:#6f6a8f;
  --primary:#6c5ce7; --primary2:#8b7cf6; --pink:#ec4899; --soft:rgba(108,92,231,.12);
  --ok:#16a34a; --ok-bg:#dcfce7; --err:#e11d48; --err-bg:#ffe4e6;
  --amber:#f59e0b; --amber-bg:#fef3c7; --blue:#3b82f6; --blue-bg:#dbeafe;
  --r:20px; --shadow:0 12px 32px -16px rgba(60,40,160,.35);
  --grad:linear-gradient(135deg,#6c5ce7 0%,#a855f7 55%,#ec4899 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110f1f; --bg2:#1a1730; --card:#1d1a33; --card2:#242041; --line:#312c55;
    --ink:#f2f0ff; --muted:#a29dc6; --soft:rgba(139,124,246,.18);
    --ok:#4ade80; --ok-bg:rgba(34,197,94,.16); --err:#fb7185; --err-bg:rgba(244,63,94,.16);
    --amber:#fbbf24; --amber-bg:rgba(245,158,11,.16); --blue:#60a5fa; --blue-bg:rgba(59,130,246,.16);
    --shadow:0 12px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#110f1f; --bg2:#1a1730; --card:#1d1a33; --card2:#242041; --line:#312c55;
  --ink:#f2f0ff; --muted:#a29dc6; --soft:rgba(139,124,246,.18);
  --ok:#4ade80; --ok-bg:rgba(34,197,94,.16); --err:#fb7185; --err-bg:rgba(244,63,94,.16);
  --amber:#fbbf24; --amber-bg:rgba(245,158,11,.16); --blue:#60a5fa; --blue-bg:rgba(59,130,246,.16);
  --shadow:0 12px 32px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5; min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
button,input,textarea,select{font-family:inherit;font-size:1rem;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- Joylashuv ---------- */
.app{display:flex;min-height:100vh}
.nav{
  position:fixed; z-index:20; background:var(--card); border-color:var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem;padding:6px 10px 18px}
.brand img{width:36px;height:36px;border-radius:10px}
.nav a{
  display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--muted);
  font-weight:800; border-radius:14px; position:relative; transition:background .2s,color .2s;
}
.nav a .ic{font-size:1.35rem;line-height:1}
.nav a.active{color:var(--primary);background:var(--soft)}
.nav a .soon{font-size:.62rem;font-weight:800;background:var(--amber-bg);color:var(--amber);border-radius:6px;padding:1px 6px}
main{flex:1;min-width:0}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 110px}

@media (min-width:860px){
  .nav{top:0;left:0;bottom:0;width:230px;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .nav a{padding:12px 14px}
  .nav a:hover{background:var(--card2);color:var(--ink)}
  .nav a.active:hover{background:var(--soft);color:var(--primary)}
  main{margin-left:230px}
  .wrap{padding:32px 32px 48px}
}
@media (max-width:859px){
  .nav{left:0;right:0;bottom:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);
       padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.35)}
  .brand{display:none}
  .nav a{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 2px;flex:1;min-width:0;text-align:center}
  .nav a .soon{position:absolute;top:4px;right:50%;transform:translateX(16px);width:8px;height:8px;padding:0;font-size:0;border-radius:50%;background:var(--amber)}
  .nav a .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}

/* ---------- Umumiy elementlar ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
  padding:13px 20px;font-weight:800;background:var(--grad);color:#fff;
  box-shadow:0 10px 22px -10px rgba(108,92,231,.7);transition:transform .15s,filter .2s,opacity .2s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:11px}
.btn.block{width:100%}
.btn.danger{background:var(--err-bg);color:var(--err);box-shadow:none}
.iconbtn{border:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;
  display:inline-grid;place-items:center;font-size:1.1rem;transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.new{background:var(--blue-bg);color:var(--blue)}
.pill.learning{background:var(--amber-bg);color:var(--amber)}
.pill.learned{background:var(--ok-bg);color:var(--ok)}
.bar{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--grad);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.green>i{background:linear-gradient(90deg,#22c55e,#10b981)}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-title h1{font-size:1.7rem;font-weight:900}
.chip-level{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Bosh sahifa ---------- */
.hero{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{font-size:1.5rem;font-weight:900}
.hero .msg{margin-top:6px;opacity:.95;font-weight:700;max-width:520px;position:relative;z-index:1}
.hero .lvl{margin-top:18px;position:relative;z-index:1}
.hero .lvl .row{display:flex;justify-content:space-between;font-weight:800;font-size:.85rem;margin-bottom:6px}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar>i{background:#fff}
.home-top{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.home-top{grid-template-columns:1.6fr 1fr}}
.goal{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:url(#ringGrad);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:1.4rem;line-height:1}
.ring .num small{display:block;font-size:.72rem;color:var(--muted);font-weight:800;margin-top:3px}
.goal h3{font-size:1.05rem;font-weight:900}
.goal select{margin-top:10px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:6px 8px;font-weight:700}
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{display:flex;align-items:center;gap:12px;padding:16px}
.stat .em{font-size:1.6rem;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:1.35rem;font-weight:900;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted);font-weight:700}
.sec-h{font-size:1.1rem;font-weight:900;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between}
.week{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:38px;border-radius:10px 10px 6px 6px;background:var(--bg2);min-height:6px;position:relative;transition:height .6s}
.week .b.has{background:linear-gradient(180deg,#a78bfa,#6c5ce7)}
.week .b.today{background:var(--grad)}
.week .b em{position:absolute;top:-20px;left:0;right:0;text-align:center;font-style:normal;font-size:.75rem;font-weight:800;color:var(--muted)}
.week .d{font-size:.75rem;font-weight:800;color:var(--muted)}
.week .d.t{color:var(--primary)}
.sections{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.sections{grid-template-columns:repeat(5,1fr)}}
.sec{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;padding:16px;transition:transform .2s}
.sec:hover{transform:translateY(-3px)}
.sec .em{font-size:1.8rem}
.sec b{font-weight:900}
.sec span{font-size:.8rem;color:var(--muted);font-weight:700}
.sec.locked{opacity:.6}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.badge{text-align:center;padding:14px 10px}
.badge .em{font-size:2rem;display:block;filter:grayscale(1);opacity:.35}
.badge b{display:block;font-size:.85rem;font-weight:900;margin-top:4px}
.badge span{font-size:.72rem;color:var(--muted);font-weight:700;display:block;line-height:1.3;margin-top:2px}
.badge.on .em{filter:none;opacity:1;animation:pop .5s}
.badge.on{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;border:2px solid transparent}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ---------- Vocabulary ---------- */
.vhead{padding:18px 20px}
.vhead .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.vhead .row b{font-size:1.2rem;font-weight:900}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin:16px 0}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:800;color:var(--muted);transition:all .2s;white-space:nowrap}
@media (max-width:480px){.tabs button{font-size:.88rem;padding:9px 2px}.page-title h1{font-size:1.45rem}}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 8px 16px -10px rgba(108,92,231,.8)}

.study{display:flex;flex-direction:column;align-items:center;gap:16px}
.sess-top{width:100%;max-width:460px;display:flex;align-items:center;gap:12px}
.sess-top .bar{flex:1}
.sess-top span{font-weight:900;font-size:.9rem;color:var(--muted);min-width:52px;text-align:right}
.stage{width:100%;max-width:460px;height:300px;perspective:1400px;position:relative;touch-action:pan-y}
@media (max-width:859px){.stage{height:min(280px,40vh);min-height:220px}.in-session .counts{display:none}.in-session .vhead{padding:12px 16px}.in-session .tabs{margin:10px 0}.study{gap:12px}}
.fc{position:absolute;inset:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.fc.enter{animation:enter .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.fc.fly-right{transition:transform .32s ease-in,opacity .32s;transform:translateX(130%) rotate(18deg)!important;opacity:0}
.fc.fly-left{transition:transform .32s ease-in,opacity .32s;transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
.fc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;box-shadow:var(--shadow)}
.front{background:var(--grad);color:#fff}
.front .word{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:900;word-break:break-word;line-height:1.15}
.front .hint{position:absolute;bottom:18px;font-size:.8rem;font-weight:800;opacity:.8}
.face .tag{position:absolute;top:16px;left:18px}
.face .spk{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.2);color:#fff;border:0;width:44px;height:44px;border-radius:14px;font-size:1.2rem}
.back{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg)}
.back .spk{background:var(--soft);color:var(--primary)}
.back .en{font-weight:800;color:var(--muted);font-size:1rem}
.back .ipa{font-family:'Charis SIL','Doulos SIL','Lucida Sans Unicode','Segoe UI',sans-serif;color:var(--primary);font-size:1.1rem;margin-top:6px;font-weight:600}
.back .uz{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;margin-top:10px;word-break:break-word;line-height:1.2}
.back .edit{position:absolute;bottom:14px;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.85rem}
.fc .stamp{position:absolute;top:24px;padding:6px 14px;border:3px solid;border-radius:12px;font-weight:900;font-size:1.1rem;opacity:0;z-index:3;pointer-events:none;transform-style:flat}
.fc .stamp.yes{left:22px;color:#16a34a;border-color:#16a34a;transform:rotate(-12deg);background:#fff}
.fc .stamp.no{right:22px;color:#e11d48;border-color:#e11d48;transform:rotate(12deg);background:#fff}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.answer button{border:0;border-radius:18px;padding:16px 10px;font-weight:900;font-size:1.02rem;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
.answer button:active{transform:scale(.95)}
.answer .no{background:var(--err-bg);color:var(--err)}
.answer .yes{background:linear-gradient(135deg,#22c55e,#10b981);color:#fff;box-shadow:0 10px 22px -12px rgba(16,185,129,.9)}
.answer kbd{font-family:inherit;font-size:.7rem;opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 5px}
@media (hover:none){.answer kbd,.kb-hint{display:none}}
.kb-hint{font-size:.8rem;color:var(--muted);font-weight:700;text-align:center}
.xp-float{position:fixed;font-weight:900;color:var(--ok);font-size:1.3rem;pointer-events:none;z-index:60;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.center-card{max-width:460px;width:100%;text-align:center;padding:30px 24px}
.center-card .big{font-size:3.4rem;line-height:1;margin-bottom:10px}
.center-card h2{font-size:1.4rem;font-weight:900}
.center-card p{margin-top:8px;color:var(--muted);font-weight:700}
.center-card .btns{display:grid;gap:10px;margin-top:20px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.sum div{background:var(--card2);border-radius:14px;padding:12px 6px}
.sum b{display:block;font-size:1.4rem;font-weight:900}
.sum span{font-size:.75rem;color:var(--muted);font-weight:800}

.add textarea{width:100%;min-height:200px;border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card2);resize:vertical;line-height:1.6;outline:none;transition:border-color .2s}
.add textarea:focus{border-color:var(--primary)}
.add .help{font-size:.88rem;color:var(--muted);font-weight:600;margin:10px 0 14px;line-height:1.6}
.add .help code{background:var(--bg2);border-radius:6px;padding:1px 6px;font-size:.85rem;color:var(--ink)}
.add .acts{display:flex;gap:10px;flex-wrap:wrap}
.add .acts .btn{flex:1;min-width:180px}
.result{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700;background:var(--ok-bg);color:var(--ok)}
.result.warn{background:var(--amber-bg);color:var(--amber)}

.list-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.list-tools input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;outline:none}
.list-tools input:focus{border-color:var(--primary)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.words{display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.wrow .t{flex:1;min-width:0}
.wrow .en{font-weight:900;word-break:break-word}
.wrow .ipa{color:var(--primary);font-size:.85rem;margin-left:6px;font-weight:600}
.wrow .uz{color:var(--muted);font-weight:700;font-size:.92rem;word-break:break-word}
.wrow .side{display:flex;align-items:center;gap:6px;flex:none}
.wrow .meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.wrow .meta .dots{margin-top:0}
.dots{display:inline-flex;gap:3px;margin-top:4px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--bg2)}
.dots i.on{background:var(--primary2)}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:30px 10px}
.data-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.loading{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--muted);cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--primary)}

/* ---------- Tez orada ---------- */
.soon-page{text-align:center;padding:40px 24px;max-width:520px;margin:30px auto 0}
.soon-page .big{font-size:4rem}
.soon-page h2{font-size:1.6rem;font-weight:900;margin-top:10px}
.soon-page p{color:var(--muted);font-weight:700;margin-top:10px}
.soon-page ul{text-align:left;margin:18px auto 0;padding-left:20px;color:var(--muted);font-weight:700;max-width:380px}

/* ---------- Dialog, toast, konfetti ---------- */
dialog{border:0;border-radius:22px;padding:0;width:min(440px,calc(100% - 32px));background:var(--card);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,16,40,.5);backdrop-filter:blur(3px)}
dialog form{padding:22px;display:grid;gap:12px}
dialog h3{font-size:1.2rem;font-weight:900}
dialog label{font-size:.82rem;font-weight:800;color:var(--muted);display:grid;gap:5px}
dialog input{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;outline:none}
dialog input:focus{border-color:var(--primary)}
dialog .row{display:flex;gap:8px;flex-wrap:wrap}
dialog .row .btn{flex:1}
#toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(380px,calc(100% - 32px));pointer-events:none}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c5ce7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
</svg>
<div class="app">

  <main><div class="wrap" id="view"></div></main>

<dialog id="editDlg">

  </form>
</dialog>

<div id="toasts"></div>
<canvas id="confetti"></canvas>

<script>
"use strict";
/* =========================================================
   Saqlash va holat
   ========================================================= */
const LS_KEY = "vocabulary-app-v1";
const DAY = 864e5;
// Leitner qutilari: 0 — hozir, keyin 1, 2, 4, 8, 16, 32 kun
const INTERVALS = [0, 1, 2, 4, 8, 16, 32].map(d => d * DAY);
const LEARNED_BOX = 3;           // 3-qutiga yetgan so'z "o'zlashtirilgan" hisoblanadi
const SESSION_SIZE = 20;
const MAX_REQUEUE = 3;           // bir sessiyada bitta karta ko'pi bilan 3 marta qaytadi

const defaultState = () => ({
  words: [], xp: 0, streak: 0, bestStreak: 0, lastDay: null,
  days: {}, totalReviews: 0, badges: {}, goal: 20, autoSpeak: false, seq: 0
});
let S = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s && Array.isArray(s.words)) return Object.assign(defaultState(), s);
  }catch(e){}
  return defaultState();
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast("⚠️", "Saqlab bo‘lmadi", "Brauzer xotirasi to‘lgan yoki bloklangan"); }
}

const pad = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function todayRec(){
  const k = dayKey();
  return S.days[k] || (S.days[k] = {reviews: 0, correct: 0, xp: 0, added: 0});
}
function currentStreak(){
  if(!S.lastDay) return 0;
  const y = dayKey(new Date(Date.now() - DAY));
  return (S.lastDay === dayKey() || S.lastDay === y) ? S.streak : 0;
}

/* ---------- So'z holati ---------- */
const isLearned = w => w.box >= LEARNED_BOX;
const isNew = w => w.reps === 0;
const isDue = w => w.due <= Date.now();
const wordStatus = w => isNew(w) ? "new" : isLearned(w) ? "learned" : "learning";
const STATUS_LABEL = {new: "Yangi", learning: "O‘rganilmoqda", learned: "O‘zlashtirilgan"};

function counts(){
  const c = {total: S.words.length, new: 0, learning: 0, learned: 0, due: 0};
  for(const w of S.words){ c[wordStatus(w)]++; if(isDue(w)) c.due++; }
  return c;
}
function level(xp = S.xp){
  const lvl = Math.floor(Math.sqrt(xp / 50)) + 1;
  const from = 50 * (lvl - 1) ** 2, to = 50 * lvl ** 2;
  return {lvl, pct: (xp - from) / (to - from) * 100, left: to - xp};
}

/* =========================================================
   Tarjima va transkripsiya (tashqi bepul API'lar)
   ========================================================= */
const ipaCache = {};
async function translate(text){
  try{
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=uz&dt=t&q=" + encodeURIComponent(text));
    if(r.ok){
      const d = await r.json();
      const t = (d[0] || []).map(x => x[0]).join("").trim();
      if(t) return t;
    }
  }catch(e){}
  try{
    const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|uz&q=" + encodeURIComponent(text));
    if(r.ok){
      const d = await r.json();
      const t = (d.responseData && d.responseData.translatedText || "").trim();
      if(t && !/MYMEMORY|QUERY LENGTH/i.test(t)) return t;
    }
  }catch(e){}
  return "";
}
async function ipaWord(w){
  if(w in ipaCache) return ipaCache[w];
  let res = "";
  try{
    const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(w));
    if(r.ok){
      const d = await r.json();
      for(const e of d){
        const p = e.phonetic || (e.phonetics || []).map(x => x.text).find(Boolean);
        if(p){ res = p.replace(/[\/\[\]]/g, "").trim(); break; }
      }
    }
  }catch(e){ return ""; }   // tarmoq xatosi keshlanmaydi
  return (ipaCache[w] = res);
}
async function transcribe(text){
  const parts = text.toLowerCase().replace(/[^a-z'\s-]/g, " ").split(/\s+/).filter(Boolean);
  if(!parts.length || parts.length > 6) return "";
  const got = [];
  for(const p of parts){
    const x = await ipaWord(p);
    if(!x) return "";
    got.push(x);
  }
  return "/" + got.join(" ") + "/";
}

// So'zlarni navbat bilan to'ldirish (API'larni ortiqcha yuklamaslik uchun)
const enrichQueue = [];
let enriching = false;
function enqueueEnrich(ids){
  for(const id of ids) if(!enrichQueue.includes(id)) enrichQueue.push(id);
  runEnrich();
}
async function runEnrich(){
  if(enriching) return;
  enriching = true;
  while(enrichQueue.length){
    const w = S.words.find(x => x.id === enrichQueue[0]);
    if(w){
      w.st = "wait"; refreshWord(w);
      const [uz, ipa] = await Promise.all([
        w.uz ? w.uz : translate(w.en),
        w.ipa ? w.ipa : transcribe(w.en)
      ]);
      if(!w.uz && uz) w.uz = uz;
      if(!w.ipa && ipa) w.ipa = ipa;
      w.st = w.uz ? "ok" : "fail";
      save(); refreshWord(w);
    }
    enrichQueue.shift();
  }
  enriching = false;
}
function refreshWord(w){
  if(route === "vocab" && tab === "list") renderList();
  if(route === "vocab" && tab === "study" && sess && sess.queue[0] === w.id) paintCardBack(w);
}

/* =========================================================
   Ovoz (SpeechSynthesis)
   ========================================================= */
let voices = [];
function loadVoices(){ voices = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : []; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!("speechSynthesis" in window)){ toast("🔇", "Ovoz mavjud emas", "Brauzeringiz talaffuzni qo‘llamaydi"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = .9;
  const en = voices.filter(v => /^en[-_]/i.test(v.lang));
  const v = en.find(v => /google|samantha|natural|aria|jenny/i.test(v.name) && /US/i.test(v.lang)) || en.find(v => /US/i.test(v.lang)) || en[0];
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* =========================================================
   Ball, streak, badge
   ========================================================= */
const BADGES = [
  {id: "first",      em: "🌱", t: "Birinchi qadam",   d: "Birinchi so‘zni qo‘shding",       ok: c => c.total >= 1},
  {id: "words25",    em: "📚", t: "Kolleksioner",     d: "25 ta so‘z qo‘shildi",           ok: c => c.total >= 25},
  {id: "words100",   em: "🏛️", t: "Lug‘at ustasi",    d: "100 ta so‘z qo‘shildi",          ok: c => c.total >= 100},
  {id: "learned10",  em: "🧠", t: "Xotira chempioni", d: "10 ta so‘z o‘zlashtirildi",      ok: c => c.learned >= 10},
  {id: "learned50",  em: "💎", t: "Olmos xotira",     d: "50 ta so‘z o‘zlashtirildi",      ok: c => c.learned >= 50},
  {id: "goal",       em: "🎯", t: "Mergan",           d: "Kunlik maqsad bajarildi",         ok: () => todayRec().reviews >= S.goal},
  {id: "streak3",    em: "🔥", t: "Uchqun",           d: "3 kunlik streak",                 ok: () => currentStreak() >= 3},
  {id: "streak7",    em: "⚡", t: "Haftalik olov",    d: "7 kunlik streak",                 ok: () => currentStreak() >= 7},
  {id: "reviews100", em: "🏃", t: "Tinimsiz",         d: "100 marta takrorlash",           ok: () => S.totalReviews >= 100},
  {id: "perfect",    em: "🌟", t: "Benuqson",         d: "10+ kartali sessiyada xatosiz",   ok: () => false}
];
function checkBadges(extra){
  const c = counts();
  for(const b of BADGES){
    if(S.badges[b.id]) continue;
    if(b.ok(c) || extra === b.id){
      S.badges[b.id] = Date.now();
      toast(b.em, "Yangi badge: " + b.t, b.d);
      confetti(80);
    }
  }
  save();
}
function addXP(n, el){
  S.xp += n; todayRec().xp += n;
  if(el && n > 0){
    const r = el.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "xp-float"; f.textContent = "+" + n + " XP";
    f.style.left = (r.left + r.width / 2) + "px"; f.style.top = (r.top - 10) + "px";
    document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
  }
}
function markActiveDay(){
  const t = dayKey();
  if(S.lastDay === t) return;
  S.streak = (S.lastDay === dayKey(new Date(Date.now() - DAY))) ? S.streak + 1 : 1;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.lastDay = t;
  if(S.streak > 1) toast("🔥", S.streak + " kunlik streak!", "Ajoyib, shu ruhda davom et");
}

/* =========================================================
   Navigatsiya
   ========================================================= */
const SECTIONS = [
  {id: "home",      em: "🏠", t: "Bosh sahifa", sub: "Progress"},
  {id: "vocab",     em: "🃏", t: "Vocabulary",  sub: "Lug‘at va kartochkalar"},
  {id: "listening", em: "🎧", t: "Listening",   sub: "Tinglab tushunish", soon: true},
  {id: "reading",   em: "📖", t: "Reading",     sub: "O‘qib tushunish",   soon: true},
  {id: "speaking",  em: "🎤", t: "Speaking",    sub: "Talaffuz mashqi",   soon: true},
  {id: "writing",   em: "✍️", t: "Writing",     sub: "Yozish mashqi",     soon: true}
];
const SOON_INFO = {
  listening: ["Qisqa audio matnlar (ovozli o‘qib berish)", "Matndagi yangi so‘zlar lug‘atga qo‘shiladi", "Tinglagandan keyin test savollari"],
  reading:   ["Qisqa hikoya va matnlar", "Yangi so‘z ustiga bosilsa — tarjimasi chiqadi", "Tushunish savollari"],
  speaking:  ["Mikrofon orqali talaffuz", "Yodlangan so‘zlar asosida mashqlar", "To‘g‘ri/noto‘g‘ri feedback va qayta urinish"],
  writing:   ["Yodlangan so‘zlar bilan gap tuzish", "Oddiy grammatika va imlo tekshiruvi", "Xatolar ustida ishlash"]
};
let route = "home", tab = "study";

function renderNav(){
  $("#nav").innerHTML =
    `<div class="brand"><img src="icon.svg" alt="">Vocabulary</div>` +
    SECTIONS.map(s => `<a href="#${s.id}" class="${route === s.id ? "active" : ""}">
      <span class="ic">${s.em}</span><span class="lbl">${s.id === "home" ? "Bosh" : s.t}</span>
      ${s.soon ? `<span class="soon">tez orada</span>` : ""}</a>`).join("");
  // desktop menyuda "Bosh sahifa" to'liq yoziladi
  if(matchMedia("(min-width:860px)").matches) $("#nav a .lbl").textContent = "Bosh sahifa";
}
function go(){
  $("#view").classList.remove("in-session");
  const h = location.hash.slice(1).split("/");
  route = SECTIONS.some(s => s.id === h[0]) ? h[0] : "home";
  if(route === "vocab" && ["study", "add", "list"].includes(h[1])) tab = h[1];
  renderNav();
  const v = $("#view");
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  if(route === "home") renderHome();
  else if(route === "vocab") renderVocab();
  else renderSoon(route);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);
matchMedia("(min-width:860px)").addEventListener("change", renderNav);

/* =========================================================
   Bosh sahifa
   ========================================================= */
const WEEKDAYS = ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"];
const QUOTES = [
  "Har kuni 10 ta so‘z — bir yilda 3650 ta. Kichik qadamlar katta natija beradi.",
  "Xato qilishdan qo‘rqma — «Bilmayman» degan har bir karta seni kuchliroq qiladi.",
  "Til — mushak. Qancha ko‘p mashq qilsang, shuncha kuchli bo‘ladi.",
  "Bugungi 5 daqiqa ertangi ishonchli suhbatning poydevori.",
  "Eng yaxshi vaqt — hozir. Bitta karta bilan boshla.",
  "Takrorlash — bilimning onasi. Spaced repetition buni ilmiy qiladi.",
  "Sen kechagidan bir so‘z ko‘proq bilasan. Bu — g‘alaba."
];
function motivation(c, tr){
  const st = currentStreak();
  if(!c.total) return "Birinchi so‘zlaringni qo‘sh — har qanday katta lug‘at bitta so‘zdan boshlanadi. 🌱";
  if(tr.reviews >= S.goal) return `Bugungi maqsad bajarildi! 🎉 ${st > 1 ? st + " kunlik streakni" : "Natijani"} ertaga ham davom ettir.`;
  if(c.due > 0 && tr.reviews === 0) return `Bugun ${c.due} ta so‘z seni kutyapti. Atigi 5 daqiqa — va miyang rahmat aytadi. 💪`;
  if(c.due > 0) return `Zo‘r ketyapsan! Maqsadgacha ${S.goal - tr.reviews} ta karta qoldi. ${st >= 3 ? "🔥 Streakni uzma!" : ""}`;
  return QUOTES[new Date().getDate() % QUOTES.length];
}
function greeting(){
  const h = new Date().getHours();
  return h < 5 ? "Xayrli tun" : h < 12 ? "Xayrli tong" : h < 18 ? "Xayrli kun" : "Xayrli kech";
}
function renderHome(){
  const c = counts(), tr = todayRec(), L = level(), st = currentStreak();
  const pct = Math.min(1, tr.reviews / S.goal), R = 48, C = 2 * Math.PI * R;
  let week = "";
  const maxR = Math.max(S.goal, ...Array.from({length: 7}, (_, i) => (S.days[dayKey(new Date(Date.now() - (6 - i) * DAY))] || {}).reviews || 0));
  for(let i = 6; i >= 0; i--){
    const d = new Date(Date.now() - i * DAY), rec = S.days[dayKey(d)] || {reviews: 0};
    const h = Math.max(6, rec.reviews / maxR * 110);
    week += `<div class="col"><div class="b ${i === 0 ? "today" : rec.reviews ? "has" : ""}" style="height:${h}px">${rec.reviews ? `<em>${rec.reviews}</em>` : ""}</div>
      <div class="d ${i === 0 ? "t" : ""}">${WEEKDAYS[d.getDay()]}</div></div>`;
  }
  const acc = S.totalReviews ? Math.round(Object.values(S.days).reduce((a, d) => a + d.correct, 0) / S.totalReviews * 100) : 0;
  $("#view").innerHTML = `
    <div class="page-title"><h1>${greeting()}! 👋</h1><span class="chip-level">⭐ ${L.lvl}-daraja</span></div>
    <div class="home-top">
      <div class="card hero">
        <h2>${st > 0 ? "🔥 " + st + " kunlik streak" : "Bugun yangi boshlanish"}</h2>
        <p class="msg">${esc(motivation(c, tr))}</p>
        <div class="lvl"><div class="row"><span>${L.lvl}-daraja · ${S.xp} XP</span><span>keyingisiga ${L.left} XP</span></div>
          <div class="bar"><i style="width:${L.pct}%"></i></div></div>
      </div>
      <div class="card goal">
        <div class="ring"><svg width="110" height="110" viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="${R}"/>
          <circle class="fg" cx="55" cy="55" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - pct)}"/></svg>
          <div class="num"><div>${tr.reviews}<small>/ ${S.goal}</small></div></div></div>
        <div><h3>${pct >= 1 ? "Maqsad bajarildi! ✅" : "Kunlik maqsad"}</h3>
          <p class="muted" style="font-weight:700;font-size:.88rem">Bugun takrorlangan kartalar</p>
          <select id="goalSel" aria-label="Kunlik maqsad">${[10, 20, 30, 50, 100].map(g => `<option value="${g}" ${g === S.goal ? "selected" : ""}>${g} ta karta / kun</option>`).join("")}</select></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <a class="btn" style="flex:1;min-width:200px;text-decoration:none" href="#vocab/${c.total ? "study" : "add"}">${c.total ? (c.due ? `▶ Takrorlashni boshlash (${c.due})` : "▶ Erkin mashq") : "➕ Birinchi so‘zlarni qo‘shish"}</a>
      ${c.total ? `<a class="btn ghost" style="flex:1;min-width:160px;text-decoration:none" href="#vocab/add">➕ So‘z qo‘shish</a>` : ""}
    </div>
    <div class="sec-h">📊 Statistika</div>
    <div class="stats">
      ${statTile("🔥", "var(--amber-bg)", st, "kunlik streak" + (S.bestStreak > st ? ` · rekord ${S.bestStreak}` : ""))}
      ${statTile("⭐", "var(--soft)", S.xp, "jami XP")}
      ${statTile("📚", "var(--blue-bg)", c.total, "lug‘atdagi so‘z")}
      ${statTile("✅", "var(--ok-bg)", c.learned, "o‘zlashtirilgan")}
      ${statTile("⏰", "var(--err-bg)", c.due, "bugun takrorlash")}
      ${statTile("🎯", "var(--soft)", acc + "%", "birinchi urinishda to‘g‘ri")}
    </div>
    <div class="sec-h">📅 Oxirgi 7 kun</div>
    <div class="card"><div class="week">${week}</div></div>
    <div class="sec-h">🧭 Bo‘limlar</div>
    <div class="sections">${SECTIONS.slice(1).map(s => `<a class="card sec ${s.soon ? "locked" : ""}" href="#${s.id}">
      <span class="em">${s.em}</span><b>${s.t}</b><span>${s.soon ? "🔒 Tez orada" : s.sub}</span></a>`).join("")}</div>
    <div class="sec-h">🏅 Badge’lar <span class="muted" style="font-size:.9rem">${Object.keys(S.badges).length} / ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => `<div class="card badge ${S.badges[b.id] ? "on" : ""}"><span class="em">${b.em}</span><b>${b.t}</b><span>${b.d}</span></div>`).join("")}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const fg = $(".ring .fg"); if(fg) fg.style.strokeDashoffset = fg.dataset.off;
  }));
  $("#goalSel").onchange = e => { S.goal = +e.target.value; save(); renderHome(); };
}
function statTile(em, bg, val, label){
  return `<div class="card stat"><div class="em" style="background:${bg}">${em}</div><div><b>${val}</b><span>${label}</span></div></div>`;
}

/* =========================================================
   Tez orada bo'limlari
   ========================================================= */
function renderSoon(id){
  const s = SECTIONS.find(x => x.id === id);
  $("#view").innerHTML = `<div class="card soon-page"><div class="big">${s.em}</div><h2>${s.t}</h2>
    <p>Bu bo‘lim tez orada qo‘shiladi. Hozircha Vocabulary bo‘limida so‘z yodla — keyingi bo‘limlar aynan shu so‘zlar bilan ishlaydi.</p>
    <ul>${SOON_INFO[id].map(x => `<li>${x}</li>`).join("")}</ul>
    <a class="btn" style="margin-top:22px;text-decoration:none" href="#vocab">🃏 Vocabulary’ga o‘tish</a></div>`;
}

/* =========================================================
   Vocabulary bo'limi
   ========================================================= */
let sess = null;          // joriy sessiya
let listFilter = "all", listQuery = "";

function renderVocab(){
  const c = counts();
  const pct = c.total ? c.learned / c.total * 100 : 0;
  $("#view").innerHTML = `
    <div class="page-title"><h1>🃏 Vocabulary</h1>
      <label class="switch"><input type="checkbox" id="autoSpeak" ${S.autoSpeak ? "checked" : ""}> 🔊 Avto-talaffuz</label></div>
    <div class="card vhead">
      <div class="row"><span>O‘zlashtirilgan so‘zlar</span><b>${c.learned} / ${c.total}</b></div>
      <div class="bar green"><i style="width:0" data-w="${pct}%"></i></div>
      <div class="counts">
        <span class="pill new">🆕 Yangi: ${c.new}</span>

function buildQueue(practice){
  let list;
  if(practice){
    // Erkin mashq: eng zaif so'zlar oldinda, ichida aralash
    list = S.words.map(w => ({w, k: w.box + Math.random() * 1.5})).sort((a, b) => a.k - b.k).map(x => x.w);
  }else{
    const due = S.words.filter(isDue);
    const old = due.filter(w => !isNew(w)).sort((a, b) => a.box - b.box || a.due - b.due);
    const fresh = due.filter(isNew).sort((a, b) => a.added - b.added);
    list = [...old, ...fresh];
  }
  return list.slice(0, SESSION_SIZE).map(w => w.id);
}
function startSession(practice){
  const q = buildQueue(practice);
  if(!q.length) return;
  sess = {queue: q, total: q.length, done: 0, correct: 0, wrong: 0, xp: 0, practice, first: {}, requeue: {}, finished: false, flipped: false};
  renderStudy();
}
function nextDueText(){
  const f = S.words.filter(w => !isDue(w)).map(w => w.due).sort((a, b) => a - b)[0];
  if(!f) return "";
  const ms = f - Date.now(), h = Math.round(ms / 36e5), d = Math.round(ms / DAY);
  return ms < 36e5 ? "bir soat ichida" : h < 24 ? `${h} soatdan keyin` : d === 1 ? "ertaga" : `${d} kundan keyin`;
}

function flip(){
  const fc = $("#fc"); if(!fc) return;
  sess.flipped = !sess.flipped;
  fc.classList.toggle("flipped", sess.flipped);
}
function bindSwipe(fc){
  let x0 = null, y0 = 0, dx = 0, moved = false, pid = null;
  const stamps = [$(".stamp.yes", fc), $(".stamp.no", fc)];
  fc.addEventListener("pointerdown", e => {
    if(e.target.closest("[data-say],[data-edit]") || e.button > 0) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; pid = e.pointerId;
    fc.style.transition = "none";
  });
  fc.addEventListener("pointermove", e => {
    if(x0 === null || e.pointerId !== pid) return;
    dx = e.clientX - x0;
    if(!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - y0)){ moved = true; try{ fc.setPointerCapture(pid); }catch(_){} }
    if(!moved) return;
    fc.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    stamps[0].style.opacity = Math.max(0, Math.min(1, dx / 90));
    stamps[1].style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = e => {
    if(x0 === null || e.pointerId !== pid) return;
    x0 = null; fc.style.transition = "";
    if(moved && Math.abs(dx) > 90){ answer(dx > 0, dx > 0 ? $("#yesBtn") : $("#noBtn")); return; }
    fc.style.transform = ""; stamps.forEach(s => s.style.opacity = 0);
    if(!moved && e.type === "pointerup") flip();
  };
  fc.addEventListener("pointerup", end);
  fc.addEventListener("pointercancel", end);
}
let answering = false;
function answer(known, el){
  if(!sess || sess.finished || answering) return;
  const id = sess.queue[0], w = S.words.find(x => x.id === id);
  if(!w) return;
  answering = true;
  const now = Date.now(), firstTry = !(id in sess.first);
  if(firstTry){ sess.first[id] = known; known ? sess.correct++ : sess.wrong++; }

  let gain;
  if(known){
    // Erkin mashqda muddati kelmagan so'z qutisi o'zgarmaydi — progressni sun'iy oshirmaslik uchun
    if(!sess.practice || isDue(w)){
      w.box = Math.min(INTERVALS.length - 1, w.box + 1);
      w.due = now + INTERVALS[w.box];
    }
    gain = sess.practice ? 3 : firstTry ? 10 : 5;
    sess.queue.shift(); sess.done++;
  }else{
    w.box = 0; w.due = now; w.lapses = (w.lapses || 0) + 1;
    gain = 1;
    sess.queue.shift();
    const n = sess.requeue[id] = (sess.requeue[id] || 0) + 1;
    // bilmagan karta 2–3 kartadan keyin qaytadi
    if(n <= MAX_REQUEUE) sess.queue.splice(Math.min(2, sess.queue.length), 0, id);
    else sess.done++;
  }
  w.reps++; w.last = now;

  const tr = todayRec();
  const hadGoal = tr.reviews >= S.goal;
  tr.reviews++; if(firstTry && known) tr.correct++;
  S.totalReviews++;
  markActiveDay();
  addXP(gain, el); sess.xp += gain;
  if(!hadGoal && tr.reviews >= S.goal){ toast("🎯", "Kunlik maqsad bajarildi!", `${S.goal} ta karta — zo‘r natija`); confetti(140); }
  checkBadges();
  save();

  const fc = $("#fc");
  if(fc){ fc.style.transform = ""; fc.classList.add(known ? "fly-right" : "fly-left"); }
  setTimeout(() => { answering = false; nextCard(); }, fc ? 280 : 0);
}

const SAMPLE = [
  ["achieve", "erishmoq", "/əˈtʃiːv/"],
  ["improve", "yaxshilamoq", "/ɪmˈpruːv/"],
  ["curious", "qiziquvchan", "/ˈkjʊəriəs/"],

  ["borrow", "qarzga olmoq", "/ˈbɒrəʊ/"],
  ["although", "garchi, -sa ham", "/ɔːlˈðəʊ/"],
  ["confident", "o‘ziga ishongan", "/ˈkɒnfɪdənt/"],
  ["resilient", "chidamli, bardoshli", "/rɪˈzɪliənt/"],
  ["take care of", "g‘amxo‘rlik qilmoq", "/teɪk keər ɒv/"],
  ["look forward to", "intiqlik bilan kutmoq", "/lʊk ˈfɔːwəd tuː/"]
];
function parseLines(text){
  const out = [];
  for(let line of text.split(/\r?\n/)){
    line = line.replace(/^\s*(\d+[.)]|[-•*])\s+/, "").trim();
    if(!line) continue;
    let en, uz = "", ipa = "";
    if(line.includes("|")){
      [en, uz = "", ipa = ""] = line.split("|").map(s => s.trim());
    }else{
      const m = line.match(/^(.+?)\s*(?:\t|\s[-–—=:]\s)\s*(.+)$/);
      if(m){ en = m[1].trim(); uz = m[2].trim(); } else en = line;
    }
    const ipaIn = (uz.match(/\s*([\/\[][^\/\]]+[\/\]])\s*$/) || [])[1];
    if(ipaIn && !ipa){ ipa = ipaIn; uz = uz.replace(ipaIn, "").trim(); }
    if(ipa && !/^[\/\[]/.test(ipa)) ipa = "/" + ipa + "/";
    if(en) out.push({en: en.replace(/\s+/g, " "), uz, ipa});
  }
  return out;
}
function addWords(items){
  const have = new Set(S.words.map(w => w.en.toLowerCase()));
  const added = []; let dup = 0;
  const now = Date.now();
  for(const it of items){
    const k = it.en.toLowerCase();
    if(have.has(k)){ dup++; continue; }
    have.add(k);
    const w = {id: "w" + (++S.seq) + "_" + now.toString(36), en: it.en, uz: it.uz || "", ipa: it.ipa || "",
      box: 0, due: now, reps: 0, lapses: 0, added: now + added.length, st: (it.uz && it.ipa) ? "ok" : "wait"};
    S.words.push(w); added.push(w);
  }
  todayRec().added += added.length;
  save();
  const need = added.filter(w => !w.uz || !w.ipa).map(w => w.id);
  if(need.length) enqueueEnrich(need);
  checkBadges();
  return {added: added.length, dup, need: need.length};
}

  if(act.dataset.act === "delete"){
    if(!confirm(`«${w.en}» o‘chirilsinmi?`)) return;
    S.words = S.words.filter(x => x.id !== w.id);
    if(sess){ sess.queue = sess.queue.filter(x => x !== w.id); }
    save(); $("#editDlg").close(); afterEdit(null);
  }
  if(act.dataset.act === "reset"){
    w.box = 0; w.due = Date.now(); w.reps = 0; w.lapses = 0;
    save(); toast("↺", "Progress nollandi", w.en);
  }
  if(act.dataset.act === "refetch"){
    const en = f.en.value.trim(); if(!en) return;
    act.disabled = true; act.innerHTML = `<span class="loading"></span> Yuklanmoqda…`;
    const [uz, ipa] = await Promise.all([translate(en), transcribe(en)]);
    if(uz) f.uz.value = uz;
    if(ipa) f.ipa.value = ipa;
    if(!uz && !ipa) toast("📡", "Topilmadi", "Internet aloqasini tekshiring yoki qo‘lda yozing");
    act.disabled = false; act.textContent = "🔄 Avtomatik to‘ldirish";
  }
});
function afterEdit(w){
  if(route !== "vocab") return;
  if(tab === "study" && sess && !sess.finished){
    if(!sess.queue.length){ sess.finished = true; renderStudy(); }
    else if(w && sess.queue[0] === w.id){ const fc = $("#fc"); $(".front .word", fc).textContent = w.en; paintCardBack(w); }
    else if(!w) renderStudy();
  }else if(tab === "list") renderList();
  updateVocabHead();
}

/* ---------- Eksport / import ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `vocabulary-${dayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#importFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  try{
    const d = JSON.parse(await file.text());
    if(!d || !Array.isArray(d.words)) throw 0;
    if(!confirm(`${d.words.length} ta so‘zli fayl. Joriy ma’lumotlar almashtirilsinmi?`)) return;
    S = Object.assign(defaultState(), d); sess = null; save(); go();
    toast("✅", "Import qilindi", d.words.length + " ta so‘z");
  }catch(err){ toast("⚠️", "Fayl noto‘g‘ri", "Faqat shu ilovadan eksport qilingan JSON"); }
});

document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]");
  if(say){ e.stopPropagation(); const w = sess && S.words.find(x => x.id === sess.queue[0]); if(w) speak(w.en); return; }
  const sw = e.target.closest("[data-sayw]");
  if(sw){ const w = S.words.find(x => x.id === sw.dataset.sayw); if(w) speak(w.en); return; }
  const ed = e.target.closest("[data-edit]");
  if(ed){ e.stopPropagation(); openEdit(ed.dataset.edit); }
});
document.addEventListener("keydown", e => {
  if(route !== "vocab" || tab !== "study" || !sess || sess.finished) return;
  if($("#editDlg").open || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); answer(true, $("#yesBtn")); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); answer(false, $("#noBtn")); }
});

/* ---------- Toast ---------- */
function toast(em, title, sub){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span class="em">${em}</span><div>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 300); }, 3200);
}

/* ---------- Konfetti ---------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function confetti(n = 120){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const colors = ["#6c5ce7", "#a855f7", "#ec4899", "#f59e0b", "#22c55e", "#3b82f6"];
  for(let i = 0; i < n; i++) parts.push({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4,
    s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: colors[i % colors.length], life: 0
  });
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 240);
  for(const p of parts){
    p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if(!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}
