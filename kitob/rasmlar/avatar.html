<!doctype html>

<html><head><meta charset="utf-8">
<link href="shrift/shrift.css" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:640px;height:640px;overflow:hidden;position:relative;
 background:radial-gradient(360px 360px at 50% 40%,#5a3c1f 0%,#2a2026 58%,#141119 100%)}
.stack{position:absolute;left:50%;top:118px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.b{height:58px;border-radius:6px 12px 12px 6px;margin-top:-1px;position:relative;display:flex;align-items:center;justify-content:center;

 box-shadow:inset 0 -8px 10px rgba(0,0,0,.25),inset 0 4px 6px rgba(255,255,255,.08),0 6px 12px rgba(0,0,0,.45)}
.b:before{content:"";position:absolute;right:0;top:7px;bottom:7px;width:16px;border-radius:0 9px 9px 0;
 background:repeating-linear-gradient(#f3e6c8 0 2px,#d8c7a3 2px 4px)}
.b:after{content:"";position:absolute;left:20px;top:0;bottom:0;width:5px;background:rgba(232,181,96,.85)}
.name{position:absolute;left:0;right:0;top:452px;text-align:center;font-family:"Playfair Display",serif;font-weight:900;font-size:66px;line-height:1;color:#fbf3e3}
.name em{font-style:normal;color:#e8b560}
</style></head><body>
<div class="stack">
  <div class="b" style="width:270px;background:#4b2a55;transform:rotate(-3deg) translateX(-10px)">SHUM BOLA</div>
  <div class="b" style="width:330px;background:#1f4d3a;transform:rotate(2deg) translateX(8px)">SAODAT ASRI</div>
  <div class="b" style="width:360px;background:#7b1e2b;transform:rotate(-1deg)">MUQADDIMA</div>
  <div class="b" style="width:380px;background:#2a3f6b;transform:rotate(1deg) translateX(-6px)">O'TKAN KUNLAR</div>
  <div class="b" style="width:400px;background:#8a5a1f">ALKIMYOGAR</div>
</div>
<div class="name">Kitob <em>olami</em></div>
</body></html>
