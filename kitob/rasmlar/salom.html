<!doctype html>
<!-- Kitob olami — /start rasmi (1280×720). PNG: node chiz.mjs -->
<html><head><meta charset="utf-8">
<link href="shrift/shrift.css" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:Lora,serif;
 background:radial-gradient(900px 520px at 78% 18%,#3b2a1a 0%,#1d1a22 55%,#121019 100%);color:#f4e9d4;position:relative}
.glow{position:absolute;right:300px;top:-60px;width:520px;height:520px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,196,110,.35),rgba(255,196,110,0) 70%)}
.lamp{position:absolute;right:560px;top:0;width:2px;height:70px;background:#6b5638}
.lamp:after{content:"";position:absolute;left:-34px;top:70px;width:70px;height:34px;border-radius:70px 70px 6px 6px;background:linear-gradient(#c9953f,#8a6224)}
.txt{position:absolute;left:84px;top:88px;width:640px}
.brand{letter-spacing:.32em;font-size:20px;color:#d9ae62;font-weight:600;display:flex;align-items:center;gap:14px}
.brand i{display:inline-block;width:46px;height:1px;background:#d9ae62}
h1{font-family:"Playfair Display",serif;font-weight:900;font-size:78px;line-height:1.02;margin-top:26px;color:#fbf3e3}
h1 em{font-style:normal;color:#e8b560}
.salom{font-style:italic;font-size:30px;color:#e6d6b8;margin-top:22px}
.juma{margin-top:30px;display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border:1.5px solid #d9ae62;border-radius:40px;font-size:21px;color:#f4e2bd;background:rgba(217,174,98,.08)}
.juma b{color:#ffcf7a}
.shelf{position:absolute;left:0;right:0;bottom:0;height:300px}
.books{position:absolute;right:44px;bottom:46px;display:flex;align-items:flex-end;gap:5px}
.b{position:relative;border-radius:3px 3px 1px 1px;box-shadow:inset -6px 0 10px rgba(0,0,0,.28),inset 4px 0 6px rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.4);
 writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;
 font-family:"Playfair Display",serif;font-weight:700;font-size:20px;letter-spacing:.05em;color:#f7ecd6}
.b:before,.b:after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(232,181,96,.75)}
.b:before{top:14px}.b:after{bottom:14px}
.flat{display:flex;flex-direction:column;align-items:flex-end;margin-left:10px}
.f{height:40px;border-radius:3px;margin-top:2px;position:relative;box-shadow:inset 0 -6px 8px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.4);
 font-family:"Playfair Display",serif;font-weight:700;font-size:15px;color:#f7ecd6;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.f:before,.f:after{content:"";position:absolute;top:0;bottom:0;width:3px;background:rgba(232,181,96,.75)}
.f:before{left:12px}.f:after{right:12px}
.board{position:absolute;left:600px;right:0;bottom:22px;height:26px;border-radius:4px 0 0 4px;
 background:linear-gradient(#7a5530,#553719);box-shadow:0 10px 24px rgba(0,0,0,.55)}
</style></head><body>
<div class="glow"></div><div class="lamp"></div>
<div class="txt">
  <div class="brand"><i></i>KITOB OLAMI<i></i></div>
  <h1>Kitoblar<br><em>olamiga</em><br>xush kelibsiz</h1>
  <div class="salom">Assalomu alaykum, aziz kitobxon!</div>
  <div class="juma">📚 Har <b>juma</b> — bitta kitob aksiya narxida</div>
</div>
<div class="board"></div>
<div class="books">
  <div class="b" style="width:66px;height:330px;background:#7b1e2b">Muqaddima</div>
  <div class="b" style="width:60px;height:300px;background:#1f4d3a">Saodat asri qissalari</div>
  <div class="b" style="width:50px;height:262px;background:#2a3f6b">O'tkan kunlar</div>
  <div class="b" style="width:56px;height:310px;background:#8a5a1f">Alkimyogar</div>
  <div class="b" style="width:46px;height:246px;background:#4b2a55">Sariq devni minib</div>
  <div class="b" style="width:62px;height:322px;background:#23343b">Ikki eshik orasi</div>
  <div class="b" style="width:52px;height:280px;background:#8c2f22">Kecha va kunduz</div>
  <div class="flat">
    <div class="f" style="width:176px;background:#355e4a">Atom odatlar</div>
    <div class="f" style="width:214px;background:#6b2437">Boy ota, kambag'al ota</div>
    <div class="f" style="width:186px;background:#2f4a6e">Shum bola</div>
  </div>
</div>
</body></html>
